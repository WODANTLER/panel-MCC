20422.00%20L%20176.00%20422.00%20L%20176.00%20717.00%20L%20176.00%201012.00%20L%20174.00%201012.00%20L%20172.00%201012.00%20L%20172.00%201011.11%20Z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<title>Taller · Marbella Custom Cars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  /* Tema claro. La marca es negra y oro, pero esto es una herramienta de
     trabajo que se usa de dia y en un taller con la persiana abierta:
     el fondo blanco se lee con sol y cansa menos la vista. El oro se
     oscurece a #8F6A2A porque el original no contrasta sobre blanco. */
  --fondo:#FFFFFF; --panel:#FAFAF8; --panel2:#F2F2EE;
  --linea:#E7E7E2; --linea2:#D5D5CE;
  --tinta:#14141A; --dim:#71717C;
  --oro:#8F6A2A; --oro-claro:#C9A24E; --oro-suave:#F6EFE0;
  --espera:#3C6D94; --alerta:#BE3B26; --alerta-suave:#FBEBE8;
  --display:'Archivo',system-ui,sans-serif;
  --sans:'Instrument Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --dia:34px;
  --carril:44px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fondo);color:var(--tinta);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:60px;
}
h1,h2,h3{margin:0;font-family:var(--display);font-variation-settings:'wdth' 84,'wght' 700;
  letter-spacing:.01em;text-transform:uppercase}
.env{max-width:1180px;margin:0 auto;padding:0 clamp(14px,3vw,28px)}

/* ── cabecera ── */
.top{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.top-in{display:flex;align-items:center;gap:14px;padding:12px 0}
.marca{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.marca svg{width:30px;height:30px;flex:none}
.marca b{font-family:var(--display);font-variation-settings:'wdth' 78,'wght' 700;
  font-size:15px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.marca span{color:var(--dim);font-size:11px;font-family:var(--mono);letter-spacing:.08em}

/* ── pestañas ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--linea);margin-top:6px}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--dim);font-family:var(--display);font-variation-settings:'wdth' 84,'wght' 600;
  font-size:13px;letter-spacing:.07em;text-transform:uppercase;
  padding:11px 14px;cursor:pointer;transition:color .18s,border-color .18s}
.tab:hover{color:var(--tinta)}
.tab[aria-selected="true"]{color:var(--oro);border-bottom-color:var(--oro)}
.tab:focus-visible{outline:2px solid var(--oro);outline-offset:-2px}
.vista{display:none;padding-top:22px}
.vista.on{display:block}

/* ── indicadores ── */
.kpis{display:grid;gap:1px;background:var(--linea);border:1px solid var(--linea);
  grid-template-columns:repeat(2,1fr);margin-bottom:26px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--panel);padding:15px 16px}
.kpi .et{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);display:block;margin-bottom:7px}
.kpi .n{font-family:var(--display);font-variation-settings:'wdth' 76,'wght' 700;
  font-size:clamp(26px,5.6vw,34px);line-height:1;letter-spacing:-.01em}
.kpi .n small{font-size:.45em;font-variation-settings:'wdth' 84,'wght' 500;
  color:var(--dim);margin-left:4px;letter-spacing:.02em}
.kpi.destaca{background:var(--oro-suave)}
.kpi.destaca .n{color:var(--oro)}
.kpi.riesgo .n{color:var(--alerta)}
.kpi .sub{font-size:11.5px;color:var(--dim);margin-top:5px}

/* ── barra de seccion ── */
.cab{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.cab h2{font-size:14px;letter-spacing:.09em}
.cab .nota{font-size:11.5px;color:var(--dim);margin-left:auto;font-family:var(--mono)}

/* ── linea de tiempo de plazas ── */
.tl-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.btn{appearance:none;background:#fff;border:1px solid var(--linea2);color:var(--tinta);
  font-family:var(--sans);font-size:13px;font-weight:500;padding:8px 13px;cursor:pointer;
  transition:border-color .18s,background .18s,color .18s}
.btn:hover{border-color:var(--oro);color:var(--oro);background:var(--oro-suave)}
.btn:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.btn.pri{background:var(--tinta);border-color:var(--tinta);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--oro);border-color:var(--oro);color:#fff}
.btn.mini{padding:6px 10px;font-size:12px}

.tl{border:1px solid var(--linea2);background:#fff;overflow-x:auto;
  -webkit-overflow-scrolling:touch;box-shadow:0 1px 2px rgba(20,20,26,.04)}
.tl-in{min-width:max-content;position:relative}
.tl-fila{display:flex;align-items:stretch;border-bottom:1px solid var(--linea)}
.tl-fila:last-child{border-bottom:0}
.tl-et{width:96px;flex:none;position:sticky;left:0;z-index:3;background:var(--panel2);
  border-right:1px solid var(--linea2);display:flex;flex-direction:column;
  justify-content:center;padding:0 11px}
.tl-et b{font-family:var(--display);font-variation-settings:'wdth' 80,'wght' 700;
  font-size:12.5px;letter-spacing:.06em}
.tl-et i{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--dim);
  letter-spacing:.05em}
.tl-pista{position:relative;display:flex;height:var(--carril)}
.tl-cab .tl-pista{height:38px}
.tl-cel{width:var(--dia);flex:none;border-right:1px solid #F0F0EC}
.tl-cel.finde{background:#F6F6F2}
.tl-cab{border-bottom:1px solid var(--linea2);background:var(--panel)}
.tl-sem{background:var(--panel2)}
.tl-sem .tl-pista{height:26px}
.tl-sem .tl-et i{font-style:normal;font-family:var(--mono);font-size:9px;
  color:var(--dim);letter-spacing:.11em}
.tl-sem-c{flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim);
  border-right:1px solid var(--linea2)}
.tl-sem-c.actual{color:var(--oro);font-weight:600;background:var(--oro-suave)}
.tl-cel.corte{border-left:1px solid var(--linea2)}
.tl-cab .tl-cel{display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.25}
.tl-cab .tl-cel b{color:var(--tinta);font-weight:600;font-size:12px}
.tl-cab .tl-cel.hoy b{color:var(--oro)}
.hoy-linea{position:absolute;top:0;bottom:0;width:2px;background:var(--oro);
  z-index:2;pointer-events:none}

/* barras de reserva */
.res{position:absolute;top:5px;bottom:5px;border-radius:2px;cursor:pointer;
  display:flex;align-items:center;padding:0 8px;gap:6px;overflow:hidden;
  border:1px solid transparent;transition:transform .14s,box-shadow .14s;z-index:1}
.res:hover{box-shadow:0 3px 10px rgba(20,20,26,.16);transform:translateY(-1px)}
.res:focus-visible{outline:2px solid var(--tinta);outline-offset:1px}
.res b{font-family:var(--display);font-variation-settings:'wdth' 78,'wght' 700;
  font-size:11.5px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0}
.res i{font-style:normal;font-family:var(--mono);font-size:9.5px;opacity:.78;
  white-space:nowrap;margin-left:auto;flex:none}
.res.curso{background:var(--oro-claro);border-color:#B08D3F;color:#241A05}
.res.reservado{background:var(--oro-suave);border-color:var(--oro-claro);color:var(--oro)}
.res.espera{background:var(--espera);color:#fff}
.res.sinrecoger{background:var(--alerta);color:#fff}
@media(prefers-reduced-motion:no-preference){
  .res.sinrecoger{animation:late 2.6s ease-in-out infinite}
}
@keyframes late{0%,100%{box-shadow:0 0 0 0 rgba(190,59,38,.45)}
                60%{box-shadow:0 0 0 7px rgba(190,59,38,0)}}
.res.bloqueo{background:repeating-linear-gradient(45deg,
  #F1F1ED 0 6px, #FAFAF8 6px 12px);
  border-color:var(--linea2);color:var(--dim);cursor:default}

.leyenda{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:11.5px;color:var(--dim)}
.leyenda span{display:flex;align-items:center;gap:6px}
.pt{width:11px;height:11px;border-radius:2px;flex:none;border:1px solid rgba(20,20,26,.12)}

/* ── formulario ── */
.hoja{position:fixed;inset:0;z-index:90;background:rgba(20,20,26,.42);
  display:none;align-items:flex-end;justify-content:center}
.hoja.on{display:flex}
@media(min-width:720px){.hoja{align-items:center}}
.hoja-c{background:#fff;border:1px solid var(--linea2);width:100%;
  max-width:540px;max-height:92vh;overflow-y:auto;padding:20px;
  box-shadow:0 20px 60px rgba(20,20,26,.22)}
.hoja-c h3{font-size:14px;letter-spacing:.08em;margin-bottom:16px}
.campo{margin-bottom:13px}
.campo label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.campo input,.campo select{width:100%;background:#fff;border:1px solid var(--linea2);
  color:var(--tinta);font-family:var(--sans);font-size:16px;padding:11px 12px;
  border-radius:0;appearance:none}
.campo input:focus,.campo select:focus{outline:0;border-color:var(--oro);
  box-shadow:0 0 0 3px var(--oro-suave)}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.acc{display:flex;gap:9px;margin-top:18px}
.acc .btn{flex:1;justify-content:center;text-align:center}
.borrar{color:var(--alerta);border-color:#E9C4BC}
.borrar:hover{border-color:var(--alerta);color:var(--alerta);background:var(--alerta-suave)}

/* ── graficos ── */
.barras{display:flex;align-items:flex-end;gap:clamp(5px,1.6vw,14px);height:210px;
  padding:0 2px;border-bottom:1px solid var(--linea2);margin-bottom:9px}
.mes{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:3px;height:100%;min-width:0}
.par{display:flex;align-items:flex-end;gap:2px;width:100%;height:100%;justify-content:center}
.bar{width:44%;min-height:2px;position:relative;transition:filter .16s}
.bar.i{background:linear-gradient(180deg,var(--oro-claro),#E3D2A8)}
.bar.g{background:#D9D9D3}
.mes:hover .bar{filter:brightness(.94)}
.mes-et{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.04em}
.mes.neg .mes-et{color:var(--alerta);font-weight:600}

.tabla{width:100%;border-collapse:collapse;font-size:13.5px}
.tabla th{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);text-align:left;padding:9px 10px;border-bottom:1px solid var(--linea2);
  font-weight:500;white-space:nowrap}
.tabla td{padding:10px;border-bottom:1px solid var(--linea)}
.tabla td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.tabla tr:hover td{background:var(--panel)}
.pos{color:var(--oro)} .neg{color:var(--alerta)}
.pill{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;
  text-transform:uppercase;padding:3px 7px;border:1px solid var(--linea2);color:var(--dim);
  background:var(--panel)}

.aviso{border-left:3px solid var(--oro-claro);background:var(--oro-suave);
  padding:13px 15px;margin:22px 0;font-size:13.5px;color:#4A4230}
.aviso b{color:var(--oro);font-weight:600}
.vacio{padding:34px 16px;text-align:center;color:var(--dim);font-size:13.5px}
.pie{margin-top:40px;padding:18px 0;border-top:1px solid var(--linea);
  font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.05em}


/* ── calendario mensual ─────────────────────────────────────────────── */
.mes-nav{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.mes-tit{font-size:clamp(15px,3.4vw,19px);letter-spacing:.05em;
  font-variation-settings:'wdth' 82,'wght' 700;text-transform:capitalize;min-width:0}
.btn.flecha{font-size:17px;line-height:1;padding:5px 12px;font-family:var(--display)}

.sem{border:1px solid var(--linea2);background:#fff;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(20,20,26,.04)}
.sem.esta{border-color:var(--oro-claro);box-shadow:0 1px 3px rgba(143,106,42,.16)}
.sem-cab{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  padding:9px 13px;background:var(--panel);border-bottom:1px solid var(--linea)}
.sem.esta .sem-cab{background:var(--oro-suave)}
.sem-cab b{font-family:var(--display);font-variation-settings:'wdth' 82,'wght' 700;
  font-size:12.5px;letter-spacing:.07em;text-transform:uppercase}
.sem-cab span{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.sem-cab em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--oro);
  letter-spacing:.08em;text-transform:uppercase}
.sem-cab i{font-style:normal;margin-left:auto;font-family:var(--mono);font-size:10.5px;
  color:var(--dim)}

.rej-fila{display:flex;align-items:stretch;border-bottom:1px solid var(--linea)}
.rej-fila:last-child{border-bottom:0}
.rej-et{width:clamp(74px,18vw,96px);flex:none;border-right:1px solid var(--linea2);
  background:var(--panel2);display:flex;flex-direction:column;justify-content:center;
  padding:0 9px;overflow:hidden}
.rej-et b{font-family:var(--display);font-variation-settings:'wdth' 80,'wght' 700;
  font-size:12px;letter-spacing:.05em;white-space:nowrap}
.rej-et i{font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--dim);
  letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rej-pista{position:relative;display:flex;flex:1;min-width:0;height:42px}
.rej-dias .rej-pista{height:34px}
.rej-dias .rej-et{background:var(--panel)}
.rej-cel{flex:1;min-width:0;border-right:1px solid #F0F0EC;
  display:flex;align-items:center;justify-content:center;gap:4px}
.rej-cel:last-child{border-right:0}
.rej-cel.fuera{background:#FAFAF8}
.rej-cel.hoy{background:var(--oro-suave)}
.rej-dias .rej-cel{font-family:var(--mono);font-size:10px;color:var(--dim)}
.rej-dias .rej-cel b{color:var(--tinta);font-weight:600;font-size:12.5px}
.rej-dias .rej-cel.fuera b{color:var(--dim);font-weight:400}
.rej-dias .rej-cel.hoy b{color:var(--oro)}

/* un trabajo que cruza de semana se parte: el borde plano avisa de que sigue */
.res.viene{border-top-left-radius:0;border-bottom-left-radius:0;
  border-left:2px solid rgba(20,20,26,.28)}
.res.sigue{border-top-right-radius:0;border-bottom-right-radius:0;
  border-right:2px solid rgba(20,20,26,.28)}
/* movido de fecha: hay que llamar al cliente */
.res.avisar::after{content:"!";position:absolute;top:2px;right:4px;
  font-family:var(--mono);font-size:10px;font-weight:600;color:var(--alerta)}
/* Coche metido en la plaza de reserva: se permite, pero se ve que es
   una excepción y que esa plaza ya no está libre para imprevistos. */
.res.enreserva{box-shadow:inset 0 0 0 2px var(--alerta)}

@media(max-width:560px){
  .rej-pista{height:38px}
  .res b{font-size:10.5px}
  .res i{display:none}
  .sem-cab i{width:100%;margin-left:0}
}

/* ── añadidos ─────────────────────────────────────────────────────── */
.choque{border-left:3px solid var(--alerta);background:var(--alerta-suave);
  padding:12px 15px;margin:14px 0;font-size:13px;color:#6B2318}
.saldo{font-family:var(--mono);font-size:11px}
.saldo.debe{color:var(--alerta)} .saldo.ok{color:var(--oro)}
.cobros{margin-top:16px;border-top:1px solid var(--linea);padding-top:14px}
.cobro{display:flex;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--linea);font-size:13px}
.cobro .x{margin-left:auto;background:none;border:0;color:var(--dim);cursor:pointer;
  font-size:18px;line-height:1;padding:2px 8px}
.cobro .x:hover{color:var(--alerta)}
.mini-form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}
.anio{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.buscar{flex:1;min-width:150px;background:#fff;border:1px solid var(--linea2);
  color:var(--tinta);font-family:var(--sans);font-size:14px;padding:7px 11px}
.buscar:focus{outline:0;border-color:var(--oro);box-shadow:0 0 0 3px var(--oro-suave)}

/* ══════════════════════════════════════════════════════════════════════
   Panel de taller · Marbella Custom Cars
   Version de un solo archivo, para poder verla sin instalar nada.
   ══════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';

/* ─── catalogo ─────────────────────────────────────────────────────── */
const SERVICIOS_INI = [
  {n:'Lavado Gold',          d:1, p:150},
  {n:'Lavado Black',         d:1, p:250},
  {n:'Lavado Platinum',      d:1, p:350},
  {n:'Lavado de motor',      d:1, p:90},
  {n:'Pulido + cerámico',    d:3, p:800},
  {n:'PPF Full Front', sena:true,       d:3, p:1800},
  {n:'PPF Full Body', sena:true,        d:7, p:4200},
  {n:'PPF sectorizado', sena:true,      d:2, p:0},
  {n:'Wrapping total', sena:true,       d:5, p:3500},
  {n:'Wrapping parcial', sena:true,     d:2, p:700},
  {n:'Limpieza de interior', d:1, p:250},
  {n:'Llantas (4)',          d:2, p:560},
  {n:'Pinzas de freno',      d:1, p:250},
  {n:'Cristales',            d:1, p:190},
  {n:'Sacabollos',           d:1, p:0},
  {n:'Body kit / carbono',   d:4, p:0},
  {n:'Retapizado',           d:5, p:0},
  {n:'Otro',                 d:1, p:0}
];
/* Plazas y servicios viven en los datos, no en el codigo: Joaquin puede
   renombrarlos, cambiar precios o duraciones, y anadir o quitar plazas. */
const PLAZAS_INI = [
  {id:1,nom:'Plaza 1',uso:'Trabajo largo',libre:false},
  {id:2,nom:'Plaza 2',uso:'Trabajo largo',libre:false},
  {id:3,nom:'Plaza 3',uso:'PPF / vinilo',libre:false},
  {id:4,nom:'Plaza 4',uso:'Lavado / rápido',libre:false},
  {id:5,nom:'Plaza 5',uso:'Imprevistos',libre:true}
];
const plazas      = () => D.plazas || [];
const esLibre     = id => !!(plazas().find(p=>p.id===+id)||{}).libre;
const reservables = () => plazas().filter(p=>!p.libre);
const servicios   = () => D.servicios || [];
/* Solo el PPF y el vinilo se cobran al 50 % por adelantado: hay que apartar
   material y bloquear la plaza. El resto se cobra al entregar. */
const pideSena = nom => !!(servicios().find(x=>x.n===nom)||{}).sena;
const ESTADOS = {reservado:'Reservado',curso:'En curso',espera:'Esperando',
                 sinrecoger:'Sin recoger',entregado:'Entregado'};
const CATEGORIAS = {material:'Material (PPF, vinilos, químicos)',
  fijo:'Fijos (alquiler, luz, agua, alarma)', personal:'Personal y horas de terceros',
  prestamo:'Préstamos', marketing:'Publicidad', otro:'Otros'};
const VIAS = ['efectivo','transferencia','tarjeta','banco'];

/* Tipos fiscales. Van en los datos y se editan en Ajustes: los fija la
   gestoría, no el programa. Los valores de partida son los que nos pasó
   Joaquín; conviene que su asesor los confirme antes de fiarse. */
const FISCAL_INI = {iva:21, irpf:20, viasFacturadas:['transferencia','tarjeta','banco']};
const fiscal = () => D.fiscal || FISCAL_INI;

/** ¿Este cobro va con factura? Por defecto, todo lo que no es efectivo. */
const esFacturado = c =>
  c.facturado !== undefined ? !!c.facturado : fiscal().viasFacturadas.includes(c.via);

/** Base imponible: si lleva factura, el importe cobrado incluye el IVA. */
const baseDe = c => esFacturado(c) ? (c.importe||0)/(1+fiscal().iva/100) : (c.importe||0);
const ivaDe  = c => esFacturado(c) ? (c.importe||0) - baseDe(c) : 0;

const TRIMESTRE = f => Math.floor(aFecha(f).getMonth()/3)+1;

/** Cuentas del trimestre: lo que hay que declarar y lo que queda limpio. */
function trimestres(anio){
  const t = [1,2,3,4].map(n=>({n, baseFact:0, ivaRep:0, efectivo:0,
                               gastos:0, ivaSop:0, baseGasto:0, sinFactura:0}));
  D.cobros.forEach(c=>{
    const d=aFecha(c.fecha); if(d.getFullYear()!==anio) return;
    const x=t[TRIMESTRE(c.fecha)-1];
    if(esFacturado(c)){ x.baseFact+=baseDe(c); x.ivaRep+=ivaDe(c); }
    else x.efectivo+=c.importe||0;
  });
  D.gastos.forEach(g=>{
    const d=aFecha(g.fecha); if(d.getFullYear()!==anio) return;
    const x=t[TRIMESTRE(g.fecha)-1];
    x.gastos+=g.importe||0;                         // sale de la caja igual
    /* Pero solo desgrava lo que tiene factura. Un gasto sin factura se paga
       y punto: ni resta beneficio ni devuelve IVA. */
    if(g.conFactura!==false){
      const base=(g.importe||0)/(1+fiscal().iva/100);
      x.baseGasto+=base;
      x.ivaSop+=(g.importe||0)-base;
    } else x.sinFactura=(x.sinFactura||0)+(g.importe||0);
  });
  t.forEach(x=>{
    x.ivaPagar = x.ivaRep - x.ivaSop;               // modelo 303
    x.beneficio = x.baseFact - x.baseGasto;         // beneficio declarable
    x.irpf = Math.max(0, x.beneficio) * fiscal().irpf/100;
    x.neto = x.baseFact + x.efectivo - x.gastos - Math.max(0,x.ivaPagar) - x.irpf;
  });
  return t;
}


/* ─── fechas y formato ─────────────────────────────────────────────── */
const hoy=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const p2=n=>String(n).padStart(2,'0');
const aIso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const aFecha=s=>{const[a,m,d]=String(s).split('-').map(Number);return new Date(a,m-1,d)};
const sumar=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diasEntre=(a,b)=>Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())
                                  -Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);
const salida=t=>sumar(aFecha(t.entra),Math.max(1,t.dias)-1);
/* Lunes de la semana de esa fecha. La rejilla siempre empieza en lunes:
   si arranca en un dia cualquiera, las semanas no se distinguen y el
   calendario se lee como una tira sin estructura. */
const lunes=d=>{const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x;};
const NF=new Intl.NumberFormat('es-ES');
const eur=n=>NF.format(Math.round(n||0));
const fCorta=d=>d.toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ─── conexión con Firebase ────────────────────────────────────────────
   Las claves no son secretas: viajan al navegador de todas formas. Lo que
   protege los datos son las reglas de Firestore, que solo dejan entrar a
   los dos correos autorizados, y la contraseña de cada uno.            */
const FB = {
  apiKey: "AIzaSyBDw1Zbdc0tZx3DezA2rFwiYEI51xIJTF8",
  authDomain: "marbella-custom-cars.firebaseapp.com",
  projectId: "marbella-custom-cars",
  storageBucket: "marbella-custom-cars.firebasestorage.app",
  messagingSenderId: "237639782771",
  appId: "1:237639782771:web:4819284fcf31cc3bd6f506"
};
/* Si el SDK no llegó a cargar —sin conexión, o un entorno que bloquea
   scripts externos— el resto del archivo reventaría sin decir nada y la
   pantalla se quedaría muerta. Mejor avisar. */
if(typeof firebase === 'undefined'){
  document.addEventListener('DOMContentLoaded', ()=>{
    const e=document.getElementById('ac-err');
    if(e){ e.hidden=false;
      e.innerHTML='<b>No se ha podido cargar Firebase.</b><br>'+
        'Esto pasa si no hay conexión, o si estás abriendo el archivo desde el '+
        'ordenador en vez de desde una dirección web. Súbelo a GitHub Pages y '+
        'ábrelo desde ahí.'; }
    const b=document.getElementById('ac-ok'); if(b) b.disabled=true;
  });
  throw new Error('SDK de Firebase no disponible');
}

firebase.initializeApp(FB);
const auth = firebase.auth();
const fs   = firebase.firestore();

/* Cada movimiento es un documento suelto dentro de su colección. Ninguno
   crece con el tiempo: crece el número de documentos, que es lo que
   Firestore hace bien. Es lo contrario del error de acumular todo en uno. */
const COLECCIONES = ['trabajos','cobros','gastos','clientes','fijos','plazas','servicios'];
const DOC_FISCAL = () => fs.collection('config').doc('fiscal');

let persiste = true;
let escuchando = [];
let listo = false;

/** Se suscribe a todas las colecciones. Firestore avisa de cada cambio,
    así que lo que carga Joaquín en la tablet aparece solo en tu pantalla. */
function escuchar(alCargar){
  let pendientes = COLECCIONES.length;
  escuchando.forEach(off=>off());
  escuchando = COLECCIONES.map(col =>
    fs.collection(col).onSnapshot(snap => {
      /* Las plazas se referencian por número desde cada trabajo, así que
         su id tiene que seguir siendo el mismo número, no el que genere
         Firestore. Se guardan con id de documento '1', '2'… */
      D[col] = snap.docs.map(d => col==='plazas'
        ? ({...d.data(), id:Number(d.id)})
        : ({id:d.id, ...d.data()}));
      if(col==='plazas') D.plazas.sort((a,b)=>a.id-b.id);
      if(pendientes > 0){ pendientes--; if(pendientes === 0){ listo = true; alCargar(); } }
      else if(listo) pintar();
    }, e => {
      console.warn('error en', col, e);
      if(e && e.code==='permission-denied') avisoPermisos();
      if(pendientes > 0){ pendientes--; if(pendientes === 0){ listo = true; alCargar(); } }
    })
  );
}

/* Escritura. Se escribe el documento concreto que cambió, no todo el
   conjunto: así dos personas pueden trabajar a la vez sin pisarse. */
async function grabar(col, obj){
  const {id, ...limpio} = obj;
  if(col === 'plazas'){ await fs.collection(col).doc(String(id)).set(limpio, {merge:true}); return id; }
  // Los ids de Firestore tienen 20 caracteres; los provisionales, muchos menos.
  if(id && String(id).length >= 18){ await fs.collection(col).doc(id).set(limpio, {merge:true}); return id; }
  const ref = await fs.collection(col).add(limpio);
  return ref.id;
}
async function borrarDoc(col, id){ await fs.collection(col).doc(id).delete(); }

/* Compatibilidad: el resto del código llama a guardar() sin saber de esto.
   Vuelca lo que haya en memoria a Firestore, documento a documento. */
let guardando=null;
function guardar(){
  clearTimeout(guardando);
  guardando = setTimeout(async ()=>{
    try{
      for(const col of COLECCIONES){
        for(const obj of (D[col]||[])){
          if(obj._borrar) continue;
          await grabar(col, obj);
        }
      }
      if(D.fiscal) await DOC_FISCAL().set(D.fiscal, {merge:true});
    }catch(e){ console.warn('no se pudo guardar', e); avisoError(e); }
  }, 500);
}

const nid = () => 'x'+(sig++)+'-'+Math.random().toString(36).slice(2,7);

function semilla(){
  /* Solo la configuración del taller. Ni clientes, ni coches, ni caja:
     esos son datos de Joaquín y viven en Firestore, no en el código que
     se publica en GitHub. Los movimientos de 2026 se cargan una vez con
     el botón Importar. */
  D.fiscal    = {...FISCAL_INI};

}


/* ─── calculos ─────────────────────────────────────────────────────── */
const cobrado = t => D.cobros.filter(c=>c.trabajoId===t.id).reduce((a,c)=>a+(c.importe||0),0);
/* Coste de material imputado a un trabajo. OJO: esto NO es un gasto nuevo de
   caja —el rollo de PPF ya se pagó cuando se compró—, es repartir ese coste
   entre los coches donde se usó. Sirve para saber el margen real de cada uno. */
const materialDe = t => (t.materiales||[]).reduce((a,m)=>a+(m.coste||0),0);
const margenDe   = t => (t.presupuesto||0) - materialDe(t);
const pendiente = t => Math.max(0,(t.presupuesto||0)-cobrado(t));

function ocupacion(desde,ventana){
  // ojo: no llamar 'plazas' a esta variable, taparia a la funcion plazas()
  const hasta=sumar(desde,ventana-1), nres=reservables().length;
  let dias=0, ing=0;
  D.trabajos.forEach(t=>{
    if(esLibre(t.plaza)) return;
    const e=aFecha(t.entra), s=salida(t);
    const a=e>desde?e:desde, b=s<hasta?s:hasta;
    const n=diasEntre(a,b)+1;
    if(n>0){ dias+=n; ing+=(t.presupuesto||0)*(n/Math.max(1,t.dias)); }
  });
  const cap=nres*ventana;
  return {dias,cap,pct:cap?Math.round(100*dias/cap):0, porDia: dias?ing/dias:0};
}

/** Qué otros trabajos pisaría este si ocupara desde 'entra' durante 'dias'. */
function pisaA(t, entra, dias){
  const e=aFecha(entra), sa=sumar(e, Math.max(1,dias)-1);
  return D.trabajos.filter(o=>o.id!==t.id && o.plaza===t.plaza && o.estado!=='entregado'
    && aFecha(o.entra)<=sa && salida(o)>=e);
}

/** Plazas donde ese hueco está libre, para poder mover al afectado. */
function plazasLibres(t, entra, dias){
  const e=aFecha(entra), sa=sumar(e, Math.max(1,dias)-1);
  return plazas().filter(p=>{
    if(p.id===t.plaza) return false;
    return !D.trabajos.some(o=>o.id!==t.id && o.plaza===p.id && o.estado!=='entregado'
      && aFecha(o.entra)<=sa && salida(o)>=e);
  });
}

function choques(){
  const act=D.trabajos.filter(t=>t.estado!=='entregado'), out=[];
  for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){
    const a=act[i],b=act[j];
    if(a.plaza!==b.plaza||esLibre(a.plaza)) continue;
    if(aFecha(a.entra)<=salida(b)&&aFecha(b.entra)<=salida(a)) out.push([a,b]);
  }
  return out;
}

function porMes(anio){
  const f=MESES.map((m,i)=>({mes:m,n:i+1,ing:0,gas:0,cat:{}}));
  D.cobros.forEach(c=>{const d=aFecha(c.fecha); if(d.getFullYear()===anio) f[d.getMonth()].ing+=c.importe||0;});
  D.gastos.forEach(g=>{const d=aFecha(g.fecha); if(d.getFullYear()!==anio) return;
    const x=f[d.getMonth()]; x.gas+=g.importe||0;
    const k=g.categoria||'otro'; x.cat[k]=(x.cat[k]||0)+(g.importe||0);});
  return f;
}

function anios(){
  const s=new Set();
  D.cobros.concat(D.gastos).forEach(x=>x.fecha&&s.add(aFecha(x.fecha).getFullYear()));
  if(!s.size) s.add(hoy.getFullYear());
  return [...s].sort((a,b)=>b-a);
}

function duraciones(){
  const acc={};
  D.trabajos.forEach(t=>{
    if(t.estado!=='entregado'||!t.servicio) return;
    (acc[t.servicio]=acc[t.servicio]||[]).push(t.dias);
  });
  return Object.entries(acc).map(([s,v])=>{
    v.sort((a,b)=>a-b);
    return {serv:s,n:v.length,mediana:v[Math.floor(v.length/2)],min:v[0],max:v[v.length-1],
            estimada:(servicios().find(x=>x.n===s)||{}).d};
  }).sort((a,b)=>b.n-a.n);
}

function vistaPlazas(){
  const anio=mesRef.getFullYear(), mes=mesRef.getMonth();
  const primero=new Date(anio,mes,1), ultimo=new Date(anio,mes+1,0);
  const ini=lunes(primero);                       // la rejilla siempre abre en lunes
  const finRej=(()=>{const x=lunes(ultimo); x.setDate(x.getDate()+6); return x;})();
  const semanas=Math.round(diasEntre(ini,finRej)+1)/7;

  /* indicadores del mes que se esta viendo */
  const oc=ocupacion(primero, diasEntre(primero,ultimo)+1);
  const dentro=D.trabajos.filter(t=>aFecha(t.entra)<=hoy&&salida(t)>=hoy);
  const ocupadas=new Set(dentro.filter(t=>!esLibre(t.plaza)).map(t=>t.plaza)).size;
  const sinRec=D.trabajos.filter(t=>t.estado==='sinrecoger').length;
  const ch=choques();
  const nombreMes=primero.toLocaleDateString('es-ES',{month:'long',year:'numeric'});

  let h=`<div class="kpis">
    <div class="kpi destaca"><span class="et">Ocupación de ${esc(nombreMes.split(' ')[0])}</span>
      <div class="n">${oc.pct}<small>%</small></div>
      <div class="sub">${oc.dias} de ${oc.cap} días-plaza</div></div>
    <div class="kpi"><span class="et">Por plaza y día</span>
      <div class="n">${eur(oc.porDia)}<small>€</small></div>
      <div class="sub">lo que rinde cada plaza</div></div>
    <div class="kpi"><span class="et">Coches dentro hoy</span>
      <div class="n">${dentro.length}</div>
      <div class="sub">${ocupadas} de ${reservables().length} plazas ocupadas</div></div>
    <div class="kpi riesgo"><span class="et">Sin recoger</span>
      <div class="n">${sinRec}</div>
      <div class="sub">terminados, ocupando plaza</div></div></div>`;

  if(ch.length) h+=`<div class="choque"><b>Hay ${ch.length} choque${ch.length>1?'s':''} de plaza.</b> `
    + ch.map(([a,b])=>`${esc(a.coche)} y ${esc(b.coche)} en la plaza ${a.plaza}.`).join(' ')
    + ` Dos coches no caben en el mismo sitio: cambia uno de plaza o de fecha.</div>`;

  h+=`<div class="mes-nav">
    <button class="btn mini flecha" data-mes="-1" aria-label="Mes anterior">‹</button>
    <h2 class="mes-tit">${esc(nombreMes)}</h2>
    <button class="btn mini flecha" data-mes="1" aria-label="Mes siguiente">›</button>
    <button class="btn mini" data-mes="hoy" style="margin-left:auto">Hoy</button>
  </div>`;

  const INI=['lun','mar','mié','jue','vie','sáb','dom'];

  for(let w=0; w<semanas; w++){
    const l=sumar(ini,w*7), f=sumar(l,6);
    /* ocupacion de esa semana, solo con los dias que caen dentro del mes */
    let ocDias=0, cap=0;
    for(let i2=0;i2<7;i2++){
      const d=sumar(l,i2);
      if(d.getMonth()!==mes) continue;
      cap+=reservables().length;
      plazas().forEach(p=>{
        if(p.libre) return;
        if(D.trabajos.some(t=>t.plaza===p.id&&aFecha(t.entra)<=d&&salida(t)>=d)) ocDias++;
      });
    }
    const pct=cap?Math.round(100*ocDias/cap):0;
    const esta=hoy>=l&&hoy<=f;

    h+=`<section class="sem${esta?' esta':''}">
      <div class="sem-cab">
        <b>Semana ${w+1}</b>
        <span>${l.getDate()} ${l.toLocaleDateString('es-ES',{month:'short'})} – ${f.getDate()} ${f.toLocaleDateString('es-ES',{month:'short'})}</span>
        ${esta?'<em>esta semana</em>':''}
        <i>${pct}% ocupada</i>
      </div>
      <div class="rej">
        <div class="rej-fila rej-dias"><div class="rej-et"></div><div class="rej-pista">`;
    for(let i2=0;i2<7;i2++){
      const d=sumar(l,i2);
      const fuera=d.getMonth()!==mes;
      const es=d.getTime()===hoy.getTime();
      h+=`<div class="rej-cel${fuera?' fuera':''}${es?' hoy':''}">

    plazas().forEach(p=>{
      h+=`<div class="rej-fila"><div class="rej-et"><b>${p.nom}</b><i>${p.uso.toUpperCase()}</i></div>`;
      h+=`<div class="rej-pista" data-plaza="${p.id}" data-lunes="${aIso(l)}">`;
      for(let i2=0;i2<7;i2++){
        const d=sumar(l,i2);
        h+=`<div class="rej-cel${d.getMonth()!==mes?' fuera':''}${d.getTime()===hoy.getTime()?' hoy':''}"></div>`;
      }
      if(p.libre && !D.trabajos.some(t=>t.plaza===p.id && salida(t)>=l && aFecha(t.entra)<=f)){
        h+=`<div class="res bloqueo" style="left:0;width:100%"><b>Libre para imprevistos · tócala para usarla</b></div>`;
      }

        const e=aFecha(t.entra), sa=salida(t);
        if(sa<l||e>f) return;                       // no toca esta semana
        const d0=Math.max(0,diasEntre(l,e));
        const d1=Math.min(6,diasEntre(l,sa));
        const n=d1-d0+1; if(n<=0) return;
        const viene=e<l, sigue=sa>f;                // el trabajo cruza la semana
        const pd=t.presupuesto?Math.round(t.presupuesto/Math.max(1,t.dias)):0;
        h+=`<button class="res ${t.estado}${viene?' viene':''}${sigue?' sigue':''}${t.avisarCliente?' avisar':''}${p.libre?' enreserva':''}" data-t="${t.id}"
              style="left:${(d0/7*100).toFixed(4)}%;width:${(n/7*100).toFixed(4)}%"
              title="${esc(t.coche)} · ${esc(t.servicio)} · ${fCorta(e)} a ${fCorta(sa)}">
              <b>${esc(t.coche)}</b>`
          + (n>=4&&pd?`<i>${eur(pd)} €/día</i>`:'') + `</button>`;
      });
      h+=`</div></div>`;
    });
    h+=`</div></section>`;
  }

  h+=`<div class="leyenda">
    <span><i class="pt" style="background:var(--oro-claro)"></i>En curso</span>
    <span><i class="pt" style="background:var(--oro-suave);border-color:var(--oro-claro)"></i>Reservado</span>
    <span><i class="pt" style="background:var(--espera)"></i>Esperando</span>

  <div class="aviso"><b>La plaza 5 no se reserva.</b> Queda libre para retrabajos,
  para el cliente que aparece sin cita y para el coche que tarda en recogerse.</div>`;
  return h;
}

        <td>${esc(g.concepto)}</td><td><span class="pill">${g.categoria||'otro'}</span></td>
        <td class="num">${fCorta(aFecha(g.fecha))}</td>

      :`<tr><td colspan="4" class="vacio">Sin gastos en ${anioSel}.</td></tr>`)

  /* Gastos fijos: plantillas que se repiten cada mes. */
  h+=`<div class="cab" style="margin-top:30px"><h2>Gastos fijos</h2>
    <span class="nota">se generan cada mes con un botón</span></div>

      :`<tr><td colspan="3" class="vacio">Sin gastos fijos. Añade el alquiler, la luz, la alarma…</td></tr>`)
    + `</tbody></table>`;
  return h;
}

/* ─── clientes ─────────────────────────────────────────────────────── */
const normNom = s => String(s||'').trim().toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');

/** Une la ficha del cliente con lo que dicen sus trabajos. */
function clientesConHistorial(){
  const mapa = new Map();
  D.clientes.forEach(c=>mapa.set(normNom(c.nombre), {...c, trabajos:[], ficha:true}));

  D.trabajos.forEach(t=>{
    const k = normNom(t.cliente);
    if(!k) return;
    if(!mapa.has(k)) mapa.set(k, {id:null, nombre:t.cliente, telefono:'', coches:'',
                                  notas:'', idioma:'', trabajos:[], ficha:false});
    mapa.get(k).trabajos.push(t);
  });

  return [...mapa.values()].map(c=>{
    const facturado = c.trabajos.reduce((a,t)=>a+(t.presupuesto||0),0);
    const cobrado_  = c.trabajos.reduce((a,t)=>a+cobrado(t),0);
    const fechas    = c.trabajos.map(t=>aFecha(t.entra)).sort((a,b)=>b-a);
    const ultima    = fechas[0] || null;
    return {...c, facturado, cobrado:cobrado_, pendiente:Math.max(0,facturado-cobrado_),
            n:c.trabajos.length, ultima,
            diasSin: ultima ? diasEntre(ultima, hoy) : null,
            cochesVistos:[...new Set(c.trabajos.map(t=>t.coche))].join(', ')};
  }).sort((a,b)=>b.facturado-a.facturado);
}

function vistaClientes(){
  const cl = clientesConHistorial();
  const conTrabajo = cl.filter(c=>c.n>0);
  const facturado  = conTrabajo.reduce((a,c)=>a+c.facturado,0);
  const ticket     = conTrabajo.length ? facturado/conTrabajo.reduce((a,c)=>a+c.n,0) : 0;
  const dormidos   = cl.filter(c=>c.diasSin!=null && c.diasSin>180);
  const sinFicha   = cl.filter(c=>!c.ficha).length;

  let h=`<div class="anio">
    <button class="btn mini pri" data-acc="cliente">+ Cliente</button>
    ${sinFicha?`<span class="nota" style="font-family:var(--mono);font-size:11px;color:var(--dim)">
      ${sinFicha} cliente${sinFicha>1?'s':''} sin ficha, sacado${sinFicha>1?'s':''} de los trabajos</span>`:''}
  </div>`;

  h+=`<div class="kpis">
    <div class="kpi destaca"><span class="et">Clientes</span>
      <div class="n">${cl.length}</div>
      <div class="sub">${conTrabajo.length} con trabajos hechos</div></div>
    <div class="kpi"><span class="et">Ticket medio</span>
      <div class="n">${eur(ticket)}<small>€</small></div>
      <div class="sub">por trabajo</div></div>
    <div class="kpi"><span class="et">Por cobrar</span>
      <div class="n">${eur(cl.reduce((a,c)=>a+c.pendiente,0))}<small>€</small></div>
      <div class="sub">saldo pendiente de todos</div></div>
    <div class="kpi riesgo"><span class="et">Sin volver</span>
      <div class="n">${dormidos.length}</div>
      <div class="sub">más de 6 meses sin pasar</div></div></div>`;

  if(dormidos.length) h+=`<div class="aviso">
    <b>Hay ${dormidos.length} cliente${dormidos.length>1?'s':''} que no vuelve${dormidos.length>1?'n':''} desde hace más de medio año:</b>
    ${dormidos.slice(0,6).map(c=>esc(c.nombre)).join(', ')}.
    Recuperar a uno que ya te conoce cuesta mucho menos que conseguir uno nuevo.</div>`;

  h+=`<table class="tabla"><thead><tr>
      <th>Cliente</th><th>Teléfono</th><th>Coches</th>
      <th style="text-align:right">Trabajos</th>
      <th style="text-align:right">Facturado</th>
      <th style="text-align:right">Pendiente</th>
      <th style="text-align:right">Última visita</th>
    </tr></thead><tbody>`;
  h+= cl.length ? cl.map(c=>`<tr data-c="${esc(c.id||'')}" data-nom="${esc(c.nombre)}" style="cursor:pointer">
      <td><b>${esc(c.nombre)}</b>${!c.ficha?' <span class="pill">sin ficha</span>':''}
        ${c.idioma==='en'?' <span class="pill">EN</span>':''}</td>
      <td style="font-family:var(--mono);font-size:12px">${esc(c.telefono)||'—'}</td>
      <td style="color:var(--dim);font-size:12.5px">${esc(c.cochesVistos||c.coches)||'—'}</td>
      <td class="num">${c.n}</td>
      <td class="num">${c.facturado?eur(c.facturado)+' €':'—'}</td>
      <td class="num ${c.pendiente?'neg':''}">${c.pendiente?eur(c.pendiente)+' €':'—'}</td>
      <td class="num" ${c.diasSin>180?'style="color:var(--alerta)"':''}>
        ${c.ultima?fCorta(c.ultima)+(c.diasSin>30?` <span style="color:var(--dim)">(${Math.round(c.diasSin/30)} m)</span>`:''):'—'}</td>
    </tr>`).join('')
    : `<tr><td colspan="7" class="vacio">Todavía no hay clientes. Añade el primero con «+ Cliente».</td></tr>`;
  h+=`</tbody></table>`;
  return h;
}

/* ─── hoja de cliente ──────────────────────────────────────────────── */
let editC=null;
function abrirCliente(id, nombre){
  editC = id ? D.clientes.find(c=>c.id===id) : null;
  const c = editC || {nombre:nombre||'',telefono:'',coches:'',idioma:'es',notas:''};
  const suyos = D.trabajos.filter(t=>normNom(t.cliente)===normNom(c.nombre))
                          .sort((a,b)=>a.entra<b.entra?1:-1);

  let hist='';
  if(suyos.length){
    hist=`<div class="cobros"><label style="font-family:var(--mono);font-size:10px;
      letter-spacing:.09em;text-transform:uppercase;color:var(--dim)">Historial · ${suyos.length} trabajos</label>`
      + suyos.map(t=>`<div class="cobro">
          <span><b>${esc(t.coche)}</b> · ${esc(t.servicio)}</span>
          <span style="color:var(--dim);font-family:var(--mono);font-size:11px;margin-left:auto">
            ${fCorta(aFecha(t.entra))}</span>
          <span style="font-family:var(--mono);font-size:11px">${t.presupuesto?eur(t.presupuesto)+' €':'—'}</span>
        </div>`).join('') + `</div>`;
  }

  $('#hojaC').innerHTML = `<h3>${editC?'Editar cliente':'Nuevo cliente'}</h3>
    <div class="campo"><label for="cl-nom">Nombre</label>
      <input id="cl-nom" value="${esc(c.nombre)}" placeholder="Nombre del cliente" autocomplete="off"></div>
    <div class="fila2">
      <div class="campo"><label for="cl-tel">Teléfono</label>
        <input id="cl-tel" value="${esc(c.telefono)}" placeholder="+34 600 00 00 00" inputmode="tel"></div>
      <div class="campo"><label for="cl-idi">Idioma</label>
        <select id="cl-idi">
          ${['es','en','de','ru'].map(v=>`<option value="${v}"${v===c.idioma?' selected':''}>${v.toUpperCase()}</option>`).join('')}
        </select></div></div>
    <div class="cobros" id="cl-coches"></div>
    <div class="campo"><label for="cl-not">Notas</label>
      <input id="cl-not" value="${esc(c.notas)}" placeholder="Paga en efectivo. Le interesa el PPF." autocomplete="off"></div>
    ${hist}
    <div class="acc">
      <button class="btn" type="button" data-cerrar>Cancelar</button>
      ${editC?`<button class="btn borrar" type="button" id="cl-del">Eliminar</button>`:''}
      <button class="btn pri" type="button" id="cl-ok">Guardar</button></div>`;
  $('#hoja').classList.add('on');
  $('#cl-nom').focus();

  /* Coches del cliente. Se guardan como fichas, no como texto suelto:
     asi el trabajo puede autocompletar y el historial se agrupa por coche. */
  let coches = (editC && Array.isArray(editC.vehiculos)) ? editC.vehiculos.map(v=>({...v})) : [];
  if(!coches.length && c.coches){                       // migrar el texto antiguo
    coches = String(c.coches).split(',').map(x=>x.trim()).filter(Boolean)
             .map(n=>({id:nid(), modelo:n, matricula:'', color:''}));
  }
  function pintarCoches(){
    const cont=$('#cl-coches'); if(!cont) return;
    cont.innerHTML = `<label style="font-family:var(--mono);font-size:10px;letter-spacing:.09em;
        text-transform:uppercase;color:var(--dim)">Coches · ${coches.length}</label>`
      + coches.map((v,i)=>`<div class="cobro">
          <span><b>${esc(v.modelo)}</b>${v.matricula?` <span style="color:var(--dim);font-family:var(--mono);font-size:11px">${esc(v.matricula)}</span>`:''}
          ${v.color?` <span style="color:var(--dim);font-size:12px">${esc(v.color)}</span>`:''}</span>
          <button class="x" data-qc="${i}" aria-label="Quitar coche">×</button></div>`).join('')
      + `<div class="mini-form" style="grid-template-columns:1fr 90px auto">
          <input id="v-mod" placeholder="Marca y modelo" autocomplete="off">
          <input id="v-mat" placeholder="Matrícula" autocomplete="off">
          <button class="btn mini" id="v-add" type="button">Añadir</button></div>`;
    cont.querySelectorAll('[data-qc]').forEach(b=>b.addEventListener('click',()=>{
      coches.splice(+b.dataset.qc,1); pintarCoches();
    }));
    $('#v-add').addEventListener('click',()=>{
      const m=$('#v-mod').value.trim(); if(!m) return;
      coches.push({id:nid(), modelo:m, matricula:$('#v-mat').value.trim(), color:''});
      pintarCoches(); $('#v-mod').focus();
    });
  }
  pintarCoches();

  $('#cl-ok').addEventListener('click',()=>{
    const d={nombre:$('#cl-nom').value.trim(), telefono:$('#cl-tel').value.trim(),
      vehiculos:coches, coches:coches.map(v=>v.modelo).join(', '),
      idioma:$('#cl-idi').value, notas:$('#cl-not').value.trim()};
    if(!d.nombre){ $('#cl-nom').focus(); return; }
    if(editC) Object.assign(editC,d); else D.clientes.push(Object.assign({id:nid()},d));
    cerrar(); guardar(); pintar();
  });
  const del=$('#cl-del'); if(del) del.addEventListener('click',()=>{
    borrarDoc('clientes', editC.id); D.clientes=D.clientes.filter(x=>x.id!==editC.id); cerrar(); guardar(); pintar();
  });
}

/* ─── registro ─────────────────────────────────────────────────────── */
function vistaRegistro(){
  const orden=[...D.trabajos].sort((a,b)=>a.entra<b.entra?1:-1);
  const pend=D.trabajos.reduce((a,t)=>a+pendiente(t),0);
  let h=`<div class="cab"><h2>Todos los trabajos</h2>
    <span class="nota">${orden.length} trabajos${pend>0?' · '+eur(pend)+' € por cobrar':''}</span></div>
  <table class="tabla"><thead><tr>
    <th>Coche</th><th>Servicio</th><th>Plaza</th><th>Entra</th><th>Sale</th>
    <th style="text-align:right">Días</th><th style="text-align:right">Presupuesto</th>
    <th style="text-align:right">Cobrado</th><th style="text-align:right">€/día</th><th>Estado</th>
  </tr></thead><tbody>`;
  h+= orden.length? orden.map(t=>{
    const co=cobrado(t), pd=t.presupuesto?Math.round(t.presupuesto/Math.max(1,t.dias)):0;
    return `<tr data-t="${t.id}" style="cursor:pointer">
      <td>${esc(t.coche)}${t.cliente?`<br><span style="color:var(--dim);font-size:11.5px">${esc(t.cliente)}</span>`:''}</td>
      <td>${esc(t.servicio)}</td><td class="num">${t.plaza}</td>
      <td class="num">${fCorta(aFecha(t.entra))}</td><td class="num">${fCorta(salida(t))}</td>
      <td class="num">${t.dias}</td>
      <td class="num">${t.presupuesto?eur(t.presupuesto)+' €':'—'}</td>
      <td class="num ${pendiente(t)>0?'neg':'pos'}">${eur(co)} €</td>
      <td class="num" style="color:var(--dim)">${materialDe(t)?eur(materialDe(t))+' €':'—'}</td>
      <td class="num ${margenDe(t)<0?'neg':'pos'}">${t.presupuesto?eur(margenDe(t))+' €':'—'}</td>
      <td class="num ${pd&&pd<200?'neg':'pos'}">${pd?eur(pd)+' €':'—'}</td>
      <td><span class="pill">${ESTADOS[t.estado]||t.estado}</span></td></tr>`;
  }).join('') : `<tr><td colspan="12" class="vacio">Todavía no hay trabajos.</td></tr>`;
  h+=`</tbody></table>`;

  const dur=duraciones();
  h+=`<div class="cab" style="margin-top:34px"><h2>Cuánto tarda cada trabajo de verdad</h2>
    <span class="nota">medido sobre trabajos entregados</span></div>`;
  if(!dur.length){
    h+=`<div class="aviso">Aún no hay trabajos marcados como <b>entregados</b>.
      En cuanto empieces a cerrarlos, aquí aparece la duración real de cada
      servicio y dejamos de estimar.</div>`;
  }else{
    const tope=Math.max(1,...dur.map(d=>Math.max(d.mediana,d.estimada||0)));
    h+=`<table class="tabla"><thead><tr><th>Servicio</th>
      <th style="text-align:right">Trabajos</th><th style="text-align:right">Real</th>
      <th style="text-align:right">Estimado</th><th>Comparación</th></tr></thead><tbody>`
      + dur.map(d=>`<tr><td>${esc(d.serv)}</td><td class="num">${d.n}</td>
        <td class="num">${d.mediana} d${d.min!==d.max?` <span style="color:var(--dim)">(${d.min}–${d.max})</span>`:''}</td>
        <td class="num" style="color:var(--dim)">${d.estimada??'—'}</td>
        <td><div class="dur"><span class="barra" style="width:${100*d.mediana/tope}%"></span>
          ${d.estimada!=null?`<span class="est" style="width:${100*d.estimada/tope}%"></span>`:''}</div></td></tr>`).join('')
      + `</tbody></table>`;
  }
  h+=`<div class="aviso"><b>Cada trabajo que marcas como entregado mide una duración real.</b>
    Con unos meses de historial, la fecha que se le da a un cliente deja de ser una suposición.</div>`;
  return h;
}

  /* Materiales usados en este coche. Se restan del presupuesto para ver
     el margen; no se suman a los gastos, que ya los recoge la caja. */
  mats = (editT && Array.isArray(editT.materiales)) ? editT.materiales.map(m=>({...m})) : [];
  function pintarMats(){
    const cont=$('#t-materiales'); if(!cont) return;
    const total=mats.reduce((a,m)=>a+(m.coste||0),0);
    const pres=+($('#t-pres')||{}).value||0;
    const marg=pres-total;
    cont.innerHTML = `<label style="font-family:var(--mono);font-size:10px;letter-spacing:.09em;
        text-transform:uppercase;color:var(--dim)">Materiales usados · ${eur(total)} €
        ${pres?`<span class="saldo ${marg<0?'debe':'ok'}"> · margen ${eur(marg)} €</span>`:''}</label>`
      + mats.map((m,i)=>`<div class="cobro"><span>${esc(m.nombre)}</span>
          <span style="margin-left:auto;font-family:var(--mono);font-size:12px">${eur(m.coste)} €</span>
          <button class="x" data-qm="${i}" aria-label="Quitar material">×</button></div>`).join('')
      + `<div class="mini-form">
          <input id="m-nom" placeholder="Bobina PPF, 1/2 rollo" autocomplete="off">
          <input id="m-cos" type="number" placeholder="Coste €" inputmode="decimal">
          <button class="btn mini" id="m-add" type="button">Añadir</button></div>`;
    cont.querySelectorAll('[data-qm]').forEach(b=>b.addEventListener('click',()=>{
      mats.splice(+b.dataset.qm,1); pintarMats();
    }));
    $('#m-add').addEventListener('click',()=>{
      const n=$('#m-nom').value.trim(); if(!n) return;
      mats.push({nombre:n, coste:+$('#m-cos').value||0});
      pintarMats(); $('#m-nom').focus();
    });
  }
  pintarMats();
  $('#t-pres').addEventListener('input',pintarMats);

  /* Señal. Solo aparece en PPF y vinilo, y solo al crear el trabajo:
     es el momento en que el cliente está delante. */
  function pintarSena(){
    const cont=$('#t-sena'); if(!cont) return;
    const serv=$('#t-serv').value;
    /* Se muestra también al editar: a veces el servicio cambia después de
       tomar el trabajo, o la señal se cobra unos días más tarde. Solo se
       oculta cuando ya hay algún cobro, porque entonces se gestiona desde
       la lista de cobros de abajo. */
    const yaCobrado = editT ? cobrado(editT) > 0 : false;
    if(!pideSena(serv) || yaCobrado){ cont.innerHTML=''; return; }
    const mitad=Math.round((+$('#t-pres').value||0)/2);
    cont.innerHTML = `<div class="sena">
      <label><input type="checkbox" id="s-cobrada"> Cobrar ${editT?'la':'ahora la'} señal del 50 %</label>
      <div class="mini-form" style="grid-template-columns:1fr 1fr">
        <input type="number" id="s-imp" value="${mitad||''}" placeholder="Importe" inputmode="decimal">
        <select id="s-via">${VIAS.map(v=>`<option${v==='transferencia'?' selected':''}>${v}</option>`).join('')}</select>
      </div>
      <p>El PPF y el vinilo se cobran a la mitad para apartar material y bloquear la plaza.</p>
    </div>`;
  }
  let senaMarcada=false, senaVia='transferencia';
  function pintarSenaConEstado(){
    const chk=$('#s-cobrada'), via=$('#s-via');
    if(chk) senaMarcada=chk.checked;
    if(via) senaVia=via.value;
    pintarSena();
    const chk2=$('#s-cobrada'), via2=$('#s-via');
    if(chk2) chk2.checked=senaMarcada;
    if(via2) via2.value=senaVia;
  }
  pintarSena();
  $('#t-serv').addEventListener('change',pintarSenaConEstado);
  $('#t-pres').addEventListener('input',pintarSenaConEstado);

  $('#t-serv').addEventListener('change',e=>{
    if(editT) return;                       // no pisar lo que ya ajusto
    const s=servicios().find(x=>x.n===e.target.value); if(!s) return;
    $('#t-dias').value=s.d;
    if(s.p) $('#t-pres').value=s.p;
  });
  $('#t-ok').addEventListener('click',guardarTrabajo);
  const del=$('#t-del'); if(del) del.addEventListener('click',()=>{
    D.cobros.filter(c=>c.trabajoId===editT.id).forEach(c=>borrarDoc('cobros',c.id));
    borrarDoc('trabajos', editT.id);
    D.cobros=D.cobros.filter(c=>c.trabajoId!==editT.id);
    D.trabajos=D.trabajos.filter(x=>x.id!==editT.id);
    cerrar(); guardar(); pintar();
  });
  const add=$('#c-add'); if(add) add.addEventListener('click',()=>{
    const v=+$('#c-imp').value; if(!v) return;
    D.cobros.push({id:nid(),trabajoId:editT.id,importe:v,via:$('#c-via').value,
      fecha:aIso(hoy),concepto:`${editT.coche} · ${editT.servicio}`});
    guardar(); abrirTrabajo(editT.id); pintar();
  });
  $('#hojaC').querySelectorAll('[data-quitar]').forEach(b=>b.addEventListener('click',()=>{
    borrarDoc('cobros', b.dataset.quitar);
    D.cobros=D.cobros.filter(c=>c.id!==b.dataset.quitar);
    guardar(); abrirTrabajo(editT.id); pintar();
  }));
}

function guardarTrabajo(){
  const d={
    coche:$('#t-coche').value.trim()||'Sin identificar',
    cliente:$('#t-cli').value.trim(),
    servicio:$('#t-serv').value,
    plaza:+$('#t-plaza').value,
    estado:$('#t-estado').value,
    entra:$('#t-entra').value||aIso(hoy),
    dias:Math.max(1,+$('#t-dias').value||1),
    presupuesto:+$('#t-pres').value||0,
    materiales:mats
  };
  let destino;
  if(editT){ Object.assign(editT,d); destino=editT; }
  else { destino = Object.assign({id:nid()}, d); D.trabajos.push(destino); }

  const chk=$('#s-cobrada');
  if(chk && chk.checked){
    const imp=+$('#s-imp').value||0;
    if(imp) D.cobros.push({id:nid(), trabajoId:destino.id, importe:imp,
      via:$('#s-via').value, fecha:aIso(hoy), concepto:`${destino.coche} · señal 50%`});
  }
  cerrar(); guardar(); pintar();
}

/* ─── acciones rápidas ─────────────────────────────────────────────────
   Pensado para tablet: un toque en la barra abre esto, no el formulario
   entero. El 90 % de lo que hace Joaquin en el dia es cambiar el estado
   o cobrar, y eso aqui es un solo toque con botones grandes.          */
const SIGUIENTE = [
  {k:'curso',      t:'Ya entró',            ico:'→'},
  {k:'espera',     t:'Esperando algo',      ico:'⏸'},
  {k:'sinrecoger', t:'Listo, sin recoger',  ico:'✓'},
  {k:'entregado',  t:'Entregado y cerrado', ico:'✓✓'}
];

function abrirAcciones(id){
  const t = D.trabajos.find(x=>x.id===id);
  if(!t) return;
  const pend = pendiente(t), co = cobrado(t);
  const plaza = (plazas().find(p=>p.id===t.plaza)||{}).nom || ('Plaza '+t.plaza);

  $('#hojaC').innerHTML = `
    <div class="acc-cab">
      <b>${esc(t.coche)}</b>
      <span>${esc(t.servicio)}${t.cliente?' · '+esc(t.cliente):''}</span>
      <span>${plaza} · ${fCorta(aFecha(t.entra))} a ${fCorta(salida(t))} · ${t.dias} día${t.dias>1?'s':''}</span>
      ${t.avisarCliente?`<span class="acc-avisar">Se le cambió la fecha · falta avisarle</span>`:''}
      ${t.presupuesto?`<span class="acc-eur">${eur(t.presupuesto)} €
        ${co?` · cobrado ${eur(co)} €`:''}
        ${pend?`<b class="debe"> · faltan ${eur(pend)} €</b>`:(t.presupuesto?' · cobrado del todo':'')}</span>`:''}
    </div>

    <div class="acc-grid">
      ${SIGUIENTE.map(o=>`<button class="acc-btn${t.estado===o.k?' ahora':''}" data-est="${o.k}">
        <i>${o.ico}</i><span>${o.t}</span></button>`).join('')}
    </div>

    ${t.avisarCliente?`<button class="acc-btn ancho" data-avisado="1">
      <i>✓</i><span>Ya le he avisado del cambio de fecha</span></button>`:''}

    <div class="acc-sub">Se alarga</div>
    <div class="acc-grid tres">
      <button class="acc-btn" data-mas="1"><i>+1</i><span>un día</span></button>
      <button class="acc-btn" data-mas="2"><i>+2</i><span>dos días</span></button>
      <button class="acc-btn" data-mas="-1"><i>−1</i><span>un día menos</span></button>
    </div>

    ${pend?`<button class="acc-btn ancho cobrar" data-cobrar="${pend}">
      <i>€</i><span>Cobrar ${eur(pend)} €</span></button>`:''}

    <div class="acc">
      <button class="btn" type="button" data-cerrar>Cerrar</button>
      <button class="btn pri" type="button" id="a-edit">Editar todo</button>
    </div>`;
  $('#hoja').classList.add('on');

  $('#hojaC').querySelectorAll('[data-est]').forEach(b=>b.addEventListener('click',()=>{
    t.estado = b.dataset.est;
    /* Si se entrega hoy y aun quedaba tiempo por delante, se ajustan los dias
       reales: es lo que despues alimenta la tabla de duraciones. */
    if(t.estado==='entregado' && salida(t) > hoy){
      t.dias = Math.max(1, diasEntre(aFecha(t.entra), hoy) + 1);
    }
    cerrar(); guardar(); pintar();
  }));

  const av=$('#hojaC').querySelector('[data-avisado]');
  if(av) av.addEventListener('click',()=>{ delete t.avisarCliente; cerrar(); guardar(); pintar(); });

  $('#hojaC').querySelectorAll('[data-mas]').forEach(b=>b.addEventListener('click',()=>{
    const nuevos = Math.max(1, t.dias + (+b.dataset.mas));
    if(nuevos === t.dias) return;
    const pisados = pisaA(t, t.entra, nuevos);
    if(pisados.length){ cerrar(); abrirConflicto(t, nuevos, pisados); return; }
    t.dias = nuevos; cerrar(); guardar(); pintar();
  }));

  const cob=$('#hojaC').querySelector('[data-cobrar]');
  if(cob) cob.addEventListener('click',()=>{ cerrar(); abrirCobroRapido(t.id, +cob.dataset.cobrar); });

  $('#a-edit').addEventListener('click',()=>{ cerrar(); abrirTrabajo(id); });
}

/* Qué hacer cuando alargar un trabajo pisa al siguiente. Se resuelve aqui
   mismo: o se mueve el afectado de plaza, o se retrasa. Nunca se deja el
   choque escondido, porque eso acaba en dos coches y una plaza. */
function abrirConflicto(t, nuevosDias, pisados){
  const finNuevo = sumar(aFecha(t.entra), nuevosDias-1);

  const opciones = pisados.map(o=>({
    o,
    libres: plazasLibres(o, o.entra, o.dias),
    nuevaEntrada: aIso(sumar(finNuevo, 1)),
    diasRetraso: diasEntre(aFecha(o.entra), sumar(finNuevo, 1))
  }));

  $('#hojaC').innerHTML = `<h3>Eso pisa a otro coche</h3>
    <div class="conf-cab">
      Si <b>${esc(t.coche)}</b> se queda ${nuevosDias} día${nuevosDias>1?'s':''},
      sale el <b>${fCorta(finNuevo)}</b> y ocupa la ${esc((plazas().find(p=>p.id===t.plaza)||{}).nom||'plaza')}
      hasta entonces.
    </div>
    ${opciones.map((x,i)=>`
      <div class="conf">
        <div class="conf-t"><b>${esc(x.o.coche)}</b>
          <span>${esc(x.o.servicio)} · entra el ${fCorta(aFecha(x.o.entra))}</span></div>
        <div class="acc-grid">
          <button class="acc-btn" data-retrasar="${i}">
            <i>→</i><span>Retrasarlo al ${fCorta(sumar(finNuevo,1))}<br>
            <em>${x.diasRetraso} día${x.diasRetraso>1?'s':''} más tarde</em></span></button>
          ${x.libres.length
            ? `<button class="acc-btn" data-mover="${i}"><i>⇄</i>
                 <span>Moverlo a ${esc(x.libres[0].nom)}<br><em>mismas fechas</em></span></button>`
            : `<button class="acc-btn" disabled><i>✕</i><span>No hay plaza libre<br><em>esos días</em></span></button>`}
        </div>
      </div>`).join('')}
    <div class="acc">
      <button class="btn" type="button" data-cerrar>Dejarlo como está</button>
      <button class="btn borrar" type="button" id="cf-igual">Alargar igual</button>
    </div>`;
  $('#hoja').classList.add('on');

  const aplicar = () => { t.dias = nuevosDias; cerrar(); guardar(); pintar(); };

  $('#hojaC').querySelectorAll('[data-retrasar]').forEach(b=>b.addEventListener('click',()=>{
    const x = opciones[+b.dataset.retrasar];
    x.o.entra = aIso(sumar(finNuevo,1));
    x.o.avisarCliente = true;              // queda marcado: hay que llamarle
    aplicar();
  }));
  $('#hojaC').querySelectorAll('[data-mover]').forEach(b=>b.addEventListener('click',()=>{
    const x = opciones[+b.dataset.mover];
    x.o.plaza = x.libres[0].id;
    aplicar();
  }));
  $('#cf-igual').addEventListener('click', aplicar);
}

    <div class="acc">
      <button class="btn" type="button" data-cerrar>Cancelar</button>
      ${editF?`<button class="btn borrar" type="button" id="f-del">Eliminar</button>`:''}
      <button class="btn pri" type="button" id="f-ok">Guardar</button></div>`;
  $('#hoja').classList.add('on'); $('#f-con').focus();
  $('#f-ok').addEventListener('click',()=>{
    const d={concepto:$('#f-con').value.trim()||'Sin concepto', importe:+$('#f-imp').value||0,
      dia:Math.max(1,Math.min(28,+$('#f-dia').value||1)), categoria:$('#f-cat').value, via:$('#f-via').value};
    if(editF) Object.assign(editF,d); else D.fijos.push(Object.assign({id:nid()},d));
    cerrar(); guardar(); pintar();
  });
  const del=$('#f-del'); if(del) del.addEventListener('click',()=>{
    borrarDoc('fijos', editF.id); D.fijos=D.fijos.filter(x=>x.id!==editF.id); cerrar(); guardar(); pintar();
  });
}

/* ─── ajustes: plazas y servicios ──────────────────────────────────── */
function vistaAjustes(){
  let h=`<div class="cab"><h2>Plazas del taller</h2>
    <span class="nota">${reservables().length} reservables de ${plazas().length}</span></div>
    <div class="anio"><button class="btn mini" data-acc="plaza">+ Plaza</button></div>
  <table class="tabla"><thead><tr><th>Nombre</th><th>Para qué</th><th>Reservable</th></tr></thead><tbody>`
    + plazas().map(p=>`<tr data-p="${p.id}" style="cursor:pointer">
        <td><b>${esc(p.nom)}</b></td><td style="color:var(--dim)">${esc(p.uso)}</td>
        <td><span class="pill">${p.libre?'libre para imprevistos':'sí'}</span></td></tr>`).join('')
    + `</tbody></table>
    <div class="aviso"><b>Deja siempre una plaza sin reservar.</b> Es la que absorbe
    los retrabajos, el cliente que aparece sin cita y el coche que tarda en recogerse.</div>`;

  h+=`<div class="cab" style="margin-top:30px"><h2>Impuestos</h2>
    <span class="nota">los fija tu gestoría</span></div>
  <table class="tabla"><tbody>
    <tr data-fis="iva" style="cursor:pointer"><td>IVA que se repercute</td>
      <td class="num">${fiscal().iva} %</td></tr>
    <tr data-fis="irpf" style="cursor:pointer"><td>IRPF sobre el beneficio trimestral</td>
      <td class="num">${fiscal().irpf} %</td></tr>
  </tbody></table>

  <div class="cab" style="margin-top:30px"><h2>Servicios</h2>
    <span class="nota">precio y duración que se proponen al crear un trabajo</span></div>
    <div class="anio"><button class="btn mini" data-acc="servicio">+ Servicio</button></div>
  <table class="tabla"><thead><tr><th>Servicio</th>
    <th style="text-align:right">Días</th><th style="text-align:right">Precio sin IVA</th></tr></thead><tbody>`
    + servicios().map(x=>`<tr data-s="${x.id}" style="cursor:pointer">
        <td>${esc(x.n)}</td><td class="num">${x.d}</td>
        <td class="num">${x.p?eur(x.p)+' €':'a presupuestar'}</td></tr>`).join('')
    + `</tbody></table>`;
  return h;
}

function abrirPlaza(id){
  const p = id ? plazas().find(x=>x.id===+id) : null;
  const v = p || {nom:'Plaza '+(plazas().length+1), uso:'', libre:false};
  $('#hojaC').innerHTML = `<h3>${p?'Editar plaza':'Nueva plaza'}</h3>
    <div class="campo"><label for="p-nom">Nombre</label>
      <input id="p-nom" value="${esc(v.nom)}" autocomplete="off"></div>
    <div class="campo"><label for="p-uso">Para qué se usa</label>
      <input id="p-uso" value="${esc(v.uso)}" placeholder="PPF / vinilo" autocomplete="off"></div>
    <div class="campo"><label for="p-libre">¿Reservable?</label>
      <select id="p-libre">
        <option value="0"${!v.libre?' selected':''}>Sí, se puede reservar</option>
        <option value="1"${v.libre?' selected':''}>No, se deja libre para imprevistos</option>
      </select></div>
    <div class="acc">
      <button class="btn" type="button" data-cerrar>Cancelar</button>
      ${p?`<button class="btn borrar" type="button" id="p-del">Eliminar</button>`:''}
      <button class="btn pri" type="button" id="p-ok">Guardar</button></div>`;
  $('#hoja').classList.add('on'); $('#p-nom').focus();
  $('#p-ok').addEventListener('click',()=>{
    const d={nom:$('#p-nom').value.trim()||'Plaza', uso:$('#p-uso').value.trim(), libre:$('#p-libre').value==='1'};
    if(p) Object.assign(p,d);
    else D.plazas.push(Object.assign({id:Math.max(0,...plazas().map(x=>x.id))+1}, d));
    cerrar(); guardar(); pintar();
  });
  const del=$('#p-del'); if(del) del.addEventListener('click',()=>{
    if(D.trabajos.some(t=>t.plaza===p.id)){ alert('Esa plaza tiene trabajos asignados. Cámbialos de plaza antes de borrarla.'); return; }
    borrarDoc('plazas', String(p.id)); D.plazas=D.plazas.filter(x=>x.id!==p.id); cerrar(); guardar(); pintar();
  });
}

function abrirServicio(id){
  const x = id ? servicios().find(y=>y.id===id) : null;
  const v = x || {n:'',d:1,p:0};
  $('#hojaC').innerHTML = `<h3>${x?'Editar servicio':'Nuevo servicio'}</h3>
    <div class="campo"><label for="s-nom">Nombre</label>
      <input id="s-nom" value="${esc(v.n)}" placeholder="PPF Full Front" autocomplete="off"></div>
    <div class="fila2">
      <div class="campo"><label for="s-dias">Días que ocupa la plaza</label>
        <input type="number" id="s-dias" min="1" max="60" value="${v.d}" inputmode="numeric"></div>
      <div class="campo"><label for="s-pre">Precio sin IVA (€)</label>
        <input type="number" id="s-pre" min="0" step="10" value="${v.p||''}" placeholder="0 = a presupuestar" inputmode="decimal"></div></div>
    <div class="acc">
      <button class="btn" type="button" data-cerrar>Cancelar</button>
      ${x?`<button class="btn borrar" type="button" id="s-del">Eliminar</button>`:''}
      <button class="btn pri" type="button" id="s-ok">Guardar</button></div>`;
  $('#hoja').classList.add('on'); $('#s-nom').focus();
  $('#s-ok').addEventListener('click',()=>{
    const d={n:$('#s-nom').value.trim(), d:Math.max(1,+$('#s-dias').value||1), p:+$('#s-pre').value||0};
    if(!d.n){ $('#s-nom').focus(); return; }
    if(x) Object.assign(x,d); else D.servicios.push(Object.assign({id:nid()},d));
    cerrar(); guardar(); pintar();
  });
  const del=$('#s-del'); if(del) del.addEventListener('click',()=>{
    borrarDoc('servicios', x.id); D.servicios=D.servicios.filter(y=>y.id!==x.id); cerrar(); guardar(); pintar();
  });
}

/* ─── fijos del mes ────────────────────────────────────────────────── */
function generarFijos(){
  const marca=`${hoy.getFullYear()}-${p2(hoy.getMonth()+1)}`;
  const ya=new Set(D.gastos.filter(g=>String(g.fecha).startsWith(marca)&&g.origenFijo).map(g=>g.origenFijo));
  const falta=D.fijos.filter(f=>!ya.has(f.id));
  falta.forEach(f=>D.gastos.push({id:nid(),fecha:`${marca}-${p2(Math.min(28,f.dia||1))}`,
    concepto:f.concepto,importe:f.importe,via:f.via||'banco',categoria:f.categoria||'fijo',origenFijo:f.id}));
  guardar(); pintar();
  alert(falta.length?`Se han añadido ${falta.length} gastos fijos de este mes.`
                    :'Los fijos de este mes ya estaban puestos.');
}

/* ─── exportar / importar ──────────────────────────────────────────── */
function exportar(){
  const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=`taller-mcc-${aIso(hoy)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
}
/* Importar AÑADE a lo que ya hay, no reemplaza: así se puede cargar la
   caja de un año sin borrar lo que Joaquín lleve metido. Escribe directo
   en Firestore y deja que la escucha en vivo refresque la pantalla. */
function importar(file){
  const r=new FileReader();
  r.onload=async ()=>{
    let j;
    try{ j=JSON.parse(r.result); }
    catch(e){ alert('Ese archivo no es un JSON válido.'); return; }

    const cuenta = COLECCIONES.reduce((a,c)=>a+((j[c]||[]).length),0);
    if(!cuenta){ alert('Ese archivo no tiene datos del panel.'); return; }

    const resumen = COLECCIONES.filter(c=>(j[c]||[]).length)
      .map(c=>`${(j[c]||[]).length} ${c}`).join(', ');
    if(!confirm(`Se van a añadir: ${resumen}.\n\nEsto NO borra lo que ya hay. ¿Seguir?`)) return;

    let n=0;
    try{
      for(const col of COLECCIONES){
        for(const obj of (j[col]||[])){
          const {id, ...limpio} = obj;            // ids nuevos, para no pisar nada
          if(col==='plazas') await grabar(col, obj);
          else { await fs.collection(col).add(limpio); n++; }
        }
      }
      if(j.fiscal) await DOC_FISCAL().set(j.fiscal, {merge:true});
      vista='dinero'; anioSel=null;      // los cobros y gastos se ven aquí
      pintar();
      alert(`Cargados ${n} registros. Los tienes en la pestaña Wallet.`);
    }catch(e){
      console.warn(e);
      alert('Se ha cortado la carga: '+(e.code||e.message));
    }
  };
  r.readAsText(file);
}

/* ─── pintar ───────────────────────────────────────────────────────── */
function pintar(){
  const pie=document.getElementById('pie');
  if(pie) pie.textContent = `En la base: ${D.trabajos.length} trabajos · `
    + `${D.cobros.length} cobros · ${D.gastos.length} gastos · ${D.clientes.length} clientes`;
  const c=$('#cuerpo');
  c.innerHTML = vista==='plazas'?vistaPlazas() : vista==='dinero'?vistaDinero()
    : vista==='clientes'?vistaClientes() : vista==='ajustes'?vistaAjustes() : vistaRegistro();
  document.querySelectorAll('.tab').forEach(t=>
    t.setAttribute('aria-selected', String(t.dataset.v===vista)));
  pintarAvisoMemoria();

  c.querySelectorAll('[data-mes]').forEach(b=>b.addEventListener('click',()=>{
    mesRef = b.dataset.mes==='hoy'
      ? new Date(hoy.getFullYear(), hoy.getMonth(), 1)
      : new Date(mesRef.getFullYear(), mesRef.getMonth()+ +b.dataset.mes, 1);
    pintar();
  }));
  c.querySelectorAll('.res[data-t]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); abrirAcciones(b.dataset.t);
  }));
  c.querySelectorAll('tr[data-t]').forEach(r=>r.addEventListener('click',()=>abrirTrabajo(r.dataset.t)));
  c.querySelectorAll('tr[data-g]').forEach(r=>r.addEventListener('click',()=>abrirGasto(r.dataset.g)));
  c.querySelectorAll('[data-anio]').forEach(b=>b.addEventListener('click',()=>{
    anioSel=+b.dataset.anio; pintar();
  }));
  c.querySelectorAll('[data-acc]').forEach(b=>b.addEventListener('click',()=>{
    const a=b.dataset.acc;
    if(a==='gasto') abrirGasto(null);
    else if(a==='cliente') abrirCliente(null);
    else if(a==='ingreso') abrirIngreso(null);
    else if(a==='fijo') abrirFijo(null);
    else if(a==='plaza') abrirPlaza(null);
    else if(a==='servicio') abrirServicio(null);
    else generarFijos();
  }));
  c.querySelectorAll('tr[data-nom]').forEach(r=>r.addEventListener('click',()=>
    abrirCliente(r.dataset.c||null, r.dataset.nom)));
  c.querySelectorAll('tr[data-i]').forEach(r=>r.addEventListener('click',()=>abrirIngreso(r.dataset.i)));
  c.querySelectorAll('tr[data-f]').forEach(r=>r.addEventListener('click',()=>abrirFijo(r.dataset.f)));
  c.querySelectorAll('tr[data-p]').forEach(r=>r.addEventListener('click',()=>abrirPlaza(r.dataset.p)));
  c.querySelectorAll('tr[data-s]').forEach(r=>r.addEventListener('click',()=>abrirServicio(r.dataset.s)));
  c.querySelectorAll('tr[data-fis]').forEach(r=>r.addEventListener('click',()=>{
    const k=r.dataset.fis;
    const v=prompt(k==='iva'?'IVA que se repercute (%)':'IRPF sobre el beneficio (%)', fiscal()[k]);
    if(v===null) return;
    const n=parseFloat(String(v).replace(',','.'));
    if(!isFinite(n)||n<0||n>60){ alert('Pon un porcentaje entre 0 y 60.'); return; }
    D.fiscal={...fiscal(), [k]:n}; guardar(); pintar();
  }));
  /* buscadores de las tablas largas */
  [['q-ing','tb-ing'],['q-gas','tb-gas']].forEach(([q,tb])=>{
    const inp=c.querySelector('#'+q), cuerpo=c.querySelector('#'+tb);
    if(!inp||!cuerpo) return;
    inp.addEventListener('input',()=>{
      const t=inp.value.trim().toLowerCase();
      cuerpo.querySelectorAll('tr[data-q]').forEach(r=>{
        r.style.display = !t || r.dataset.q.includes(t) ? '' : 'none';
      });
    });
  });
  c.querySelectorAll('.rej-pista[data-plaza]').forEach(p=>p.addEventListener('click',ev=>{
    if(ev.target.closest('.res')) return;
    const plaza=+p.dataset.plaza;
    const r=p.getBoundingClientRect();
    const col=Math.max(0, Math.min(6, Math.floor(((ev.clientX-r.left)/r.width)*7)));
    abrirTrabajo(null,{plaza, entra:aIso(sumar(aFecha(p.dataset.lunes), col))});
  }));
}

/* ─── arranque ─────────────────────────────────────────────────────── */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  vista=t.dataset.v; pintar();
}));
$('#nuevo').addEventListener('click',()=>abrirTrabajo(null));
$('#exportar').addEventListener('click',exportar);
$('#importar').addEventListener('change',e=>{
  const f=e.target.files[0];

  if(f) importar(f);
});
$('#hoja').addEventListener('click',e=>{
  if(e.target.id==='hoja'||e.target.hasAttribute('data-cerrar')) cerrar();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') cerrar(); });

/* ─── acceso y arranque ────────────────────────────────────────────── */
const $acc = document.getElementById('acceso');
const $app = document.getElementById('app');
const $err = document.getElementById('ac-err');

document.getElementById('formAcceso').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn=document.getElementById('ac-ok');
  btn.disabled=true; btn.textContent='Entrando…'; $err.hidden=true;
  try{
    await auth.signInWithEmailAndPassword(
      document.getElementById('ac-mail').value.trim(),
      document.getElementById('ac-pass').value);
  }catch(x){
    const MENSAJES = {
      'auth/invalid-credential' : 'Correo o contraseña incorrectos. Comprueba también que el usuario esté creado en Firebase → Authentication → Users.',
      'auth/wrong-password'     : 'La contraseña no es correcta.',
      'auth/user-not-found'     : 'Ese correo no está dado de alta. Créalo en Firebase → Authentication → Users.',
      'auth/invalid-email'      : 'El correo no tiene un formato válido.',
      'auth/too-many-requests'  : 'Demasiados intentos seguidos. Espera un minuto.',
      'auth/network-request-failed' : 'Sin conexión con Firebase.',
      'auth/operation-not-allowed'  : 'El acceso con correo y contraseña no está activado en Firebase → Authentication → Sign-in method.',
      'auth/unauthorized-domain'    : 'Este dominio no está autorizado. Añádelo en Firebase → Authentication → Settings → Authorized domains.'
    };
    $err.hidden=false;
    $err.innerHTML = (MENSAJES[x.code] || 'No se ha podido entrar.')
      + `<br><span class="cod">${esc(x.code||x.message||'sin código')}</span>`;
    btn.disabled=false; btn.textContent='Entrar';
  }
});

document.getElementById('salir').addEventListener('click', ()=>{
  if(confirm('¿Cerrar sesión?')) auth.signOut();
});

/* Primera vez: si la base está vacía se cargan los datos de partida.
   Se comprueba antes de escribir, para no duplicar si se entra dos veces. */
async function sembrarSiHaceFalta(){
  const [t, sv] = await Promise.all([
    fs.collection('trabajos').limit(1).get(),
    fs.collection('servicios').limit(1).get()
  ]);
  if(!t.empty || !sv.empty) return false;
  semilla();
  for(const col of COLECCIONES){
    for(const obj of (D[col]||[])) await grabar(col, obj);
  }
  return true;
}

auth.onAuthStateChanged(async user=>{
  if(!user){
    $acc.hidden=false; $app.hidden=true;
    const btn=document.getElementById('ac-ok');
    btn.disabled=false; btn.textContent='Entrar';
    escuchando.forEach(off=>off()); escuchando=[]; listo=false;
    return;
  }
  $acc.hidden=true; $app.hidden=false;
  document.getElementById('cuerpo').innerHTML = '<div class="cargando">Cargando datos…</div>';
  try{ await sembrarSiHaceFalta(); }catch(e){ console.warn('siembra', e); }
  try{ const f = await DOC_FISCAL().get(); if(f.exists) D.fiscal = f.data(); }catch(e){}
  escuchar(()=>{
    if(!D.plazas || !D.plazas.length)       D.plazas    = PLAZAS_INI.map(p=>({...p}));
    if(!D.servicios || !D.servicios.length) D.servicios = SERVICIOS_INI.map(x=>({...x,id:nid()}));
    if(!D.clientes) D.clientes=[];
    if(!D.fiscal)   D.fiscal={...FISCAL_INI};
    if(D.fiscal.irpf===19) D.fiscal.irpf=20;
    (D.servicios||[]).forEach(x=>{ if(x.sena===undefined)
      x.sena = (SERVICIOS_INI.find(y=>y.n===x.n)||{}).sena === true; });
    pintar();
  });
});

})();
