<title>Taller · Marbella Custom Cars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  /* Tema claro. La marca es negra y oro, pero esto es una herramienta de
     trabajo que se usa de dia y en un taller con la persiana abierta:
     el fondo blanco se lee con sol y cansa menos la vista. El oro se
     oscurece a #8F6A2A porque el original no contrasta sobre blanco. */
  --fondo:#FFFFFF; --panel:#FAFAF8; --panel2:#F2F2EE;
  --linea:#E7E7E2; --linea2:#D5D5CE;
  --tinta:#14141A; --dim:#71717C;
  --oro:#8F6A2A; --oro-claro:#C9A24E; --oro-suave:#F6EFE0;
  --espera:#3C6D94; --alerta:#BE3B26; --alerta-suave:#FBEBE8;
  --display:'Archivo',system-ui,sans-serif;
  --sans:'Instrument Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --dia:34px;
  --carril:44px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fondo);color:var(--tinta);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:60px;
}
h1,h2,h3{margin:0;font-family:var(--display);font-variation-settings:'wdth' 84,'wght' 700;
  letter-spacing:.01em;text-transform:uppercase}
.env{max-width:1180px;margin:0 auto;padding:0 clamp(14px,3vw,28px)}

/* ── cabecera ── */
.top{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.top-in{display:flex;align-items:center;gap:14px;padding:12px 0}
.marca{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.marca svg{width:30px;height:30px;flex:none}
.marca b{font-family:var(--display);font-variation-settings:'wdth' 78,'wght' 700;
  font-size:15px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.marca span{color:var(--dim);font-size:11px;font-family:var(--mono);letter-spacing:.08em}

/* ── pestañas ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--linea);margin-top:6px}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--dim);font-family:var(--display);font-variation-settings:'wdth' 84,'wght' 600;
  font-size:13px;letter-spacing:.07em;text-transform:uppercase;
  padding:11px 14px;cursor:pointer;transition:color .18s,border-color .18s}
.tab:hover{color:var(--tinta)}
.tab[aria-selected="true"]{color:var(--oro);border-bottom-color:var(--oro)}
.tab:focus-visible{outline:2px solid var(--oro);outline-offset:-2px}
.vista{display:none;padding-top:22px}
.vista.on{display:block}

/* ── indicadores ── */
.kpis{display:grid;gap:1px;background:var(--linea);border:1px solid var(--linea);
  grid-template-columns:repeat(2,1fr);margin-bottom:26px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--panel);padding:15px 16px}
.kpi .et{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);display:block;margin-bottom:7px}
.kpi .n{font-family:var(--display);font-variation-settings:'wdth' 76,'wght' 700;
  font-size:clamp(26px,5.6vw,34px);line-height:1;letter-spacing:-.01em}
.kpi .n small{font-size:.45em;font-variation-settings:'wdth' 84,'wght' 500;
  color:var(--dim);margin-left:4px;letter-spacing:.02em}
.kpi.destaca{background:var(--oro-suave)}
.kpi.destaca .n{color:var(--oro)}
.kpi.riesgo .n{color:var(--alerta)}
.kpi .sub{font-size:11.5px;color:var(--dim);margin-top:5px}

/* ── barra de seccion ── */
.cab{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.cab h2{font-size:14px;letter-spacing:.09em}
.cab .nota{font-size:11.5px;color:var(--dim);margin-left:auto;font-family:var(--mono)}

/* ── linea de tiempo de plazas ── */
.tl-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.btn{appearance:none;background:#fff;border:1px solid var(--linea2);color:var(--tinta);
  font-family:var(--sans);font-size:13px;font-weight:500;padding:8px 13px;cursor:pointer;
  transition:border-color .18s,background .18s,color .18s}
.btn:hover{border-color:var(--oro);color:var(--oro);background:var(--oro-suave)}
.btn:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.btn.pri{background:var(--tinta);border-color:var(--tinta);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--oro);border-color:var(--oro);color:#fff}
.btn.mini{padding:6px 10px;font-size:12px}

.tl{border:1px solid var(--linea2);background:#fff;overflow-x:auto;
  -webkit-overflow-scrolling:touch;box-shadow:0 1px 2px rgba(20,20,26,.04)}
.tl-in{min-width:max-content;position:relative}
.tl-fila{display:flex;align-items:stretch;border-bottom:1px solid var(--linea)}
.tl-fila:last-child{border-bottom:0}
.tl-et{width:96px;flex:none;position:sticky;left:0;z-index:3;background:var(--panel2);
  border-right:1px solid var(--linea2);display:flex;flex-direction:column;
  justify-content:center;padding:0 11px}
.tl-et b{font-family:var(--display);font-variation-settings:'wdth' 80,'wght' 700;
  font-size:12.5px;letter-spacing:.06em}
.tl-et i{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--dim);
  letter-spacing:.05em}
.tl-pista{position:relative;display:flex;height:var(--carril)}
.tl-cab .tl-pista{height:38px}
.tl-cel{width:var(--dia);flex:none;border-right:1px solid #F0F0EC}
.tl-cel.finde{background:#F6F6F2}
.tl-cab{border-bottom:1px solid var(--linea2);background:var(--panel)}
.tl-sem{background:var(--panel2)}
.tl-sem .tl-pista{height:26px}
.tl-sem .tl-et i{font-style:normal;font-family:var(--mono);font-size:9px;
  color:var(--dim);letter-spacing:.11em}
.tl-sem-c{flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim);
  border-right:1px solid var(--linea2)}
.tl-sem-c.actual{color:var(--oro);font-weight:600;background:var(--oro-suave)}
.tl-cel.corte{border-left:1px solid var(--linea2)}
.tl-cab .tl-cel{display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.25}
.tl-cab .tl-cel b{color:var(--tinta);font-weight:600;font-size:12px}
.tl-cab .tl-cel.hoy b{color:var(--oro)}
.hoy-linea{position:absolute;top:0;bottom:0;width:2px;background:var(--oro);
  z-index:2;pointer-events:none}

/* barras de reserva */
.res{position:absolute;top:5px;bottom:5px;border-radius:2px;cursor:grab;
  touch-action:pan-y;   /* el dedo en vertical desplaza la página; en horizontal, arrastra */
  /* Sin esto, mantener pulsado en la tablet pinta el nombre en azul y
     ofrece copiar o sustituir el texto. El nombre se edita en la ficha,
     no aquí. */
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;padding:0 8px;gap:6px;overflow:hidden;
  border:1px solid transparent;transition:transform .14s,box-shadow .14s;z-index:1}
.res:hover{box-shadow:0 3px 10px rgba(20,20,26,.16);transform:translateY(-1px)}
.res:focus-visible{outline:2px solid var(--tinta);outline-offset:1px}
.res b,.res i{user-select:none;-webkit-user-select:none;pointer-events:none}
.res b{font-family:var(--display);font-variation-settings:'wdth' 78,'wght' 700;
  font-size:11.5px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0}
.res i{font-style:normal;font-family:var(--mono);font-size:9.5px;opacity:.78;
  white-space:nowrap;margin-left:auto;flex:none}
.res.curso{background:var(--oro-claro);border-color:#B08D3F;color:#241A05}
.res.reservado{background:var(--oro-suave);border-color:var(--oro-claro);color:var(--oro)}
.res.espera{background:var(--espera);color:#fff}
.res.sinrecoger{background:var(--alerta);color:#fff}
@media(prefers-reduced-motion:no-preference){
  .res.sinrecoger{animation:late 2.6s ease-in-out infinite}
}
@keyframes late{0%,100%{box-shadow:0 0 0 0 rgba(190,59,38,.45)}
                60%{box-shadow:0 0 0 7px rgba(190,59,38,0)}}
/* Seleccionada con un toque: es el estado en el que se puede estirar.
   Se marca con un contorno claro para que se distinga del resto. */
.res.sel{box-shadow:0 0 0 2px var(--tinta),0 4px 14px rgba(20,20,26,.22);z-index:14;
  overflow:visible;      /* los tiradores asoman fuera de la barra */
  touch-action:none}     /* seleccionada = modo edición: el gesto es nuestro */
/* Seleccionada, los tiradores son bolitas visibles CENTRADAS en el borde:
   la mitad queda fuera de la barra. Así se ve exactamente qué se agarra
   y el cuerpo de la barra queda casi entero para mover, no para estirar. */
.res.sel .tira{width:38px;top:50%;bottom:auto;height:44px;transform:translateY(-50%)}
.res.sel .tira.izq{left:-19px} .res.sel .tira.der{right:-19px}
.res.sel .tira::after{opacity:1;left:50%;top:50%;transform:translate(-50%,-50%);
  width:17px;height:17px;border-radius:50%;background:#fff;
  border:2.5px solid var(--tinta);box-shadow:0 1px 5px rgba(20,20,26,.35)}
/* En pantalla táctil NO hay tiradores: un dedo de 40 px sobre un tirador
   de borde nunca va a ser preciso, por grande que se haga. Con el dedo la
   barra entera MUEVE y nada más; la duración se cambia con los botones
   − / + que aparecen al seleccionar. Cero ambigüedad, cero gestos que se
   pisan. Los tiradores quedan solo para el ratón, que sí es preciso. */
@media(hover:none){
  .res .tira{display:none}
}
/* Aviso visual de que ya se puede arrastrar, tras mantener pulsado. */
.res.listo{box-shadow:0 0 0 3px var(--oro);z-index:15}
.res.arrastrando{cursor:grabbing;z-index:20;opacity:.92;overflow:visible;
  box-shadow:0 8px 22px rgba(20,20,26,.28);transition:none}
/* Chip que flota sobre la barra durante el gesto: dice en vivo cuántos
   días quedan o qué día entra. Lo que dice el chip es lo que se guarda. */
.chip-dias{position:absolute;top:-32px;left:50%;transform:translateX(-50%);
  background:var(--tinta);color:#fff;font-family:var(--mono);font-size:11.5px;
  font-weight:600;letter-spacing:.04em;padding:4px 9px;border-radius:3px;
  white-space:nowrap;pointer-events:none;z-index:30;
  box-shadow:0 3px 10px rgba(20,20,26,.3)}
/* Barrita − / + al seleccionar: la duración REAL del trabajo (aunque la
   barra se vea recortada porque sigue en la semana siguiente) y dos
   botones grandes para cambiarla de día en día, exactos, sin arrastres. */
.mini-dias{position:absolute;top:-48px;left:50%;transform:translateX(-50%);
  display:flex;align-items:stretch;background:var(--tinta);color:#fff;
  border-radius:5px;box-shadow:0 5px 16px rgba(20,20,26,.38);z-index:31;
  font-family:var(--mono);user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:none}
.mini-dias .md-b{min-width:42px;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;cursor:pointer;padding:9px 0}
.mini-dias .md-b:active{background:rgba(255,255,255,.2)}
.mini-dias .md-n{display:flex;align-items:center;padding:0 8px;font-size:11.5px;
  font-weight:600;letter-spacing:.03em;white-space:nowrap;
  border-left:1px solid rgba(255,255,255,.22);
  border-right:1px solid rgba(255,255,255,.22)}
/* Tiradores de los extremos: estiran o acortan la estancia. */
.tira{position:absolute;top:0;bottom:0;width:14px;cursor:ew-resize;z-index:2;
  touch-action:none}    /* estirar nunca desplaza la página */
.tira.izq{left:-2px} .tira.der{right:-2px}
.tira::after{content:"";position:absolute;top:50%;transform:translateY(-50%);
  left:5px;width:3px;height:16px;border-radius:2px;
  background:currentColor;opacity:0;transition:opacity .16s}
.res:hover .tira::after{opacity:.4}
.tira:hover::after{opacity:.85}
.res.bloqueo{background:repeating-linear-gradient(45deg,
  #F1F1ED 0 6px, #FAFAF8 6px 12px);
  border-color:var(--linea2);color:var(--dim);
  pointer-events:none}          /* deja pasar el toque a la fila de debajo */

.leyenda{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:11.5px;color:var(--dim)}
.leyenda span{display:flex;align-items:center;gap:6px}
.pt{width:11px;height:11px;border-radius:2px;flex:none;border:1px solid rgba(20,20,26,.12)}

/* ── formulario ── */
.hoja{position:fixed;inset:0;z-index:90;background:rgba(20,20,26,.42);
  display:none;align-items:flex-end;justify-content:center}
.hoja.on{display:flex}
@media(min-width:720px){.hoja{align-items:center}}
.hoja-c{background:#fff;border:1px solid var(--linea2);width:100%;
  max-width:540px;max-height:92vh;overflow-y:auto;padding:20px;
  box-shadow:0 20px 60px rgba(20,20,26,.22)}
.hoja-c h3{font-size:14px;letter-spacing:.08em;margin-bottom:16px}
.campo{margin-bottom:13px}
.campo label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.campo input,.campo select{width:100%;background:#fff;border:1px solid var(--linea2);
  color:var(--tinta);font-family:var(--sans);font-size:16px;padding:11px 12px;
  border-radius:0;appearance:none}
.campo input:focus,.campo select:focus{outline:0;border-color:var(--oro);
  box-shadow:0 0 0 3px var(--oro-suave)}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.acc{display:flex;gap:9px;margin-top:18px}
.acc .btn{flex:1;justify-content:center;text-align:center}
.borrar{color:var(--alerta);border-color:#E9C4BC}
.borrar:hover{border-color:var(--alerta);color:var(--alerta);background:var(--alerta-suave)}

/* ── graficos ── */
.barras{display:flex;align-items:flex-end;gap:clamp(5px,1.6vw,14px);height:210px;
  padding:0 2px;border-bottom:1px solid var(--linea2);margin-bottom:9px}
.mes{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:3px;height:100%;min-width:0}
.par{display:flex;align-items:flex-end;gap:2px;width:100%;height:100%;justify-content:center}
.bar{width:44%;min-height:2px;position:relative;transition:filter .16s}
.bar.i{background:linear-gradient(180deg,var(--oro-claro),#E3D2A8)}
.bar.g{background:#D9D9D3}
.mes:hover .bar{filter:brightness(.94)}
.mes-et{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.04em}
.mes.neg .mes-et{color:var(--alerta);font-weight:600}

.tabla{width:100%;border-collapse:collapse;font-size:13.5px}
.tabla th{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);text-align:left;padding:9px 10px;border-bottom:1px solid var(--linea2);
  font-weight:500;white-space:nowrap}
.tabla td{padding:10px;border-bottom:1px solid var(--linea)}
.tabla td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.tabla tr:hover td{background:var(--panel)}
.pos{color:var(--oro)} .neg{color:var(--alerta)}
.pill{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;
  text-transform:uppercase;padding:3px 7px;border:1px solid var(--linea2);color:var(--dim);
  background:var(--panel)}

.aviso{border-left:3px solid var(--oro-claro);background:var(--oro-suave);
  padding:13px 15px;margin:22px 0;font-size:13.5px;color:#4A4230}
.aviso b{color:var(--oro);font-weight:600}
.vacio{padding:34px 16px;text-align:center;color:var(--dim);font-size:13.5px}
.pie{margin-top:40px;padding:18px 0;border-top:1px solid var(--linea);
  font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.05em}


/* ── calendario mensual ─────────────────────────────────────────────── */
.mes-nav{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.mes-tit{font-size:clamp(15px,3.4vw,19px);letter-spacing:.05em;
  font-variation-settings:'wdth' 82,'wght' 700;text-transform:capitalize;min-width:0}
.btn.flecha{font-size:17px;line-height:1;padding:5px 12px;font-family:var(--display)}

.sem{border:1px solid var(--linea2);background:#fff;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(20,20,26,.04)}
.sem.esta{border-color:var(--oro-claro);box-shadow:0 1px 3px rgba(143,106,42,.16)}
.sem-cab{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  padding:9px 13px;background:var(--panel);border-bottom:1px solid var(--linea)}
.sem.esta .sem-cab{background:var(--oro-suave)}
.sem-cab b{font-family:var(--display);font-variation-settings:'wdth' 82,'wght' 700;
  font-size:12.5px;letter-spacing:.07em;text-transform:uppercase}
.sem-cab span{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.sem-cab em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--oro);
  letter-spacing:.08em;text-transform:uppercase}
.sem-cab i{font-style:normal;margin-left:auto;font-family:var(--mono);font-size:10.5px;
  color:var(--dim)}

/* Toda la rejilla es zona de gestos, no de lectura: aquí no se selecciona
   texto. Ponerlo solo en la barra no bastaba —al mantener pulsado, el
   navegador extendía la selección desde las etiquetas de alrededor y
   acababa marcando media pantalla en azul. */
.rej,.rej *{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent}
.rej{position:relative}
.rej-fila{display:flex;align-items:stretch;border-bottom:1px solid var(--linea)}
.rej-fila:last-child{border-bottom:0}
.rej-et{width:clamp(74px,18vw,96px);flex:none;border-right:1px solid var(--linea2);
  background:var(--panel2);display:flex;flex-direction:column;justify-content:center;
  padding:0 9px;overflow:hidden}
.rej-et b{font-family:var(--display);font-variation-settings:'wdth' 80,'wght' 700;
  font-size:12px;letter-spacing:.05em;white-space:nowrap}
.rej-et i{font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--dim);
  letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rej-pista{position:relative;display:flex;flex:1;min-width:0;height:42px}
.rej-dias .rej-pista{height:34px}
.rej-dias .rej-et{background:var(--panel)}
.rej-cel{flex:1;min-width:0;border-right:1px solid #F0F0EC;
  display:flex;align-items:center;justify-content:center;gap:4px}
.rej-cel:last-child{border-right:0}
.rej-cel.fuera{background:#FAFAF8}
/* El día de hoy se marca con una línea arriba y una base suave, no
   pintando la columna entera: así no parte el calendario en dos. */
.rej-cel.hoy{background:linear-gradient(180deg,
  rgba(143,106,42,.10) 0%, rgba(143,106,42,.03) 100%)}
.rej-fila:first-child .rej-cel.hoy{box-shadow:inset 0 3px 0 0 var(--oro)}
.rej-cel.hoy+.rej-cel{border-left:1px solid rgba(143,106,42,.35)}
.rej-cel.hoy{border-right-color:rgba(143,106,42,.35)}
.rej-dias .rej-cel{font-family:var(--mono);font-size:10px;color:var(--dim)}
.rej-dias .rej-cel b{color:var(--tinta);font-weight:600;font-size:12.5px}
.rej-dias .rej-cel.fuera b{color:var(--dim);font-weight:400}
.rej-dias .rej-cel.hoy b{color:var(--oro)}
.rej-dias .rej-cel.hoy span{color:var(--oro);font-weight:600}

/* un trabajo que cruza de semana se parte: el borde plano avisa de que sigue */
.res.viene{border-top-left-radius:0;border-bottom-left-radius:0;
  border-left:2px solid rgba(20,20,26,.28)}
.res.sigue{border-top-right-radius:0;border-bottom-right-radius:0;
  border-right:2px solid rgba(20,20,26,.28)}
/* movido de fecha: hay que llamar al cliente */
.res.avisar::after{content:"!";position:absolute;top:2px;right:4px;
  font-family:var(--mono);font-size:10px;font-weight:600;color:var(--alerta)}
/* Coche metido en la plaza de reserva: se permite, pero se ve que es
   una excepción y que esa plaza ya no está libre para imprevistos. */
/* Coche metido en la plaza de reserva: se permite, pero se ve que es una
   excepción y que ya no queda colchón para un imprevisto. */
.res.enreserva{box-shadow:inset 0 0 0 2px var(--alerta)}
.fila-reserva .rej-et{background:var(--alerta-suave)}
.fila-reserva .rej-et b{color:var(--alerta)}
.fila-reserva .rej-cel{background:rgba(190,59,38,.035)}
.fila-reserva .rej-cel.fuera{background:rgba(190,59,38,.02)}

@media(max-width:560px){
  .rej-pista{height:38px}
  .res b{font-size:10.5px}
  .res i{display:none}
  .sem-cab i{width:100%;margin-left:0}
}

/* ── añadidos ─────────────────────────────────────────────────────── */
.choque{border-left:3px solid var(--alerta);background:var(--alerta-suave);
  padding:12px 15px;margin:14px 0;font-size:13px;color:#6B2318}
.saldo{font-family:var(--mono);font-size:11px}
.saldo.debe{color:var(--alerta)} .saldo.ok{color:var(--oro)}
.cobros{margin-top:16px;border-top:1px solid var(--linea);padding-top:14px}
.cobro{display:flex;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--linea);font-size:13px}
.cobro .x{margin-left:auto;background:none;border:0;color:var(--dim);cursor:pointer;
  font-size:18px;line-height:1;padding:2px 8px}
.cobro .x:hover{color:var(--alerta)}
.mini-form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px;
  align-items:end}
.mini-et{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.mini-form input,.mini-form select{width:100%;background:#fff;border:1px solid var(--linea2);
  color:var(--tinta);font-family:var(--sans);font-size:15px;padding:9px 10px}
.mini-form input:focus,.mini-form select:focus{outline:0;border-color:var(--oro);
  box-shadow:0 0 0 3px var(--oro-suave)}
.cobro-nuevo{margin-top:4px}
.mini-nota{margin:8px 0 0;font-size:12px;line-height:1.4}
.mini-nota.con{color:var(--oro)}
.mini-nota.sin{color:var(--dim)}

/* ── gastos agrupados por mes ────────────────────────────────────────── */
.grupo{border:1px solid var(--linea);border-bottom:0}
.grupo:last-child{border-bottom:1px solid var(--linea)}
.grupo-cab{width:100%;display:flex;align-items:center;gap:11px;
  padding:11px 14px;background:var(--panel);border:0;cursor:pointer;
  font-family:var(--sans);text-align:left;transition:background .16s}
.grupo-cab:hover{background:var(--panel2)}
.grupo-cab:focus-visible{outline:2px solid var(--oro);outline-offset:-2px}
.grupo-cab i{font-style:normal;font-family:var(--mono);font-size:14px;color:var(--dim);
  width:14px;flex:none;text-align:center}
.grupo-cab b{font-family:var(--display);font-variation-settings:'wdth' 82,'wght' 700;
  font-size:13px;letter-spacing:.06em;text-transform:uppercase;min-width:52px}
.grupo-cab span{font-family:var(--mono);font-size:11px;color:var(--dim)}
.grupo-cab em{margin-left:auto;font-style:normal;font-family:var(--mono);
  font-size:13.5px;font-weight:600}
.grupo.abierto .grupo-cab{background:var(--oro-suave);border-bottom:1px solid var(--linea)}
.grupo:not(.abierto)>.tabla{display:none}
.grupo>.tabla thead th{font-size:9.5px;padding:7px 14px}
/* al buscar se abren todos los meses, si no habría resultados escondidos */
.buscando .grupo>.tabla{display:table!important}
.buscando .grupo-cab i{visibility:hidden}
.grupo.abierto .grupo-cab i,.grupo.abierto .grupo-cab em{color:var(--oro)}
.grupo .tabla td{padding:9px 14px}
.pill.sinf{color:var(--alerta);border-color:#E9C4BC;background:var(--alerta-suave)}

/* ── plantillas de gasto fijo ────────────────────────────────────────── */
.plantillas{border:1px solid var(--linea2);margin:12px 0 4px;background:#fff}
.plantillas-cab{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--linea)}
.plantillas-cab b{font-family:var(--display);font-variation-settings:'wdth' 84,'wght' 700;
  font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.plantillas-cab span{font-family:var(--sans);font-size:12px;color:var(--dim)}
.plantillas-cab em{margin-left:auto;font-style:normal;font-family:var(--mono);
  font-size:12.5px;font-weight:600;color:var(--oro)}
.plantillas .tabla td{padding:8px 14px}

/* ── zona peligrosa ──────────────────────────────────────────────────── */
.peligro{margin-top:50px;padding-top:20px;border-top:1px solid var(--linea)}
.peligro-abrir{appearance:none;background:none;border:0;cursor:pointer;padding:4px 0;
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--dim);
  transition:color .18s}
.peligro-abrir:hover{color:var(--alerta)}
.peligro-abrir:focus-visible{outline:2px solid var(--alerta);outline-offset:3px}
.peligro-c{margin-top:12px;border:1px solid #E9C4BC;background:var(--alerta-suave);
  padding:16px 18px;max-width:560px}
.peligro-c>b{display:block;font-family:var(--display);
  font-variation-settings:'wdth' 84,'wght' 700;font-size:14px;
  color:var(--alerta);margin-bottom:8px}
.peligro-c p{margin:0 0 10px;font-size:13.5px;line-height:1.55;color:#6B2318}
.peligro-c .peligro-tip{font-size:12.5px;color:#8B5A4A}

/* ── selector de año ─────────────────────────────────────────────────── */
/* ── selector de periodo ─────────────────────────────────────────────── */
.selper{margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--linea)}
.selper-fila{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.selper-et{font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim)}
.selper-tipo{display:flex;gap:1px;background:var(--linea);border:1px solid var(--linea)}
.tipo-btn{appearance:none;background:var(--panel);border:0;cursor:pointer;
  padding:7px 15px;font-family:var(--display);
  font-variation-settings:'wdth' 84,'wght' 600;font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim);transition:background .16s,color .16s}
.tipo-btn:hover{background:#fff;color:var(--tinta)}
.tipo-btn.on{background:var(--tinta);color:#fff}
.tipo-btn:focus-visible{outline:2px solid var(--oro);outline-offset:-2px}
.selper-anio{display:flex;gap:8px;margin-left:auto}
.selper-detalle{display:flex;gap:1px;background:var(--linea);
  border:1px solid var(--linea);margin-top:10px;overflow-x:auto}
.selper-detalle .tri-btn{flex:1;min-width:56px;padding:8px 6px;line-height:1.3}
.selper-detalle .tri-btn em{display:block;font-style:normal;font-size:9px;opacity:.75}
.mes.apagado{opacity:.35}
.mes.apagado:hover{opacity:.7}
.rbloque-nota{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim);text-align:center}

.selanio{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:20px;
  padding-bottom:12px;border-bottom:1px solid var(--linea)}
.selanio-et{font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim)}
.anio-btn{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  padding:2px 4px 4px;cursor:pointer;color:var(--dim);
  font-family:var(--display);font-variation-settings:'wdth' 80,'wght' 700;
  font-size:22px;letter-spacing:.02em;transition:color .18s,border-color .18s}
.anio-btn:hover{color:var(--tinta)}
.anio-btn.on{color:var(--tinta);border-bottom-color:var(--oro)}
.anio-btn:focus-visible{outline:2px solid var(--oro);outline-offset:3px}
.selanio-nota{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}

/* ── pestañas de las listas ──────────────────────────────────────────── */
.subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--linea);border:1px solid var(--linea);margin-bottom:2px}
.subtab{appearance:none;background:var(--panel);border:0;cursor:pointer;
  padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;
  border-bottom:2px solid transparent;transition:background .16s,border-color .16s}
.subtab b{font-family:var(--display);font-variation-settings:'wdth' 84,'wght' 600;
  font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.subtab em{font-style:normal;font-family:var(--mono);font-size:13.5px;color:var(--dim)}
.subtab:hover{background:#fff}
.subtab.on{background:#fff;border-bottom-color:var(--oro)}
.subtab.on b{color:var(--tinta)}
.subtab.on em{color:var(--oro);font-weight:600}
.subtab:focus-visible{outline:2px solid var(--oro);outline-offset:-2px}
@media(max-width:560px){
  .subtab{padding:9px 8px}
  .subtab b{font-size:10px;letter-spacing:.04em}
  .subtab em{font-size:12px}
}

/* ── ruedas de reparto ───────────────────────────────────────────────── */
.ruedas{display:grid;gap:14px;margin-bottom:8px}
@media(min-width:720px){.ruedas{grid-template-columns:1fr 1fr}}
/* Las dos columnas comparten rejilla vertical: cabecera, subtítulo,
   selector, rueda y leyenda ocupan la misma altura en las dos, así los
   gráficos quedan a la misma altura pase lo que pase con el texto. */
.rbloque{border:1px solid var(--linea2);background:#fff;padding:16px;
  display:grid;grid-template-rows:26px 20px 34px auto 1fr;justify-items:center;gap:8px}
.rbloque-cab{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;
  width:100%;gap:6px}
.rbloque-cab b{grid-column:2;text-align:center;
  font-family:var(--display);font-variation-settings:'wdth' 82,'wght' 700;
  font-size:14px;letter-spacing:.05em;text-transform:capitalize;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-nav{display:flex;align-items:center;justify-content:center;min-height:26px}
.rbloque-cab .flecha{appearance:none;background:#fff;border:1px solid var(--linea2);
  color:var(--tinta);cursor:pointer;padding:1px 8px;font-size:15px;line-height:1.2;
  font-family:var(--display);transition:border-color .16s,color .16s}
.rbloque-cab .flecha:hover{border-color:var(--oro);color:var(--oro)}
.rbloque-cab .flecha[disabled]{opacity:.28;cursor:not-allowed}
.rbloque-sub{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center}
.tri-sel,.mes-sel{display:flex;gap:1px;background:var(--linea);
  border:1px solid var(--linea);width:100%;overflow:hidden}
.mes-sel{overflow-x:auto}
.tri-btn{flex:1;appearance:none;background:var(--panel);border:0;cursor:pointer;
  padding:6px 4px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;
  color:var(--dim);transition:background .16s,color .16s}
.tri-btn:hover{background:#fff;color:var(--tinta)}
.tri-btn.on{background:var(--oro-suave);color:var(--oro);font-weight:600}
.tri-btn:focus-visible{outline:2px solid var(--oro);outline-offset:-2px}
.rueda{width:100%;max-width:210px;height:auto;margin:0;align-self:center}
.rueda circle{transition:opacity .16s}
.rueda:hover circle{opacity:.55}
.rueda circle:hover{opacity:1}
.r-val{text-anchor:middle;font-family:var(--display);
  font-variation-settings:'wdth' 76,'wght' 700;font-size:21px;fill:var(--tinta)}
.r-et{text-anchor:middle;font-family:var(--mono);font-size:8px;
  letter-spacing:.1em;text-transform:uppercase;fill:var(--dim)}

.leyenda-r{list-style:none;margin:6px 0 0;padding:0;width:100%;align-self:start}
.leyenda-r li{display:flex;align-items:center;gap:9px;padding:6px 2px;
  border-bottom:1px solid var(--linea);font-size:13px}
.leyenda-r li:last-child{border-bottom:0}
.leyenda-r i{width:11px;height:11px;border-radius:2px;flex:none}
.leyenda-r span{color:var(--dim)}
.leyenda-r b{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:600}
.leyenda-r b.neg{color:var(--alerta)}
.leyenda-r em{font-style:normal;font-family:var(--mono);font-size:11px;
  color:var(--dim);min-width:34px;text-align:right}

/* ── detalle de un trimestre ─────────────────────────────────────────── */
.detalle td{padding:0!important;background:var(--panel)}
.det{display:grid;gap:1px;background:var(--linea);border-top:1px solid var(--linea2)}
@media(min-width:760px){.det{grid-template-columns:repeat(3,1fr)}}
.det-b{background:#fff;padding:14px 16px}
.det-b>b{display:block;font-family:var(--display);
  font-variation-settings:'wdth' 84,'wght' 700;font-size:12px;
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px}
.det-b p{margin:10px 0 0;font-size:11.5px;line-height:1.5;color:var(--dim)}
.lin{display:flex;align-items:baseline;gap:10px;padding:3px 0;font-size:13px;color:var(--dim)}
.lin b{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--tinta);font-weight:500}
.lin.res{border-top:1px solid var(--linea);margin-top:6px;padding-top:7px;color:var(--tinta)}
.lin.res b{font-weight:600;font-size:14.5px;color:var(--oro)}
.anio{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.buscar{flex:1;min-width:150px;background:#fff;border:1px solid var(--linea2);
  color:var(--tinta);font-family:var(--sans);font-size:14px;padding:7px 11px}
.buscar:focus{outline:0;border-color:var(--oro);box-shadow:0 0 0 3px var(--oro-suave)}
.desglose{display:flex;flex-wrap:wrap;gap:14px;padding:10px 12px;background:var(--panel);
  border:1px solid var(--linea);font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.desglose b{color:var(--tinta);font-weight:600}
.desglose .tot{margin-left:auto}
.desglose .tot b{color:var(--oro)}
.desglose{flex-wrap:wrap}
.desglose .sinf{color:var(--alerta)}
.desglose .reten{width:100%;margin:6px 0 0;font-family:var(--sans);font-size:12px;
  line-height:1.5;color:#6B5B36}
.desglose{flex-wrap:wrap}
.desglose .reten{width:100%;margin:6px 0 0;font-family:var(--sans);font-size:12px;
  line-height:1.45;color:#6B5B36}

/* ── acciones rápidas (tablet) ──────────────────────────────────────── */
.acc-cab{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--linea)}
.acc-cab b{display:block;font-family:var(--display);
  font-variation-settings:'wdth' 80,'wght' 700;font-size:19px;letter-spacing:.02em}
.acc-cab span{display:block;font-size:13px;color:var(--dim);margin-top:2px}
.acc-cab .acc-eur{font-family:var(--mono);font-size:12.5px;color:var(--tinta);margin-top:6px}
.acc-cab .debe{color:var(--alerta);font-weight:600}
.acceso{position:fixed;inset:0;z-index:200;display:flex;align-items:center;
  justify-content:center;background:var(--fondo);padding:22px}
.acceso[hidden]{display:none}
.acceso-c{width:100%;max-width:330px;text-align:center}
.acceso-logo{width:64px;height:64px;margin-bottom:18px}
.acceso-c h1{font-size:16px;letter-spacing:.08em;margin-bottom:3px}
.acceso-c p{margin:0 0 26px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.acceso-c .campo{text-align:left}
.acceso-err{margin-top:14px;padding:10px 12px;background:var(--alerta-suave);
  border-left:3px solid var(--alerta);color:#6B2318;font-size:13px;text-align:left}
.acceso-err[hidden]{display:none}
/* ── factura ─────────────────────────────────────────────────────────
   Medidas en milímetros para que la pantalla y el papel coincidan. */
.hoja-c.ancho{max-width:820px}
.fac-acciones{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fac-prev{background:#f4f4f2;padding:14px;overflow-x:auto}
.fac{width:182mm;background:#fff;padding:0;margin:0 auto;
  font-family:var(--sans);color:#14141A;font-size:10.5pt;line-height:1.45}
.fac-top{display:flex;justify-content:space-between;align-items:flex-start;
  gap:22px;padding-bottom:16px;border-bottom:2px solid #14141A}
.fac-marca{min-width:0;flex:1 1 auto}
.fac-meta{flex:0 0 auto}
.fac-marca{display:flex;gap:12px;align-items:flex-start}
.fac-logo{width:52px;height:52px;flex:none}
.fac-emisor{display:flex;flex-direction:column;line-height:1.4}
.fac-emisor b{font-family:var(--display);font-variation-settings:'wdth' 76,'wght' 700;
  font-size:10.5pt;letter-spacing:.02em;text-transform:uppercase;
  margin-bottom:3px;line-height:1.15;white-space:nowrap}
.fac-emisor span{font-size:8pt;color:#55555e}
.fac-meta{text-align:right}
.fac-meta h1{font-family:var(--display);font-variation-settings:'wdth' 78,'wght' 700;

<script>

/* ══════════════════════════════════════════════════════════════════════
   Panel de taller · Marbella Custom Cars
   Version de un solo archivo, para poder verla sin instalar nada.
   ══════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';

/* ─── catalogo ─────────────────────────────────────────────────────── */
const SERVICIOS_INI = [
  {n:'Lavado Gold',          d:1, p:150},
  {n:'Lavado Black',         d:1, p:250},
  {n:'Lavado Platinum',      d:1, p:350},
  {n:'Lavado de motor',      d:1, p:90},
  {n:'Pulido',               d:2, p:0},
  {n:'Pulido + cerámico',    d:3, p:800},
  {n:'PPF Full Front', sena:true,       d:3, p:1800},
  {n:'PPF Full Body', sena:true,        d:7, p:4200},
  {n:'PPF sectorizado', sena:true,      d:2, p:0},
  {n:'Wrapping total', sena:true,       d:5, p:3500},
  {n:'Wrapping parcial', sena:true,     d:2, p:700},
  {n:'Limpieza de interior', d:1, p:250},
  {n:'Llantas (4)',          d:2, p:560},
  {n:'Pinzas de freno',      d:1, p:250},
  {n:'Cristales',            d:1, p:190},
  {n:'Sacabollos',           d:1, p:0},
  {n:'Body kit / carbono',   d:4, p:0},
  {n:'Retapizado',           d:5, p:0},
  {n:'Otro',                 d:1, p:0}
];
/* Plazas y servicios viven en los datos, no en el codigo: Joaquin puede
   renombrarlos, cambiar precios o duraciones, y anadir o quitar plazas. */
const PLAZAS_INI = [
  {id:1,nom:'Plaza 1',uso:'Trabajo largo',libre:false},
  {id:2,nom:'Plaza 2',uso:'Trabajo largo',libre:false},
  {id:3,nom:'Plaza 3',uso:'PPF / vinilo',libre:false},
  {id:4,nom:'Plaza 4',uso:'Lavado / rápido',libre:false},
  {id:5,nom:'Plaza 5',uso:'Fuera o vecino',libre:false},
  {id:6,nom:'Plaza 6',uso:'Imprevistos',libre:true}
];
const plazas      = () => D.plazas || [];
const esLibre     = id => !!(plazas().find(p=>p.id===+id)||{}).libre;
const reservables = () => plazas().filter(p=>!p.libre);
const servicios   = () => D.servicios || [];
/* Alfabético, pero con "Otro" siempre al final: es el cajón de sastre y
   en medio de la lista estorba. Al ordenar por nombre, los lavados, los
   PPF y los wrapping quedan agrupados solos por el prefijo. */
function ordenServicios(a,b){
  const A=(a.n||''), B=(b.n||'');
  if(A==='Otro') return 1;
  if(B==='Otro') return -1;
  return A.localeCompare(B,'es',{sensitivity:'base'});
}
/* Solo el PPF y el vinilo se cobran al 50 % por adelantado: hay que apartar
   material y bloquear la plaza. El resto se cobra al entregar. */
const pideSena = nom => !!(servicios().find(x=>x.n===nom)||{}).sena;
const ESTADOS = {reservado:'Reservado',curso:'En curso',espera:'Esperando',
                 sinrecoger:'Sin recoger',entregado:'Entregado'};
const CATEGORIAS = {material:'Material (PPF, vinilos, químicos)',
  fijo:'Fijos (alquiler, luz, agua, alarma)', personal:'Personal y horas de terceros',
  prestamo:'Préstamos', marketing:'Publicidad', otro:'Otros'};
const VIAS = ['Efectivo','Transferencia','Débito','Crédito','Banco'];   // gastos
/* Para cobrar solo hay tres. 'banco' es una salida, no una entrada.
   El efectivo no genera IVA ni IRPF; los otros dos sí. */
/* Cada gasto se comporta distinto ante Hacienda. Tratarlos todos como
   "21 % incluido" descuadra el IVA deducible y el beneficio. */
const TIPOS_GASTO = {
  compra:      {n:'Compra o material (IVA 21 %)',        iva:21, ret:0,  deduce:true},
  reducido:    {n:'IVA reducido (10 %)',                 iva:10, ret:0,  deduce:true},
  alquiler:    {n:'Alquiler del local',                  iva:21, ret:19, deduce:true},
  profesional: {n:'Profesional (gestoría, abogado)',     iva:21, ret:15, deduce:true},
  exento:      {n:'Sin IVA (seguro, banco, tasas)',      iva:0,  ret:0,  deduce:true},
  prestamo:    {n:'Devolución de préstamo',              iva:0,  ret:0,  deduce:false},
  sinfactura:  {n:'Sin factura',                         iva:0,  ret:0,  deduce:false},
};
/* Compatibilidad: los gastos cargados antes no tienen tipo. Se les aplica
   el criterio antiguo para que sus números no cambien solos. */
const tipoDe = g => TIPOS_GASTO[g.tipo] ||
  (g.conFactura===false ? TIPOS_GASTO.sinfactura : TIPOS_GASTO.compra);

/* Desglose de un gasto. Si trae base, manda la base; si no, se deduce del
   importe suponiendo que el IVA va dentro (los antiguos). */
function desgloseGasto(g){
  const t = tipoDe(g);
  /* Se anota lo que sale de la cuenta y de ahí se despeja la base.
     En una compra normal eso es base + IVA, así que basta dividir.
     En el alquiler es base + IVA − retención, porque parte no se le paga
     al proveedor: se ingresa a Hacienda. Por eso el divisor lleva las dos. */
  const base = g.base != null ? g.base
             : (g.importe||0)/(1 + t.iva/100 - t.ret/100);
  const iva  = base * t.iva/100;
  const ret  = base * t.ret/100;
  return {
    t, base, iva, ret,
    alProveedor : base + iva - ret,        // lo que sale de la cuenta
    deducible   : t.deduce ? base : 0,     // lo que resta beneficio
    ivaSoportado: t.deduce ? iva  : 0      // lo que se recupera de IVA
  };
}

const VIAS_COBRO = ['Efectivo','Transferencia','Débito','Crédito'];
/* Solo el efectivo queda fuera de IVA e IRPF. Se compara en minúsculas
   para que los cobros ya guardados como 'efectivo' sigan valiendo. */
const llevaImpuestos = v => String(v||'').toLowerCase() !== 'efectivo';

/* Tipos fiscales. Van en los datos y se editan en Ajustes: los fija la
   gestoría, no el programa. Los valores de partida son los que nos pasó
   Joaquín; conviene que su asesor los confirme antes de fiarse. */
const FISCAL_INI = {iva:21, irpf:20, viasFacturadas:['transferencia','tarjeta','debito','credito','banco']};
const fiscal = () => D.fiscal || FISCAL_INI;

/** ¿Este cobro va con factura? Por defecto, todo lo que no es efectivo. */
const esFacturado = c =>
  c.facturado !== undefined ? !!c.facturado
    : fiscal().viasFacturadas.includes(String(c.via||'').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g,''));

/** Base imponible: si lleva factura, el importe cobrado incluye el IVA. */
const baseDe = c => esFacturado(c) ? (c.importe||0)/(1+fiscal().iva/100) : (c.importe||0);
const ivaDe  = c => esFacturado(c) ? (c.importe||0) - baseDe(c) : 0;

const TRIMESTRE = f => Math.floor(aFecha(f).getMonth()/3)+1;

/* Reparto del dinero en un periodo cualquiera. Sirve para el año y para
   un mes suelto: la cuenta es la misma, solo cambia el filtro. */
/* Reparto del dinero de un periodo.
   TODO se cuenta en bruto, tal como pasa por la caja: si cobra 1.210 €,
   entraron 1.210 €. El IVA se descuenta UNA sola vez, cuando se liquida.
   Contar los ingresos sin IVA y además restar el IVA lo descontaba dos
   veces y hacía parecer que quedaba menos dinero del que hay. */
function reparto(dentro){
  let entra=0, baseFact=0, ivaRep=0, efectivo=0;
  let fijos=0, variables=0, baseGasto=0, ivaSop=0, retenciones=0;

  D.cobros.forEach(c=>{
    if(!dentro(aFecha(c.fecha))) return;
    entra += c.importe||0;                       // lo que tocó la cuenta
    if(esFacturado(c)){ baseFact += baseDe(c); ivaRep += ivaDe(c); }
    else efectivo += c.importe||0;
  });

  D.gastos.forEach(g=>{
    if(!dentro(aFecha(g.fecha))) return;
    const y = desgloseGasto(g);
    if(esGastoFijo(g)) fijos += y.alProveedor; else variables += y.alProveedor;
    baseGasto   += y.deducible;
    ivaSop      += y.ivaSoportado;
    retenciones += y.ret;                        // se ingresan aparte
  });

  const ivaPagar = ivaRep - ivaSop;              // negativo = a su favor
  const irpf     = Math.max(0, baseFact - baseGasto) * fiscal().irpf/100;
  const libre    = entra - fijos - variables - Math.max(0,ivaPagar) - irpf - retenciones;

  return {entra, baseFact, efectivo, fijos, variables,
          ivaPagar, ivaRep, ivaSop, irpf, retenciones, libre,
          salidas: fijos + variables + Math.max(0,ivaPagar) + irpf + retenciones};
}

/* Rueda en SVG. Sin librerías: son cinco arcos sobre un círculo. */
function rueda(partes, centroVal, centroEt){
  const total = partes.reduce((a,p)=>a+Math.max(0,p.v),0) || 1;
  const R=70, GROSOR=26, C=2*Math.PI*R;
  let off=0;
  const arcos = partes.map(p=>{
    const v=Math.max(0,p.v), largo=v/total*C;
    const el=`<circle cx="90" cy="90" r="${R}" fill="none" stroke="${p.c}"
      stroke-width="${GROSOR}" stroke-dasharray="${largo.toFixed(2)} ${(C-largo).toFixed(2)}"
      stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 90 90)"><title>${esc(p.n)}: ${eur(v)} €</title></circle>`;
    off += largo;
    return el;
  }).join('');
  return `<svg viewBox="0 0 180 180" class="rueda" role="img" aria-label="${esc(centroEt)}">
      <circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--linea)" stroke-width="${GROSOR}"/>
      ${arcos}
      <text x="90" y="86" class="r-val">${centroVal}</text>
      <text x="90" y="102" class="r-et">${esc(centroEt)}</text>
    </svg>`;
}

/* Fijo o variable no es lo mismo que la categoría. Google Ads es Marketing
   pero se paga todos los meses, así que para el taller es fijo. Manda la
   marca del propio gasto; si no la tiene, se deduce. */
const esGastoFijo = g => g.fijo !== undefined
  ? !!g.fijo
  : (!!g.origenFijo || g.categoria === 'fijo');

/* Los movimientos importados de 2026 traen las vías en minúscula y alguna
   'tarjeta' antigua. Se normaliza solo al mostrarlas. */
const VIA_BONITA = {efectivo:'Efectivo', transferencia:'Transferencia',
  tarjeta:'Crédito', debito:'Débito', credito:'Crédito', banco:'Banco'};

/** Cuentas del trimestre: lo que hay que declarar y lo que queda limpio. */
function trimestres(anio){
  const t = [1,2,3,4].map(n=>({n, baseFact:0, ivaRep:0, efectivo:0,
                               gastos:0, ivaSop:0, baseGasto:0, sinFactura:0, retenido:0}));
  D.cobros.forEach(c=>{
    const d=aFecha(c.fecha); if(d.getFullYear()!==anio) return;
    const x=t[TRIMESTRE(c.fecha)-1];
    if(esFacturado(c)){ x.baseFact+=baseDe(c); x.ivaRep+=ivaDe(c); }
    else x.efectivo+=c.importe||0;
  });
  D.gastos.forEach(g=>{
    const d=aFecha(g.fecha); if(d.getFullYear()!==anio) return;
    const x=t[TRIMESTRE(g.fecha)-1];
    const y=desgloseGasto(g);
    x.gastos    += y.alProveedor;
    x.baseGasto += y.deducible;
    x.ivaSop    += y.ivaSoportado;
    x.retenido  += y.ret;
    if(!y.t.deduce) x.sinFactura += y.base;
  });
  t.forEach(x=>{
    x.ivaPagar = x.ivaRep - x.ivaSop;               // modelo 303
    x.beneficio = x.baseFact - x.baseGasto;         // beneficio declarable
    x.irpf = Math.max(0, x.beneficio) * fiscal().irpf/100;
    // Igual que en reparto(): en bruto y el IVA una sola vez.
    x.neto = x.baseFact + x.ivaRep + x.efectivo
           - x.gastos - Math.max(0,x.ivaPagar) - x.irpf - x.retenido;
  });
  return t;
}

/* Cada movimiento es un documento suelto dentro de su colección. Ninguno
   crece con el tiempo: crece el número de documentos, que es lo que
   Firestore hace bien. Es lo contrario del error de acumular todo en uno. */
const COLECCIONES = ['trabajos','cobros','gastos','clientes','fijos','plazas','servicios','facturas','presupuestos'];
const DOC_FISCAL = () => fs.collection('config').doc('fiscal');

/** Se suscribe a todas las colecciones. Firestore avisa de cada cambio,
    así que lo que carga Joaquín en la tablet aparece solo en tu pantalla. */
function escuchar(alCargar){
  let pendientes = COLECCIONES.length;
  escuchando.forEach(off=>off());
  escuchando = COLECCIONES.map(col =>
    fs.collection(col).onSnapshot(snap => {
      /* Las plazas se referencian por número desde cada trabajo, así que
         su id tiene que seguir siendo el mismo número, no el que genere
         Firestore. Se guardan con id de documento '1', '2'… */
      // Se refresca la huella: lo que ya no esté en el servidor deja de
      // considerarse sincronizado y, sobre todo, no se vuelve a escribir.
      [...sincronizado.keys()].forEach(k=>{ if(k.startsWith(col+'/')) sincronizado.delete(k); });
      snap.docs.forEach(d=> sincronizado.set(huella(col, col==='plazas'?Number(d.id):d.id),
                                             JSON.stringify(d.data())));
      D[col] = snap.docs.map(d => col==='plazas'
        ? ({...d.data(), id:Number(d.id)})
        : ({id:d.id, ...d.data()}));
      if(col==='plazas') D.plazas.sort((a,b)=>a.id-b.id);
      if(col==='servicios') D.servicios.sort(ordenServicios);
      if(pendientes > 0){ pendientes--; if(pendientes === 0){ listo = true; alCargar(); } }
      else if(listo) pintar();
    }, e => {
      console.warn('error en', col, e);
      if(e && e.code==='permission-denied') avisoPermisos();
      if(pendientes > 0){ pendientes--; if(pendientes === 0){ listo = true; alCargar(); } }
    })
  );
}

/* Escritura. Se escribe el documento concreto que cambió, no todo el
   conjunto: así dos personas pueden trabajar a la vez sin pisarse. */
async function grabar(col, obj){
  const {id, ...limpio} = obj;
  if(col === 'plazas'){ await fs.collection(col).doc(String(id)).set(limpio, {merge:true}); return id; }
  // Los ids de Firestore tienen 20 caracteres; los provisionales, muchos menos.
  if(id && String(id).length >= 18){ await fs.collection(col).doc(id).set(limpio, {merge:true}); return id; }
  const ref = await fs.collection(col).add(limpio);
  return ref.id;
}
async function borrarDoc(col, id){ await fs.collection(col).doc(id).delete(); }

/* Huella de lo que ya está en el servidor. Sin esto, cada guardado
   reescribía TODOS los documentos: además de lento, resucitaba lo que se
   hubiera borrado desde la consola de Firebase. */
const sincronizado = new Map();
const huella = (col,id) => col+'/'+id;

let guardando=null;
function guardar(){
  clearTimeout(guardando);
  guardando = setTimeout(async ()=>{
    try{
      let escritos=0;
      for(const col of COLECCIONES){
        for(const obj of (D[col]||[])){
          const {id, ...limpio} = obj;
          const cuerpo = JSON.stringify(limpio);
          // Ya está igual en el servidor: no se toca.
          if(id && sincronizado.get(huella(col,id)) === cuerpo) continue;
          const nuevoId = await grabar(col, obj);
          if(nuevoId && nuevoId !== id) obj.id = nuevoId;   // evita duplicar
          sincronizado.set(huella(col, obj.id), cuerpo);
          escritos++;
        }
      }
      if(D.fiscal){
        const f=JSON.stringify(D.fiscal);
        if(sincronizado.get('config/fiscal')!==f){
          await DOC_FISCAL().set(D.fiscal, {merge:true});
          sincronizado.set('config/fiscal', f);
        }
      }
    }catch(e){ console.warn('no se pudo guardar', e); avisoError(e); }
  }, 500);
}

const cobrado = t => D.cobros.filter(c=>c.trabajoId===t.id).reduce((a,c)=>a+(c.importe||0),0);
/* Coste de material imputado a un trabajo. OJO: esto NO es un gasto nuevo de
   caja —el rollo de PPF ya se pagó cuando se compró—, es repartir ese coste
   entre los coches donde se usó. Sirve para saber el margen real de cada uno. */
const materialDe = t => (t.materiales||[]).reduce((a,m)=>a+(m.coste||0),0);
const margenDe   = t => (t.presupuesto||0) - materialDe(t);
const pendiente = t => Math.max(0,(t.presupuesto||0)-cobrado(t));

function ocupacion(desde,ventana){
  // ojo: no llamar 'plazas' a esta variable, taparia a la funcion plazas()
  const hasta=sumar(desde,ventana-1), nres=reservables().length;
  let dias=0, ing=0;
  D.trabajos.forEach(t=>{
    if(esLibre(t.plaza)) return;
    const e=aFecha(t.entra), s=salida(t);
    const a=e>desde?e:desde, b=s<hasta?s:hasta;
    const n=diasEntre(a,b)+1;
    if(n>0){ dias+=n; ing+=(t.presupuesto||0)*(n/Math.max(1,t.dias)); }
  });
  const cap=nres*ventana;
  return {dias,cap,pct:cap?Math.round(100*dias/cap):0, porDia: dias?ing/dias:0};
}

/** Qué otros trabajos pisaría este si ocupara desde 'entra' durante 'dias'. */
function pisaA(t, entra, dias){
  const e=aFecha(entra), sa=sumar(e, Math.max(1,dias)-1);
  return D.trabajos.filter(o=>o.id!==t.id && o.plaza===t.plaza && o.estado!=='entregado'
    && aFecha(o.entra)<=sa && salida(o)>=e);
}

/** Plazas donde ese hueco está libre, para poder mover al afectado. */
function plazasLibres(t, entra, dias){
  const e=aFecha(entra), sa=sumar(e, Math.max(1,dias)-1);
  return plazas().filter(p=>{
    if(p.id===t.plaza) return false;
    return !D.trabajos.some(o=>o.id!==t.id && o.plaza===p.id && o.estado!=='entregado'
      && aFecha(o.entra)<=sa && salida(o)>=e);
  });
}

function choques(){
  const act=D.trabajos.filter(t=>t.estado!=='entregado'), out=[];
  for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){
    const a=act[i],b=act[j];
    if(a.plaza!==b.plaza||esLibre(a.plaza)) continue;
    if(aFecha(a.entra)<=salida(b)&&aFecha(b.entra)<=salida(a)) out.push([a,b]);
  }
  return out;
}

function porMes(anio){
  const f=MESES.map((m,i)=>({mes:m,n:i+1,ing:0,gas:0,cat:{}}));
  D.cobros.forEach(c=>{const d=aFecha(c.fecha); if(d.getFullYear()===anio) f[d.getMonth()].ing+=c.importe||0;});
  D.gastos.forEach(g=>{const d=aFecha(g.fecha); if(d.getFullYear()!==anio) return;
    const x=f[d.getMonth()]; x.gas+=g.importe||0;
    const k=g.categoria||'otro'; x.cat[k]=(x.cat[k]||0)+(g.importe||0);});
  return f;
}

function anios(){
  const s=new Set();
  D.cobros.concat(D.gastos).forEach(x=>x.fecha&&s.add(aFecha(x.fecha).getFullYear()));
  if(!s.size) s.add(hoy.getFullYear());
  return [...s].sort((a,b)=>b-a);
}

function duraciones(){
  const acc={};
  D.trabajos.forEach(t=>{
    if(t.estado!=='entregado'||!t.servicio) return;
    (acc[t.servicio]=acc[t.servicio]||[]).push(t.dias);
  });
  return Object.entries(acc).map(([s,v])=>{
    v.sort((a,b)=>a-b);
    return {serv:s,n:v.length,mediana:v[Math.floor(v.length/2)],min:v[0],max:v[v.length-1],
            estimada:(servicios().find(x=>x.n===s)||{}).d};
  }).sort((a,b)=>b.n-a.n);
}

  let h=`<div class="kpis">
    <div class="kpi destaca"><span class="et">Ocupación de ${esc(nombreMes.split(' ')[0])}</span>
      <div class="n">${oc.pct}<small>%</small></div>
      <div class="sub">${oc.dias} de ${oc.cap} días-plaza</div></div>
    <div class="kpi"><span class="et">Por plaza y día</span>
      <div class="n">${eur(oc.porDia)}<small>€</small></div>
      <div class="sub">lo que rinde cada plaza</div></div>
    <div class="kpi"><span class="et">Coches dentro hoy</span>
      <div class="n">${dentro.length}</div>
      <div class="sub">${ocupadas} de ${reservables().length} plazas ocupadas</div></div>
    <div class="kpi riesgo"><span class="et">Sin recoger</span>
      <div class="n">${sinRec}</div>
      <div class="sub">terminados, ocupando plaza</div></div></div>`;

  if(ch.length) h+=`<div class="choque"><b>Hay ${ch.length} choque${ch.length>1?'s':''} de plaza.</b> `
    + ch.map(([a,b])=>`${esc(a.coche)} y ${esc(b.coche)} en la plaza ${a.plaza}.`).join(' ')
    + ` Dos coches no caben en el mismo sitio: cambia uno de plaza o de fecha.</div>`;

  h+=`<div class="mes-nav">
    <button class="btn mini flecha" data-mes="-1" aria-label="Mes anterior">‹</button>
    <h2 class="mes-tit">${esc(nombreMes)}</h2>
    <button class="btn mini flecha" data-mes="1" aria-label="Mes siguiente">›</button>
    <button class="btn mini" data-mes="hoy" style="margin-left:auto">Hoy</button>
  </div>`;

  const INI=['lun','mar','mié','jue','vie','sáb','dom'];

  for(let w=0; w<semanas; w++){
    const l=sumar(ini,w*7), f=sumar(l,6);
    /* ocupacion de esa semana, solo con los dias que caen dentro del mes */
    let ocDias=0, cap=0;
    for(let i2=0;i2<7;i2++){
      const d=sumar(l,i2);
      if(d.getMonth()!==mes) continue;
      cap+=reservables().length;
      plazas().forEach(p=>{
        if(p.libre) return;
        if(D.trabajos.some(t=>t.plaza===p.id&&aFecha(t.entra)<=d&&salida(t)>=d)) ocDias++;
      });
    }
    const pct=cap?Math.round(100*ocDias/cap):0;
    const esta=hoy>=l&&hoy<=f;

    h+=`<section class="sem${esta?' esta':''}">
      <div class="sem-cab">
        <b>Semana ${w+1}</b>
        <span>${l.getDate()} ${l.toLocaleDateString('es-ES',{month:'short'})} – ${f.getDate()} ${f.toLocaleDateString('es-ES',{month:'short'})}</span>
        ${esta?'<em>esta semana</em>':''}
        <i>${pct}% ocupada</i>
      </div>
      <div class="rej">
        <div class="rej-fila rej-dias"><div class="rej-et"></div><div class="rej-pista">`;
    for(let i2=0;i2<7;i2++){
      const d=sumar(l,i2);
      const fuera=d.getMonth()!==mes;
      const es=d.getTime()===hoy.getTime();
      h+=`<div class="rej-cel${fuera?' fuera':''}${es?' hoy':''}">
            <span>${INI[i2]}</span><b>${d.getDate()}</b></div>`;
    }
    h+=`</div></div>`;

    plazas().forEach(p=>{
      h+=`<div class="rej-fila${p.libre?' fila-reserva':''}">
            <div class="rej-et"><b>${p.nom}</b><i>${p.uso.toUpperCase()}</i></div>`;
      h+=`<div class="rej-pista" data-plaza="${p.id}" data-lunes="${aIso(l)}">`;
      for(let i2=0;i2<7;i2++){
        const d=sumar(l,i2);
        h+=`<div class="rej-cel${d.getMonth()!==mes?' fuera':''}${d.getTime()===hoy.getTime()?' hoy':''}"></div>`;
      }
      if(p.libre && !D.trabajos.some(t=>t.plaza===p.id && salida(t)>=l && aFecha(t.entra)<=f)){
        h+=`<div class="res bloqueo" style="left:0;width:100%"><b>Libre para imprevistos · tócala para usarla</b></div>`;
      }
      D.trabajos.filter(t=>t.plaza===p.id).forEach(t=>{
        const e=aFecha(t.entra), sa=salida(t);
        if(sa<l||e>f) return;                       // no toca esta semana
        const d0=Math.max(0,diasEntre(l,e));
        const d1=Math.min(6,diasEntre(l,sa));
        const n=d1-d0+1; if(n<=0) return;
        const viene=e<l, sigue=sa>f;                // el trabajo cruza la semana
        const pd=t.presupuesto?Math.round(t.presupuesto/Math.max(1,t.dias)):0;
        h+=`<button class="res ${t.estado}${viene?' viene':''}${sigue?' sigue':''}${t.avisarCliente?' avisar':''}${p.libre?' enreserva':''}" data-t="${t.id}"
              style="left:${(d0/7*100).toFixed(4)}%;width:${(n/7*100).toFixed(4)}%"
              title="${esc(t.coche)} · ${esc(t.servicio)} · ${fCorta(e)} a ${fCorta(sa)}">
              ${viene?'':'<span class="tira izq" data-tira="izq"></span>'}
              ${sigue?'':'<span class="tira der" data-tira="der"></span>'}
              <b>${esc(t.coche)}</b>`
          /* Si la barra se ve recortada porque el trabajo sigue en otra
             semana, se declara la duración real ahí mismo: una barra de
             un cuadradito puede ser un trabajo de 9 días que continúa. */
          + (viene||sigue
              ? `<i>${viene?'‹ ':''}${t.dias} días${sigue?' ›':''}</i>`
              : (n>=4&&pd?`<i>${eur(pd)} €/día</i>`:'')) + `</button>`;
      });
      h+=`</div></div>`;
    });
    h+=`</div></section>`;
  }

  h+=`<div class="leyenda">
    <span><i class="pt" style="background:var(--oro-claro)"></i>En curso</span>
    <span><i class="pt" style="background:var(--oro-suave);border-color:var(--oro-claro)"></i>Reservado</span>
    <span><i class="pt" style="background:var(--espera)"></i>Esperando</span>
    <span><i class="pt" style="background:var(--alerta)"></i>Sin recoger</span>
    <span><i class="pt" style="background:repeating-linear-gradient(45deg,#F1F1ED 0 4px,#FAFAF8 4px 8px)"></i>Plaza libre para imprevistos</span>
  </div>
  <div class="aviso"><b>La plaza 5 no se reserva.</b> Queda libre para retrabajos,
  para el cliente que aparece sin cita y para el coche que tarda en recogerse.</div>`;
  return h;
}

/* ─── dinero ───────────────────────────────────────────────────────── */
function vistaDinero(){
  const as=anios();
  if(!as.includes(periodo.anio)) periodo.anio = as[0];
  anioSel = periodo.anio;                       // el resto de la vista lo usa

  /* Qué fechas entran en el periodo elegido. */
  const enPeriodo = d => d.getFullYear()===periodo.anio && (
      periodo.tipo==='anio' ? true
    : periodo.tipo==='tri'  ? Math.floor(d.getMonth()/3)+1===periodo.tri
    :                         d.getMonth()===periodo.mes);

  const etPer = periodo.tipo==='anio' ? String(periodo.anio)
    : periodo.tipo==='tri' ? `T${periodo.tri} · ${periodo.anio}`
    : `${MESES[periodo.mes]} ${periodo.anio}`;
  const f=porMes(anioSel), fAnt=porMes(anioSel-1);
  const conMov=f.filter(x=>x.ing||x.gas);
  const tI=f.reduce((a,x)=>a+x.ing,0), tG=f.reduce((a,x)=>a+x.gas,0);
  const tAnt=fAnt.reduce((a,x)=>a+x.ing,0);
  const varn=tAnt?Math.round(100*(tI-tAnt)/tAnt):null;
  /* Ojo: el coste fijo va por la marca fijo/variable, no por la categoría.
     Los ads son categoría Marketing pero se pagan todos los meses. */
  const gastosFijosAnio = D.gastos.filter(g=>aFecha(g.fecha).getFullYear()===anioSel && esGastoFijo(g));
  const mesesConFijos = new Set(gastosFijosAnio.map(g=>aFecha(g.fecha).getMonth())).size || 1;
  const fijoMes = gastosFijosAnio.reduce((a,g)=>a+(g.importe||0),0)/mesesConFijos;
  const tope=Math.max(1,...f.map(x=>Math.max(x.ing,x.gas)));

  let h=`<div class="selper">
    <div class="selper-fila">
      <span class="selper-et">Periodo</span>
      <div class="selper-tipo">
        ${[['mes','Mes'],['tri','Trimestre'],['anio','Año']].map(([k,n])=>
          `<button class="tipo-btn${periodo.tipo===k?' on':''}" data-pertipo="${k}">${n}</button>`).join('')}
      </div>
      <div class="selper-anio">
        ${as.map(a=>`<button class="anio-btn${a===periodo.anio?' on':''}" data-anio="${a}">${a}</button>`).join('')}
      </div>
    </div>
    ${periodo.tipo==='mes'?`<div class="selper-detalle">
      ${MESES.map((m,i)=>`<button class="tri-btn${i===periodo.mes?' on':''}" data-permes="${i}">${m}</button>`).join('')}
    </div>`:''}
    ${periodo.tipo==='tri'?`<div class="selper-detalle">
      ${[1,2,3,4].map(t=>`<button class="tri-btn${t===periodo.tri?' on':''}" data-pertri="${t}">
        T${t} <em>${['ene–mar','abr–jun','jul–sep','oct–dic'][t-1]}</em></button>`).join('')}
    </div>`:''}
  </div>`;

  /* Los indicadores hablan del periodo elegido, no del año entero. */
  const pIng = D.cobros.filter(c=>enPeriodo(aFecha(c.fecha))).reduce((a,c)=>a+(c.importe||0),0);
  const gPer = D.gastos.filter(g=>enPeriodo(aFecha(g.fecha)));
  const pGas = gPer.reduce((a,g)=>a+(g.importe||0),0);
  const pFij = gPer.filter(esGastoFijo).reduce((a,g)=>a+(g.importe||0),0);
  const pVar = pGas - pFij;

  h+=`<div class="kpis">
    <div class="kpi destaca"><span class="et">Ingresos · ${esc(etPer)}</span>
      <div class="n">${eur(pIng)}<small>€</small></div>
      <div class="sub">todo lo cobrado</div></div>
    <div class="kpi"><span class="et">Gastos</span>
      <div class="n">${eur(pGas)}<small>€</small></div>
      <div class="sub">del negocio, sin impuestos</div></div>
    <div class="kpi"><span class="et">Diferencia</span>
      <div class="n"${pIng-pGas<0?' style="color:var(--alerta)"':''}>${eur(pIng-pGas)}<small>€</small></div>
      <div class="sub">antes de impuestos</div></div>
    <div class="kpi"><span class="et">Gastos fijos</span>
      <div class="n">${eur(pFij)}<small>€</small></div>
      <div class="sub">${pGas?Math.round(100*pFij/pGas):0} % de lo que sale</div></div></div>`;

  h+=`<div class="cab"><h2>Mes a mes</h2><span class="nota">oro = ingresos · gris = gastos</span></div>
  <div class="barras">`
    + f.map(x=>`<div class="mes${x.gas>x.ing?' neg':''}" title="${x.mes}: +${eur(x.ing)} € / −${eur(x.gas)} €">
        <div class="par"><div class="bar i" style="height:${100*x.ing/tope}%"></div>
        <div class="bar g" style="height:${100*x.gas/tope}%"></div></div>
        <span class="mes-et">${x.mes}</span></div>`).join('')
    + `</div>`;

  const peor=conMov.reduce((a,b)=>(b.ing-b.gas)<(a.ing-a.gas)?b:a, conMov[0]||{mes:'',ing:0,gas:0});
  h+=`<div class="cab" style="margin-bottom:26px"><span class="nota">`
    + (peor.gas>peor.ing?`${peor.mes} cerró en negativo: ${eur(peor.gas-peor.ing)} € por debajo.`:'')
    + `</span></div>`;

  const cat={};
  f.forEach(x=>Object.entries(x.cat).forEach(([k,v])=>cat[k]=(cat[k]||0)+v));
  const cats=Object.entries(cat).sort((a,b)=>b[1]-a[1]);
  /* ── a dónde va el dinero ──────────────────────────────────────────
     Dos ruedas con el mismo reparto: el año entero y un mes suelto.
     Los gastos fijos y los variables van cada uno de un color, sin
     desglosar: lo que importa aquí es cuánto queda limpio.          */
  const COLORES = {
    fijos:     '#8F6A2A',
    variables: '#C9A24E',
    iva:       '#3C6D94',
    irpf:      '#5E8C61',
    reten:     '#8B6B8F',
    libre:     '#14141A'
  };
  const partesDe = r => [
    {n:'Gastos fijos',     v:r.fijos,     c:COLORES.fijos},
    {n:'Gastos variables', v:r.variables, c:COLORES.variables},
    {n:'IVA',              v:Math.max(0,r.ivaPagar), c:COLORES.iva},
    {n:'IRPF',             v:r.irpf,      c:COLORES.irpf},
    {n:'Retenciones',      v:r.retenciones, c:COLORES.reten},
    {n:'Queda limpio',     v:r.libre,     c:COLORES.libre},
  ].filter(p=>p.n!=='Retenciones' || p.v>0);
  const leyenda = r => {
    const tot = r.entra || 1;
    return `<ul class="leyenda-r">` + partesDe(r).map(p=>`<li>
        <i style="background:${p.c}"></i>
        <span>${p.n}</span>
        <b${p.v<0?' class="neg"':''}>${eur(p.v)} €</b>
        <em>${Math.round(100*Math.max(0,p.v)/tot)} %</em>
      </li>`).join('') + `</ul>`;
  };

  /* Rueda izquierda: el año entero o un trimestre suelto. Así se puede
     mirar el mismo periodo que se liquida en Impuestos. */
  const rAnio = reparto(enPeriodo);
  const etPeriodo = etPer;

  // La rueda derecha muestra el año completo: sirve de referencia para
  // saber si el periodo elegido va mejor o peor de lo habitual.
  const rAno = reparto(d => d.getFullYear()===periodo.anio);

  h+=`<div class="cab" style="margin-top:34px"><h2>A dónde va el dinero</h2>
    <span class="nota">sobre todo lo que entró, facturado y en efectivo</span></div>

  <div class="ruedas">
    <section class="rbloque">
      <div class="rbloque-cab">
        <span class="rb-nav"></span>
        <b>${etPeriodo}</b>
        <span class="rb-nav"></span>
      </div>
      <div class="rbloque-sub">${eur(rAnio.entra)} € entraron</div>
      ${rueda(partesDe(rAnio), eur(rAnio.libre)+' €', 'queda limpio')}
      ${leyenda(rAnio)}
    </section>

    <section class="rbloque">
      <div class="rbloque-cab">
        <span class="rb-nav"></span>
        <b>Todo ${periodo.anio}</b>
        <span class="rb-nav"></span>
      </div>
      <div class="rbloque-sub">${eur(rAno.entra)} € entraron</div>
      <div class="rbloque-nota">para comparar con el periodo</div>
      ${rueda(partesDe(rAno), eur(rAno.libre)+' €', 'queda limpio')}
      ${leyenda(rAno)}
    </section>
  </div>

  <div class="aviso"><b>El IVA y el IRPF del mes son una estimación.</b>
    Se liquidan por trimestres, no por meses: el reparto mensual sirve para
    ver la tendencia, y el importe exacto está en la pestaña Impuestos.</div>`;

  h+=`<div class="cab" style="margin-top:30px"><h2>Detalle por categoría</h2></div>`;

  /* ── gastos, separados en fijos y variables y agrupados por mes ─────
     Fijo es lo que se repite todos los meses; variable, lo que cambia.
     Agrupar por mes es lo que permite comparar y detectar el mes raro. */
  const gAnio = D.gastos.filter(g=>enPeriodo(aFecha(g.fecha)));

  /* Agrupa por mes cualquier lista de movimientos. Las filas se pintan
     siempre y se ocultan por CSS: así el buscador puede encontrar algo
     dentro de un mes plegado y abrirlo solo. */
  function bloqueMovs({lista, titulo, id, acciones, fila, vacio}){
    const total = lista.reduce((a,x)=>a+(x.importe||0),0);
    const meses = {};
    lista.forEach(x=>{ const m=aFecha(x.fecha).getMonth(); (meses[m]=meses[m]||[]).push(x); });
    // Orden natural del calendario: el mes que viene aparece debajo.
    const orden = Object.keys(meses).map(Number).sort((a,b)=>a-b);

    let out = `<div class="cab" style="margin-top:30px"><h2>${titulo}</h2>
      <span class="nota">${lista.length} movimiento${lista.length===1?'':'s'} · ${eur(total)} € en ${anioSel}</span></div>
      <div class="anio">${acciones}</div>`;

    if(!orden.length) return out + `<div class="vacio" style="border:1px solid var(--linea)">${vacio}</div>`;

    out += `<div id="tb-${id}">`;
    orden.forEach((m,i)=>{
      const xs = meses[m].sort((a,b)=>a.fecha<b.fecha?-1:1);
      const sub = xs.reduce((a,x)=>a+(x.importe||0),0);
      const clave = id+'-'+m;
      // Cerrados de entrada: con tres listas, abrir el último mes de cada
      // una llenaba la pantalla antes de que nadie pidiera nada.
      const abierto = mesesAbiertos.has(clave);
      out += `<section class="grupo${abierto?' abierto':''}">
        <button class="grupo-cab" data-mes-toggle="${clave}">
          <i>${abierto?'−':'+'}</i><b>${MESES[m]}</b>
          <span>${xs.length} movimiento${xs.length===1?'':'s'}</span>
          <em>${eur(sub)} €</em>
        </button>
        <table class="tabla"><tbody>${xs.map(fila).join('')}</tbody></table>
      </section>`;
    });
    return out + `</div>`;
  }

  /* ── listas en pestañas ────────────────────────────────────────────
     Ingresos, variables y fijos comparten sitio: se ve una por vez y
     Wallet deja de ser una tirada interminable.                       */
  const ingA = D.cobros.filter(c=>enPeriodo(aFecha(c.fecha)));
  const varA = gAnio.filter(g=>!esGastoFijo(g));
  const fijA = gAnio.filter(esGastoFijo);
  const suma = l => l.reduce((a,x)=>a+(x.importe||0),0);

  const LISTAS = [
    {id:'ing', n:'Ingresos',         total:suma(ingA)},
    {id:'var', n:'Gastos variables', total:suma(varA)},
    {id:'fij', n:'Gastos fijos',     total:suma(fijA)},
  ];
  if(!LISTAS.some(p=>p.id===listaSel)) listaSel='ing';

  h += `<div class="cab" style="margin-top:34px"><h2>Movimientos · ${esc(etPer)}</h2></div>
    <nav class="subtabs">` + LISTAS.map(p=>`
      <button class="subtab${p.id===listaSel?' on':''}" data-lista="${p.id}">
        <b>${p.n}</b><em>${eur(p.total)} €</em></button>`).join('') + `</nav>`;

  const filaGasto = g=>`<tr data-g="${g.id}" data-q="${esc((g.concepto||'').toLowerCase())}" style="cursor:pointer">
      <td>${esc(g.concepto)}</td>
      <td><span class="pill">${g.categoria||'otro'}</span>${(()=>{
        const t=tipoDe(g);
        if(g.tipo==='sinfactura') return ' <span class="pill sinf">sin factura</span>';
        if(g.tipo==='prestamo')   return ' <span class="pill sinf">no desgrava</span>';
        if(t.ret)                 return ` <span class="pill">retención ${t.ret} %</span>`;
        if(!g.tipo && g.conFactura===false) return ' <span class="pill sinf">sin factura</span>';
        return '';
      })()}</td>
      <td class="num" style="color:var(--dim)">${fCorta(aFecha(g.fecha))}</td>
      <td class="num">${eur(g.importe)} €</td></tr>`;

  if(listaSel==='ing'){
    h += bloqueMovs({
      lista: ingA, titulo:'Ingresos', id:'ing',
      vacio:`Sin ingresos en este periodo.`,
      acciones:`<button class="btn mini" data-acc="ingreso">+ Ingreso</button>
        <input class="buscar" id="q-ing" placeholder="Buscar por concepto…" autocomplete="off">`,
      fila: c=>`<tr data-i="${c.id}" data-q="${esc((c.concepto||'').toLowerCase())}" style="cursor:pointer">
        <td>${esc(c.concepto)}${c.trabajoId?' <span class="pill">de un trabajo</span>':''}</td>
        <td><span class="pill">${esc(c.via)}</span>${
          esFacturado(c)?'':' <span class="pill sinf">sin factura</span>'}</td>
        <td class="num" style="color:var(--dim)">${fCorta(aFecha(c.fecha))}</td>
        <td class="num pos">${eur(c.importe)} €</td></tr>`});
  }

  if(listaSel==='var'){
    h += bloqueMovs({
      lista: varA, titulo:'Gastos variables', id:'var', fila:filaGasto,
      vacio:`Sin gastos variables en este periodo.`,
      acciones:`<button class="btn mini" data-acc="gasto">+ Gasto</button>
        <input class="buscar" id="q-gas" placeholder="Buscar por concepto…" autocomplete="off">`});
  }

  if(listaSel==='fij'){
    h += bloqueMovs({
      lista: fijA, titulo:'Gastos fijos', id:'fij', fila:filaGasto,
      vacio:`Sin gastos fijos en este periodo.`,
      acciones:`<button class="btn mini" data-acc="fijo">+ Plantilla</button>
        <button class="btn mini" data-acc="generar">Generar los de este mes</button>
        ${D.fijos.length?`<button class="btn mini" data-acc="verplantillas">${
          plantillasAbiertas ? 'Ocultar plantillas'
                             : `Ver plantillas (${D.fijos.length})`}</button>`:''}`});

    if(D.fijos.length && plantillasAbiertas){
      const totalPl = D.fijos.reduce((a,f)=>a+(f.importe||0),0);
      h += `<section class="plantillas">
        <div class="plantillas-cab"><b>Plantillas</b>
          <span>lo que se crea cada mes al pulsar «Generar»</span>
          <em>${eur(totalPl)} €/mes</em></div>
        <table class="tabla"><tbody>`
        + [...D.fijos].sort((a,b)=>(b.importe||0)-(a.importe||0))
          .map(f=>`<tr data-f="${f.id}" style="cursor:pointer">
            <td>${esc(f.concepto)}</td>
            <td class="num" style="color:var(--dim)">día ${f.dia||1}</td>
            <td class="num">${eur(f.importe)} €</td></tr>`).join('')
        + `</tbody></table></section>`;
    }
  }

  return h;
}

/* ═══════════════════════════════════════════════════════════════════════
   PRESUPUESTOS

   Un presupuesto no es una factura: no tiene valor fiscal, no entra en el
   IVA y no necesita numeración correlativa sin huecos. Por eso vive en su
   propia colección y se puede borrar sin romper nada.

   Se limpian solos a los 15 días —así la base no se llena de propuestas
   que nunca cuajaron—, salvo los marcados como aceptados: esos se guardan
   hasta que se pasen a factura. Perder un presupuesto aceptado sí sería
   un problema, y por eso son la excepción.
   ═══════════════════════════════════════════════════════════════════════ */

const presupuestos = () => D.presupuestos || [];
const DIAS_VIDA_PRESU = 15;

/* El número no se recicla aunque se borren los viejos: se guarda el último
   usado en la configuración. Si no, al vaciarse la lista volvería al 1 y
   dos clientes distintos tendrían el mismo número. */
const proximoPresu = () => Math.max(
  fiscal().ultimoPresu || 0,
  ...presupuestos().map(p => +p.numero || 0), 0) + 1;

function totalesPresu(p){
  const base = (p.lineas||[]).reduce((a,l)=>a+(l.cantidad||1)*(l.precio||0), 0);
  const dto  = base * (p.descuento||0)/100;
  const sub  = base - dto;
  const tipo = p.intraUE ? 0 : (p.iva != null ? p.iva : fiscal().iva);
  const iva  = sub * tipo/100;
  return {base, dto, sub, tipo, iva, total: sub + iva};
}

const caducaEl = p => aIso(sumar(aFecha(p.fecha), +p.validez || DIAS_VIDA_PRESU));
const diasParaCaducar = p => diasEntre(hoy, aFecha(caducaEl(p)));
const estadoPresu = p => p.estado || 'abierto';

/* Limpieza automática. Se ejecuta al arrancar, una vez.
   Solo toca los que ya caducaron hace más de DIAS_VIDA_PRESU días y que
   nadie marcó como aceptados. */
async function limpiarPresupuestos(){
  const viejos = presupuestos().filter(p =>
    estadoPresu(p) !== 'aceptado' &&
    diasEntre(aFecha(p.fecha), hoy) > DIAS_VIDA_PRESU);
  if(!viejos.length) return 0;
  for(const p of viejos){
    try{ if(p.id) await borrarDoc('presupuestos', p.id); }catch(e){ console.warn('no se pudo borrar', e); }
  }
  D.presupuestos = presupuestos().filter(p=>!viejos.includes(p));
  return viejos.length;
}

/* ─── listado ──────────────────────────────────────────────────────── */
function vistaPresupuestos(){
  const ps = presupuestos().slice().sort((a,b)=>(+b.numero||0)-(+a.numero||0));

  const abiertos  = ps.filter(p=>estadoPresu(p)==='abierto' && diasParaCaducar(p) >= 0);
  const aceptados = ps.filter(p=>estadoPresu(p)==='aceptado');
  const enPie     = abiertos.reduce((a,p)=>a+totalesPresu(p).total, 0);
  const ganado    = aceptados.reduce((a,p)=>a+totalesPresu(p).total, 0);
  const cerrados  = ps.filter(p=>estadoPresu(p)!=='abierto').length;
  const tasa      = cerrados ? Math.round(aceptados.length/cerrados*100) : null;

  let h = `<div class="kpis">
      <div class="kpi destaca"><span class="et">En la calle</span>
        <div class="n">${eur(enPie)}<small>€</small></div>
        <div class="sub">${abiertos.length} presupuesto${abiertos.length===1?'':'s'} sin respuesta</div></div>
      <div class="kpi"><span class="et">Aceptados</span>
        <div class="n">${eur(ganado)}<small>€</small></div>
        <div class="sub">${aceptados.length} esperando pasar a factura</div></div>
      <div class="kpi"><span class="et">Se cierran</span>
        <div class="n">${tasa===null?'—':tasa+'%'}</div>
        <div class="sub">${tasa===null?'aún sin datos':'de los que ya se resolvieron'}</div></div>
      <div class="kpi"><span class="et">Siguiente número</span>
        <div class="n">${proximoPresu()}</div>
        <div class="sub">no se reutilizan</div></div>
    </div>

    <div class="cab"><h2>Presupuestos</h2>
      <span class="nota">toca uno para verlo, descargarlo o pasarlo a factura</span></div>
    <div class="anio">
      <button class="btn mini pri" data-acc="presupuesto">+ Nuevo presupuesto</button>
      <input class="buscar" id="q-pre" placeholder="Buscar por cliente, vehículo o número…" autocomplete="off">
    </div>
    <p class="pre-avisovida">Los presupuestos se borran solos a los ${DIAS_VIDA_PRESU} días.
      Los que marques como <b>aceptados</b> se quedan hasta que los pases a factura.</p>`;

  if(!ps.length) return h + `<div class="vacio" style="border:1px solid var(--linea)">
    Todavía no hay ninguno. El primero saldrá con el número ${proximoPresu()}.</div>`;

  h += `<table class="tabla" id="tb-pre"><thead><tr>
      <th>Nº</th><th>Fecha</th><th>Cliente</th><th>Vehículo</th><th>Estado</th>
      <th style="text-align:right">Total</th>
    </tr></thead><tbody>`
    + ps.map(p=>{
        const t = totalesPresu(p);
        const e = estadoPresu(p);
        const d = diasParaCaducar(p);
        const q = [p.numero,p.cliente,p.vehiculo].filter(Boolean).join(' ').toLowerCase();
        const pill = e==='aceptado'  ? '<span class="pill ok">aceptado</span>'
                   : e==='rechazado' ? '<span class="pill sinf">rechazado</span>'
                   : d < 0           ? '<span class="pill sinf">caducado</span>'
                   : d <= 3          ? `<span class="pill avisa">caduca en ${d} d</span>`
                   :                   `<span class="pill">vale ${d} d más</span>`;
        return `<tr data-pre="${p.id}" data-q="${esc(q)}" style="cursor:pointer"
            class="${e==='rechazado'||(e==='abierto'&&d<0)?'pre-apagado':''}">
          <td><b>${esc(p.numero)}</b></td>
          <td class="num" style="color:var(--dim)">${fCorta(aFecha(p.fecha))}</td>
          <td>${esc(p.cliente||'—')}</td>
          <td style="color:var(--dim)">${esc(p.vehiculo||'—')}</td>
          <td>${pill}</td>
          <td class="num"><b>${eur(t.total)} €</b></td></tr>`;
      }).join('')
    + `</tbody></table>`;

  return h;
}

/* ─── editor ───────────────────────────────────────────────────────── */
