      <div class="campo"><label for="p-val">Validez</label>
        <select id="p-val">
          ${[7,15,30,60].map(d=>`<option value="${d}"${(+p.validez||DIAS_VIDA_PRESU)===d?' selected':''}>${d} días</option>`).join('')}
        </select></div></div>

    <div class="campo"><label for="p-cli">Cliente</label>
      <input id="p-cli" list="lista-pcli" value="${esc(p.cliente)}" placeholder="Nombre o empresa" autocomplete="off">
      <datalist id="lista-pcli">${nombres.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
    <div class="fila2">
      <div class="campo"><label for="p-tel">Teléfono</label>
        <input id="p-tel" value="${esc(p.clienteTel)}" placeholder="+34 …" autocomplete="off"></div>
      <div class="campo"><label for="p-nif">NIF / CIF</label>
        <input id="p-nif" value="${esc(p.clienteNif)}" placeholder="opcional" autocomplete="off"></div></div>
    <div class="fila2">
      <div class="campo"><label for="p-ciu">Ciudad</label>
        <input id="p-ciu" value="${esc(p.clienteCiudad)}" placeholder="Marbella, Málaga" autocomplete="off"></div>
      <div class="campo"><label for="p-ue">IVA</label>
        <select id="p-ue">
          <option value="0"${!p.intraUE?' selected':''}>${fiscal().iva} % normal</option>
          <option value="1"${p.intraUE?' selected':''}>0 % · empresa UE</option>
        </select></div></div>

    <div class="fila3">
      <div class="campo"><label for="p-veh">Vehículo</label>
        <input id="p-veh" list="lista-pveh" value="${esc(p.vehiculo)}" placeholder="Ferrari Purosangue" autocomplete="off">
        <datalist id="lista-pveh">${coches.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
      <div class="campo"><label for="p-mat">Matrícula</label>
        <input id="p-mat" value="${esc(p.matricula)}" placeholder="opcional" autocomplete="off"></div>
      <div class="campo"><label for="p-col">Color</label>
        <input id="p-col" value="${esc(p.color)}" placeholder="opcional" autocomplete="off"></div></div>

    <div class="cobros" id="p-lineas"></div>
    <datalist id="lista-serv">${servis.map(s=>`<option value="${esc(s.n)}">`).join('')}</datalist>

    <div class="fila2">
      <div class="campo"><label for="p-dto">Descuento (%)</label>

      <textarea id="p-not" rows="2" placeholder="Se aplica sobre pintura en buen estado. Si hace falta corrección previa se valora aparte.">${esc(p.notas)}</textarea></div>
    <div class="campo"><label for="p-con">Condiciones de pago</label>
      <input id="p-con" value="${esc(p.condiciones)}" placeholder="50 % al confirmar y el resto a la entrega" autocomplete="off"></div>

      <button class="btn" type="button" data-cerrar>Cancelar</button>

  $('#hoja').classList.add('on');

  $('#p-cli').addEventListener('change',()=>{

    const c = D.clientes.find(x=>normNom(x.nombre)===n);
    if(!c) return;
    if(c.telefono && !$('#p-tel').value) $('#p-tel').value = c.telefono;
    if(c.nif && !$('#p-nif').value) $('#p-nif').value = c.nif;
    if(c.ciudad && !$('#p-ciu').value) $('#p-ciu').value = c.ciudad;
    if(c.intraUE) $('#p-ue').value = '1';
  });

  function pintarLineasP(){
    const cont=$('#p-lineas'); if(!cont) return;
    cont.innerHTML = `<label style="font-family:var(--mono);font-size:10px;letter-spacing:.09em;
        text-transform:uppercase;color:var(--dim)">Conceptos</label>`
      + lineasP.map((l,i)=>`<div class="lin-fac">
          <input class="p-desc" data-i="${i}" list="lista-serv" value="${esc(l.desc)}" placeholder="PPF Full Front" autocomplete="off">
          <input class="p-cant" data-i="${i}" type="number" min="1" value="${l.cantidad||1}" inputmode="numeric">
          <input class="p-prec" data-i="${i}" type="number" step="0.01" value="${l.precio||''}" placeholder="Precio" inputmode="decimal">
          <button class="x" data-qp="${i}" aria-label="Quitar concepto">×</button>
        </div>`).join('')
      + `<button class="btn mini" id="p-add" type="button" style="margin-top:8px">+ Concepto</button>
         <div class="desglose" id="p-desg" style="margin-top:12px"></div>`;

    /* Al escribir un servicio del catálogo se rellena su precio, pero solo
       si la línea está a cero: si ya hay un importe puesto a mano, manda ese. */
    cont.querySelectorAll('.p-desc').forEach(el=>{
      el.addEventListener('input',e=>{ lineasP[+e.target.dataset.i].desc = e.target.value; });
      el.addEventListener('change',e=>{
        const i=+e.target.dataset.i;
        const s=(D.servicios||[]).find(x=>x.n===e.target.value);
        if(s && s.p && !lineasP[i].precio){
          lineasP[i].precio = s.p;
          const c=cont.querySelector(`.p-prec[data-i="${i}"]`); if(c) c.value = s.p;
          totalesEnVivo();
        }
      });
    });
    cont.querySelectorAll('.p-cant').forEach(el=>el.addEventListener('input',e=>{
      lineasP[+e.target.dataset.i].cantidad = Math.max(1, +e.target.value||1); totalesEnVivo(); }));
    cont.querySelectorAll('.p-prec').forEach(el=>el.addEventListener('input',e=>{
      lineasP[+e.target.dataset.i].precio = numero(e.target.value); totalesEnVivo(); }));
    cont.querySelectorAll('[data-qp]').forEach(b=>b.addEventListener('click',()=>{
      lineasP.splice(+b.dataset.qp,1);
      if(!lineasP.length) lineasP.push({desc:'',cantidad:1,precio:0});
      pintarLineasP(); }));
    $('#p-add').addEventListener('click',()=>{
      lineasP.push({desc:'',cantidad:1,precio:0}); pintarLineasP(); });
    totalesEnVivo();
  }

  /* Solo se refresca el resumen, no la lista entera: si se repinta todo
     mientras se escribe, el cursor salta al principio del campo. */
  function totalesEnVivo(){
    const d = $('#p-desg'); if(!d) return;
    const base = lineasP.reduce((a,l)=>a+(l.cantidad||1)*(l.precio||0),0);
    const pc   = Math.max(0, Math.min(90, +($('#p-dto')||{}).value || 0));
    const dto  = base*pc/100, sub = base-dto;
    const tipo = $('#p-ue').value==='1' ? 0 : fiscal().iva;
    d.innerHTML = `<span>Base <b>${eur(base)} €</b></span>`
      + (pc?`<span>Dto. ${pc} % <b>−${eur(dto)} €</b></span>`:'')
      + `<span>IVA ${tipo} % <b>${eur(sub*tipo/100)} €</b></span>
         <span class="tot">Total <b>${eur(sub*(1+tipo/100))} €</b></span>`;
  }
  pintarLineasP();
  $('#p-ue').addEventListener('change',totalesEnVivo);
  $('#p-dto').addEventListener('input',totalesEnVivo);

  $('#p-ok').addEventListener('click',()=>{
    const num = +$('#p-num').value || proximoPresu();
    const d = {
      numero: num, fecha: $('#p-fec').value || aIso(hoy),
      validez: +$('#p-val').value || DIAS_VIDA_PRESU,
      cliente: $('#p-cli').value.trim(), clienteNif: $('#p-nif').value.trim(),
      clienteTel: $('#p-tel').value.trim(), clienteCiudad: $('#p-ciu').value.trim(),
      clienteDir: p.clienteDir || '', clienteCp: p.clienteCp || '',
      intraUE: $('#p-ue').value==='1',
      vehiculo: $('#p-veh').value.trim(), matricula: $('#p-mat').value.trim(),
      color: $('#p-col').value.trim(),
      descuento: Math.max(0, Math.min(90, +$('#p-dto').value||0)),
      estado: $('#p-est').value,
      notas: $('#p-not').value.trim(), condiciones: $('#p-con').value.trim(),
      lineas: lineasP.filter(l=>(l.desc||'').trim() || l.precio)
    };
    if(!d.lineas.length){ alert('Añade al menos un concepto.'); return; }
    let destino;
    if(editP){ Object.assign(editP, d); destino = editP; }
    else { destino = Object.assign({id:nid()}, d); D.presupuestos.push(destino); }
    /* Se recuerda el número más alto usado para que no se repita cuando la
       limpieza automática se lleve los viejos. */
    if(num > (fiscal().ultimoPresu||0)) D.fiscal = {...fiscal(), ultimoPresu:num};
    cerrar(); guardar(); pintar();
    verPresupuesto(destino.id);
  });
}

/* ─── vista previa, impresión y PDF ────────────────────────────────── */
function verPresupuesto(id){
  const p = presupuestos().find(x=>x.id===id); if(!p) return;
  const e = estadoPresu(p);
  const d = diasParaCaducar(p);

  $('#hojaC').innerHTML = `<div class="fac-acciones">
      <button class="btn mini" data-cerrar>Cerrar</button>
      <button class="btn mini" id="pre-edit">Editar</button>
      ${e!=='aceptado'?`<button class="btn mini" id="pre-ok">Marcar aceptado</button>`:''}
      ${e==='aceptado'?`<button class="btn mini" id="pre-fac">Pasar a factura</button>`:''}
      <button class="btn mini borrar" id="pre-del">Eliminar</button>
      <button class="btn mini" id="pre-pdf">Descargar PDF</button>
      <button class="btn pri mini" id="pre-imp">Imprimir</button>
    </div>
    ${e==='aceptado'?`<div class="fac-aviso">Aceptado. No se borrará solo: pásalo a factura cuando toque.</div>`:''}
    ${e==='rechazado'?`<div class="fac-aviso">Marcado como rechazado.</div>`:''}
    ${e==='abierto'&&d<0?`<div class="fac-aviso">Caducó hace ${-d} día${-d===1?'':'s'}. Se borrará solo.</div>`:''}
    <div class="fac-prev">${htmlPresupuesto(p)}</div>`;
  $('#hoja').classList.add('on');
  $('#hojaC').classList.add('ancho');

  $('#pre-edit').addEventListener('click',()=>{ cerrarFac(); abrirPresupuesto(id); });
  const ok=$('#pre-ok'); if(ok) ok.addEventListener('click',()=>{
    p.estado='aceptado'; guardar(); pintar(); verPresupuesto(id);
  });
  const afac=$('#pre-fac'); if(afac) afac.addEventListener('click',()=>presupuestoAFactura(id));
  $('#pre-del').addEventListener('click',()=>{
    if(!confirm(`¿Eliminar el presupuesto ${p.numero}?`)) return;
    if(p.id) borrarDoc('presupuestos', p.id);
    D.presupuestos = presupuestos().filter(x=>x.id!==p.id);
    cerrarFac(); guardar(); pintar();
  });
  $('#pre-imp').addEventListener('click',()=>imprimirPresupuesto(p, false));
  $('#pre-pdf').addEventListener('click',()=>imprimirPresupuesto(p, true));
}

/* Un presupuesto aceptado ya trae todo lo que necesita una factura, así
   que se abre el formulario con los datos puestos. Se revisa y se emite:
   nadie vuelve a teclear los conceptos. El descuento se aplica sobre cada
   línea para que el total facturado coincida con el que aceptó el cliente. */
function presupuestoAFactura(id){
  const p = presupuestos().find(x=>x.id===id); if(!p) return;
  if(!confirm(`Se abrirá una factura nueva con los datos del presupuesto ${p.numero}.\n\n`
    + `El presupuesto se queda como está: bórralo cuando la factura esté emitida.`)) return;
  const f = 1 - (p.descuento||0)/100;
  cerrarFac();
  abrirFactura(null, {
    cliente:p.cliente, clienteNif:p.clienteNif, clienteDir:p.clienteDir,
    clienteCiudad:p.clienteCiudad, clienteCp:p.clienteCp, intraUE:p.intraUE,
    vehiculo:p.vehiculo, matricula:p.matricula, condiciones:p.condiciones,
    lineas:(p.lineas||[]).map(l=>({...l, precio: Math.round((l.precio||0)*f*100)/100}))
  });
}

function imprimirPresupuesto(p, comoPdf){
  const css = [...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  const w = window.open('', '_blank');
  if(!w){ alert('El navegador ha bloqueado la ventana. Permite las ventanas emergentes para poder imprimir.'); return; }
  w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
    <title>Presupuesto ${esc(p.numero)} · ${esc(p.cliente||'')}</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>${css}
      body{background:#fff;padding:0;margin:0}
      .fac{margin:0 auto}
      @page{size:A4;margin:14mm}
    </style></head><body>${htmlPresupuesto(p)}</body></html>`);
  w.document.close();
  const lanzar = () => { w.focus(); w.print(); };
  if(w.document.fonts && w.document.fonts.ready) w.document.fonts.ready.then(()=>setTimeout(lanzar,120));
  else setTimeout(lanzar, 600);
}

/* El mismo marcado sirve para la vista previa, para imprimir y para el
   PDF: lo que se ve en pantalla es exactamente lo que sale en papel. */

  const ls = (p.lineas||[]).filter(l=>(l.desc||'').trim() || l.precio);
  const vacias = Math.max(0, 4 - ls.length);
  const veh = [p.vehiculo, p.color].filter(Boolean).join(' · ');

  return `<article class="fac pres">
    <header class="fac-top">
      <div class="fac-marca">

/* ─── vista de facturación ─────────────────────────────────────────── */
function vistaFacturas(){
  const as = [...new Set(facturas().map(f=>aFecha(f.fecha).getFullYear()))].sort((a,b)=>b-a);
  if(!as.length) as.push(hoy.getFullYear());
  if(anioSel===null || !as.includes(anioSel)) anioSel = as[0];

  const delAnio = facturas().filter(f=>aFecha(f.fecha).getFullYear()===anioSel)
                            .sort((a,b)=>(+b.numero||0)-(+a.numero||0));
  const base = delAnio.reduce((a,f)=>a+totalesFactura(f).base, 0);
  const iva  = delAnio.reduce((a,f)=>a+totalesFactura(f).iva, 0);

  let h = `<div class="selanio">
      <span class="selanio-et">Año</span>
      ${as.map(a=>`<button class="anio-btn${a===anioSel?' on':''}" data-anio="${a}">${a}</button>`).join('')}
    </div>

    <div class="kpis">
      <div class="kpi destaca"><span class="et">Facturado ${anioSel}</span>
        <div class="n">${eur(base)}<small>€</small></div>
        <div class="sub">base, sin IVA</div></div>
      <div class="kpi"><span class="et">IVA repercutido</span>
        <div class="n">${eur(iva)}<small>€</small></div>
        <div class="sub">a ingresar a Hacienda</div></div>
      <div class="kpi"><span class="et">Facturas</span>
        <div class="n">${delAnio.length}</div>
        <div class="sub">emitidas en ${anioSel}</div></div>
      <div class="kpi"><span class="et">Siguiente número</span>
        <div class="n">${proximoNumero()}</div>
        <div class="sub">correlativo, sin huecos</div></div>
    </div>

    <div class="cab"><h2>Facturas emitidas</h2>
      <span class="nota">toca una para verla, imprimirla o editarla</span></div>
    <div class="anio">
      <button class="btn mini pri" data-acc="factura">+ Nueva factura</button>
      <input class="buscar" id="q-fac" placeholder="Buscar por cliente, vehículo o número…" autocomplete="off">
    </div>`;

  if(!delAnio.length) return h + `<div class="vacio" style="border:1px solid var(--linea)">
    Todavía no hay facturas en ${anioSel}. La primera saldrá con el número ${proximoNumero()}.</div>`;

  h += `<table class="tabla" id="tb-fac"><thead><tr>
      <th>Nº</th><th>Fecha</th><th>Cliente</th><th>Vehículo</th>
      <th style="text-align:right">Base</th>
      <th style="text-align:right">IVA</th>
      <th style="text-align:right">Total</th>
    </tr></thead><tbody>`
    + delAnio.map(f=>{
        const t=totalesFactura(f);
        const q=[f.numero,f.cliente,f.vehiculo].filter(Boolean).join(' ').toLowerCase();
        const anul = facturas().find(x=>+x.rectificaA===+f.numero);
        return `<tr data-fac="${f.id}" data-q="${esc(q)}" style="cursor:pointer"
          class="${anul?'fac-anulada':''}">
          <td><b>${esc(f.numero)}</b>${
            f.rectificaA?` <span class="pill">abono de ${esc(f.rectificaA)}</span>`:''}${
            anul?` <span class="pill sinf">anulada</span>`:''}</td>
          <td class="num" style="color:var(--dim)">${fCorta(aFecha(f.fecha))}</td>
          <td>${esc(f.cliente||'—')}</td>
          <td style="color:var(--dim)">${esc(f.vehiculo||'—')}</td>
          <td class="num">${eur(t.base)} €</td>
          <td class="num" style="color:var(--dim)">${t.tipo?`${eur(t.iva)} €`:'exenta'}</td>
          <td class="num"><b>${eur(t.total)} €</b></td></tr>`;
      }).join('')
    + `</tbody></table>`;

  return h;
}

let editF2=null, lineasF=[];

function abrirFactura(id, base){
  editF2 = id ? facturas().find(f=>f.id===id) : null;
  /* `base` permite abrir la factura con datos ya puestos. Lo usa el paso
     desde un presupuesto aceptado: mismos conceptos, sin volver a teclear. */

  $('#hojaC').innerHTML = `<h3>${editF2?'Editar factura':'Nueva factura'}</h3>

      <div class="campo"><label for="f-fec">Fecha</label>
        <input type="date" id="f-fec" value="${f.fecha}"></div></div>

    <div class="campo"><label for="f-cli">Cliente</label>
      <input id="f-cli" list="lista-fcli" value="${esc(f.cliente)}" placeholder="Nombre o empresa" autocomplete="off">
      <datalist id="lista-fcli">${nombres.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
    <div class="fila2">
      <div class="campo"><label for="f-nif">NIF / CIF</label>
        <input id="f-nif" value="${esc(f.clienteNif)}" placeholder="B-12345678" autocomplete="off"></div>
      <div class="campo"><label for="f-cp">CP</label>
        <input id="f-cp" value="${esc(f.clienteCp)}" placeholder="29660" autocomplete="off"></div></div>
    <div class="campo"><label for="f-dir">Dirección</label>
      <input id="f-dir" value="${esc(f.clienteDir)}" placeholder="Avda. Calderón Barca s/n" autocomplete="off"></div>
    <div class="fila2">
      <div class="campo"><label for="f-ciu">Ciudad</label>
        <input id="f-ciu" value="${esc(f.clienteCiudad)}" placeholder="Marbella, Málaga" autocomplete="off"></div>
      <div class="campo"><label for="f-ue">IVA</label>
        <select id="f-ue">
          <option value="0"${!f.intraUE?' selected':''}>${fiscal().iva} % normal</option>
          <option value="1"${f.intraUE?' selected':''}>0 % · empresa UE</option>
        </select></div></div>

    <div class="fila2">
      <div class="campo"><label for="f-veh">Vehículo</label>
        <input id="f-veh" list="lista-fveh" value="${esc(f.vehiculo)}" placeholder="Ferrari Purosangue" autocomplete="off">
        <datalist id="lista-fveh">${coches.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
      <div class="campo"><label for="f-mat">Matrícula</label>
        <input id="f-mat" value="${esc(f.matricula)}" placeholder="opcional" autocomplete="off"></div></div>

    <div class="cobros" id="f-lineas"></div>

    <div class="acc">
      <button class="btn" type="button" data-cerrar>Cancelar</button>
      <button class="btn pri" type="button" id="f-ok">Guardar y ver</button>
    </div>`;
  $('#hoja').classList.add('on');
  enfocar('#f-cli');

  /* Al escribir el cliente se rellenan sus datos fiscales si ya están
     en su ficha: evita teclear el NIF cada vez. */
  $('#f-cli').addEventListener('change',()=>{
    const n = normNom($('#f-cli').value);
    const c = D.clientes.find(x=>normNom(x.nombre)===n);
    if(!c) return;
    if(c.nif) $('#f-nif').value = c.nif;
    if(c.direccion) $('#f-dir').value = c.direccion;
    if(c.ciudad) $('#f-ciu').value = c.ciudad;
    if(c.cp) $('#f-cp').value = c.cp;
    if(c.intraUE) $('#f-ue').value = '1';
  });

  function pintarLineas(){
    const cont=$('#f-lineas'); if(!cont) return;
    const base = lineasF.reduce((a,l)=>a+(l.cantidad||1)*(l.precio||0),0);
    const tipo = $('#f-ue').value==='1' ? 0 : fiscal().iva;
    cont.innerHTML = `<label style="font-family:var(--mono);font-size:10px;letter-spacing:.09em;
        text-transform:uppercase;color:var(--dim)">Conceptos</label>`
      + lineasF.map((l,i)=>`<div class="lin-fac">
          <input class="l-desc" data-i="${i}" value="${esc(l.desc)}" placeholder="Instalación de PPF full body" autocomplete="off">
          <input class="l-cant" data-i="${i}" type="number" min="1" value="${l.cantidad||1}" inputmode="numeric">
          <input class="l-prec" data-i="${i}" type="number" step="0.01" value="${l.precio||''}" placeholder="Precio" inputmode="decimal">
          <button class="x" data-ql="${i}" aria-label="Quitar línea">×</button>

      + `<button class="btn mini" id="l-add" type="button" style="margin-top:8px">+ Concepto</button>

           <span>Base <b>${eur(base)} €</b></span>
           <span>IVA ${tipo} % <b>${eur(base*tipo/100)} €</b></span>
           <span class="tot">Total <b>${eur(base*(1+tipo/100))} €</b></span>
         </div>`;

    cont.querySelectorAll('.l-desc').forEach(el=>el.addEventListener('input',e=>{
      lineasF[+e.target.dataset.i].desc = e.target.value; }));
    cont.querySelectorAll('.l-cant').forEach(el=>el.addEventListener('input',e=>{
      lineasF[+e.target.dataset.i].cantidad = Math.max(1, +e.target.value||1); pintarTotales(); }));
    cont.querySelectorAll('.l-prec').forEach(el=>el.addEventListener('input',e=>{
      lineasF[+e.target.dataset.i].precio = numero(e.target.value); pintarTotales(); }));
    cont.querySelectorAll('[data-ql]').forEach(b=>b.addEventListener('click',()=>{
      lineasF.splice(+b.dataset.ql,1);
      if(!lineasF.length) lineasF.push({desc:'',cantidad:1,precio:0});
      pintarLineas(); }));
    $('#l-add').addEventListener('click',()=>{
      lineasF.push({desc:'',cantidad:1,precio:0}); pintarLineas(); });
  }
  /* Solo se refresca el resumen, no toda la lista: si se repinta entero
     mientras se escribe, el cursor salta al principio del campo. */
  function pintarTotales(){
    const base = lineasF.reduce((a,l)=>a+(l.cantidad||1)*(l.precio||0),0);
    const tipo = $('#f-ue').value==='1' ? 0 : fiscal().iva;
    const d = $('#f-lineas').querySelector('.desglose');
    if(d) d.innerHTML = `<span>Base <b>${eur(base)} €</b></span>
      <span>IVA ${tipo} % <b>${eur(base*tipo/100)} €</b></span>
      <span class="tot">Total <b>${eur(base*(1+tipo/100))} €</b></span>`;
  }
  pintarLineas();
  $('#f-ue').addEventListener('change',pintarTotales);

  $('#f-ok').addEventListener('click',()=>{
    const num = +$('#f-num').value || proximoNumero();
    const repe = facturas().find(x=>+x.numero===num && x.id!==(editF2&&editF2.id));
    if(repe && !confirm(`Ya existe la factura ${num}. ¿Seguir igualmente?`)) return;
    const d = {
      numero: num, fecha: $('#f-fec').value || aIso(hoy),
      cliente: $('#f-cli').value.trim(), clienteNif: $('#f-nif').value.trim(),
      clienteDir: $('#f-dir').value.trim(), clienteCiudad: $('#f-ciu').value.trim(),
      clienteCp: $('#f-cp').value.trim(), intraUE: $('#f-ue').value==='1',
      vehiculo: $('#f-veh').value.trim(), matricula: $('#f-mat').value.trim(),
      condiciones: f.condiciones || '',
      lineas: lineasF.filter(l=>(l.desc||'').trim() || l.precio)
    };
    if(!d.lineas.length){ alert('Añade al menos un concepto.'); return; }
    let destino;
    if(editF2){ Object.assign(editF2, d); destino = editF2; }
    else { destino = Object.assign({id:nid()}, d); D.facturas.push(destino); }
    cerrar(); guardar(); pintar();
    verFactura(destino.id);
  });


}

/* Rectificar = emitir una factura de abono: los mismos conceptos en
   negativo, con número propio. Las dos quedan y se anulan entre sí, así
   la numeración no tiene huecos y se ve qué pasó. */
function rectificarFactura(id){
  const f = facturas().find(x=>x.id===id); if(!f) return;
  if(f.rectificaA){ alert('Esta ya es una factura de abono.'); return; }
  const ya = facturas().find(x=>+x.rectificaA===+f.numero);
  if(ya){ alert(`La factura ${f.numero} ya está rectificada por la ${ya.numero}.`); return; }

  const t = totalesFactura(f);
  if(!confirm(`Se va a emitir la factura ${proximoNumero()} por −${eur(t.total)} €`
    + ` para anular la ${f.numero}.\n\nLas dos quedan guardadas. ¿Seguir?`)) return;

  const abono = {
    id: nid(), numero: proximoNumero(), fecha: aIso(hoy),
    rectificaA: f.numero,
    cliente:f.cliente, clienteNif:f.clienteNif, clienteDir:f.clienteDir,
    clienteCiudad:f.clienteCiudad, clienteCp:f.clienteCp,
    vehiculo:f.vehiculo, matricula:f.matricula, intraUE:f.intraUE,
    lineas:(f.lineas||[]).map(l=>({...l, precio: -(l.precio||0)})),
    condiciones:`Rectifica la factura ${f.numero}.`
  };
  D.facturas.push(abono);
  guardar(); cerrarFac(); pintar();
  verFactura(abono.id);
}

/* Solo se puede borrar la última: ahí no queda hueco y el número se
   reutiliza. Las anteriores se corrigen rectificando. */
const esUltima = f => +f.numero === Math.max(...facturas().map(x=>+x.numero||0));

/* ─── vista previa, impresión y PDF ────────────────────────────────── */
function verFactura(id){
  const f = facturas().find(x=>x.id===id); if(!f) return;
  const anulada = facturas().find(x=>+x.rectificaA===+f.numero);
  $('#hojaC').innerHTML = `<div class="fac-acciones">
      <button class="btn mini" data-cerrar>Cerrar</button>
      <button class="btn mini" id="fac-edit">Editar</button>
      ${!f.rectificaA && !anulada ? `<button class="btn mini" id="fac-rect">Rectificar</button>`:''}
      ${esUltima(f) ? `<button class="btn mini borrar" id="fac-del">Eliminar</button>`:''}
      <button class="btn mini" id="fac-pdf">Descargar PDF</button>
      <button class="btn pri mini" id="fac-imp">Imprimir</button>
    </div>
    ${anulada?`<div class="fac-aviso">Anulada por la factura ${esc(anulada.numero)}.</div>`:''}
    ${f.rectificaA?`<div class="fac-aviso">Factura de abono: rectifica la ${esc(f.rectificaA)}.</div>`:''}
    <div class="fac-prev">${htmlFactura(f)}</div>`;
  $('#hoja').classList.add('on');
  $('#hojaC').classList.add('ancho');

  $('#fac-edit').addEventListener('click',()=>{ cerrarFac(); abrirFactura(id); });
  const rect=$('#fac-rect'); if(rect) rect.addEventListener('click',()=>rectificarFactura(id));
  const bor=$('#fac-del'); if(bor) bor.addEventListener('click',()=>{
    if(!confirm(`¿Eliminar la factura ${f.numero}?\n\nEs la última emitida, así que el número`
      + ` volverá a estar libre. Solo hazlo si no la has entregado a nadie.`)) return;
    borrarDoc('facturas', f.id);
    D.facturas = D.facturas.filter(x=>x.id!==f.id);
    cerrarFac(); guardar(); pintar();
  });
  $('#fac-imp').addEventListener('click',()=>imprimirFactura(f, false));
  $('#fac-pdf').addEventListener('click',()=>imprimirFactura(f, true));
}
function cerrarFac(){ $('#hojaC').classList.remove('ancho'); cerrar(); }

/* Se abre una ventana con la factura sola y se lanza el diálogo del
   sistema. Desde ahí se imprime o se elige "Guardar como PDF", que es
   como se genera el PDF sin depender de ninguna librería externa. */
function imprimirFactura(f, comoPdf){
  const css = [...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  const w = window.open('', '_blank');
  if(!w){ alert('El navegador ha bloqueado la ventana. Permite las ventanas emergentes para poder imprimir.'); return; }
  w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
    <title>Factura ${esc(f.numero)} · ${esc(f.cliente||'')}</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>${css}

      .fac{margin:0 auto}
      @page{size:A4;margin:14mm}
    </style></head><body>${htmlFactura(f)}</body></html>`);
  w.document.close();
  // Se espera a que carguen las fuentes: si no, imprime con la tipografía
  // del sistema y el resultado no se parece a la vista previa.
  const lanzar = () => { w.focus(); w.print(); };
  if(w.document.fonts && w.document.fonts.ready) w.document.fonts.ready.then(()=>setTimeout(lanzar,120));
  else setTimeout(lanzar, 600);
}

/* ─── impuestos ────────────────────────────────────────────────────────
   El IVA y el IRPF se liquidan por trimestres, no por meses. Tenerlos en
   su propia pestaña evita mezclar la caja del día a día con lo que hay
   que apartar para Hacienda.                                          */
function vistaImpuestos(){
  const as=anios();
  if(anioSel===null||!as.includes(anioSel)) anioSel=as[0];

  const tri=trimestres(anioSel);
  const triActual = anioSel===hoy.getFullYear() ? TRIMESTRE(aIso(hoy)) : null;
  const conMov = tri.filter(x=>x.baseFact||x.efectivo||x.gastos);
  const visibles = tri.filter(x=>x.baseFact||x.efectivo||x.gastos||x.n===triActual);

  const anual=tri.reduce((a,x)=>({
    baseFact:a.baseFact+x.baseFact, efectivo:a.efectivo+x.efectivo,
    baseGasto:a.baseGasto+x.baseGasto, ivaPagar:a.ivaPagar+Math.max(0,x.ivaPagar),
    irpf:a.irpf+x.irpf, neto:a.neto+x.neto}),
    {baseFact:0,efectivo:0,baseGasto:0,ivaPagar:0,irpf:0,neto:0});

  const totalRet = tri.reduce((a,x)=>a+x.retenido,0);
  const aHacienda = anual.ivaPagar + anual.irpf + totalRet;
  const trimAhora = triActual ? tri[triActual-1] : null;
  const LIMITE=['20 de abril','20 de julio','20 de octubre','30 de enero'];

  let h=`<div class="selanio">
      <span class="selanio-et">Año</span>
      ${as.map(a=>`<button class="anio-btn${a===anioSel?' on':''}" data-anio="${a}">${a}</button>`).join('')}
      <span class="selanio-nota">IVA ${fiscal().iva} % · IRPF ${fiscal().irpf} % · se cambian en Ajustes</span>
    </div>`;

  h+=`<div class="kpis">
    <div class="kpi ${trimAhora && (Math.max(0,trimAhora.ivaPagar)+trimAhora.irpf+trimAhora.retenido)>0?'riesgo':'destaca'}">
      <span class="et">Este trimestre</span>
      <div class="n">${trimAhora?eur(Math.max(0,trimAhora.ivaPagar)+trimAhora.irpf+trimAhora.retenido):0}<small>€</small></div>
      <div class="sub">${triActual?`T${triActual} · antes del ${LIMITE[triActual-1]}`:'—'}</div></div>
    <div class="kpi"><span class="et">IVA del año</span>
      <div class="n">${eur(anual.ivaPagar)}<small>€</small></div>
      <div class="sub">lo cobrado menos lo soportado</div></div>
    <div class="kpi"><span class="et">IRPF del año</span>
      <div class="n">${eur(anual.irpf)}<small>€</small></div>
      <div class="sub">${fiscal().irpf} % del beneficio</div></div>
    <div class="kpi"><span class="et">Total a Hacienda</span>
      <div class="n">${eur(aHacienda)}<small>€</small></div>
      <div class="sub">en ${anioSel}</div></div></div>`;

  /* Agenda de pagos, no un resumen del negocio: eso ya lo cuentan las
     ruedas de Wallet. Aquí solo va qué se paga, cuánto y hasta cuándo. */
  h+=`<div class="cab"><h2>Trimestre a trimestre</h2>
    <span class="nota">toca un trimestre para ver de dónde sale</span></div>
  <table class="tabla"><thead><tr>
    <th>Trimestre</th>
    <th style="text-align:right">IVA</th>
    <th style="text-align:right">IRPF ${fiscal().irpf} %</th>
    <th style="text-align:right">Retenciones</th>
    <th style="text-align:right">A pagar</th>
    <th style="text-align:right">Antes del</th>
  </tr></thead><tbody>`;

  visibles.forEach(x=>{
    const aPagar = Math.max(0,x.ivaPagar) + x.irpf + x.retenido;
    const vacio = !(x.baseFact||x.efectivo||x.gastos);
    h+=`<tr data-tri="${x.n}" style="cursor:pointer${vacio?';opacity:.5':''}">
      <td><b>T${x.n}</b> <span style="color:var(--dim);font-size:11.5px">${
        ['ene–mar','abr–jun','jul–sep','oct–dic'][x.n-1]}</span>
        ${x.n===triActual?' <span class="pill">en curso</span>':''}</td>
      <td class="num ${x.ivaPagar>0?'neg':'pos'}">${
        x.ivaPagar<0 ? `${eur(Math.abs(x.ivaPagar))} € a tu favor` : `${eur(x.ivaPagar)} €`}</td>
      <td class="num ${x.irpf>0?'neg':''}">${eur(x.irpf)} €</td>
      <td class="num ${x.retenido>0?'neg':''}">${eur(x.retenido)} €</td>
      <td class="num"><b>${eur(aPagar)} €</b></td>
      <td class="num" style="color:var(--dim)">${LIMITE[x.n-1]}</td></tr>`;

    if(triAbierto===x.n){
      h+=`<tr class="detalle"><td colspan="6">
        <div class="det">
          <div class="det-b">
            <b>IVA</b>
            <div class="lin"><span>Cobrado en facturas</span><b>${eur(x.ivaRep)} €</b></div>
            <div class="lin"><span>Pagado en compras</span><b>−${eur(x.ivaSop)} €</b></div>
            <div class="lin res"><span>${x.ivaPagar>=0?'A ingresar':'A tu favor'}</span>
              <b>${eur(Math.abs(x.ivaPagar))} €</b></div>
            <p>De cada factura que cobras, el ${fiscal().iva} % nunca fue tuyo.
               Lo que pagas de IVA al comprar se resta.</p>
          </div>
          <div class="det-b">
            <b>IRPF</b>
            <div class="lin"><span>Facturado</span><b>${eur(x.baseFact)} €</b></div>
            <div class="lin"><span>Gasto con factura</span><b>−${eur(x.baseGasto)} €</b></div>
            <div class="lin"><span>Beneficio</span><b>${eur(x.beneficio)} €</b></div>
            <div class="lin res"><span>${fiscal().irpf} % a cuenta</span><b>${eur(x.irpf)} €</b></div>
            <p>Hacienda no espera a fin de año: cada trimestre se adelanta
               una parte de lo ganado.</p>
          </div>
          ${x.retenido>0?`<div class="det-b">
            <b>Retenciones</b>
            <div class="lin"><span>Retenido en alquiler y profesionales</span><b>${eur(x.retenido)} €</b></div>
            <div class="lin res"><span>A ingresar</span><b>${eur(x.retenido)} €</b></div>
            <p>No es un gasto tuyo: es dinero que no le pagaste al casero
               y que le entregas a Hacienda en su nombre.</p>
          </div>`:''}
          <div class="det-b">
            <b>Efectivo</b>
            <div class="lin"><span>Cobrado sin factura</span><b>${eur(x.efectivo)} €</b></div>
            ${x.sinFactura?`<div class="lin"><span>Gasto sin factura</span><b>${eur(x.sinFactura)} €</b></div>`:''}
            <div class="lin res"><span>Impuestos que genera</span><b>0 €</b></div>
            <p>Queda fuera del IVA y del IRPF. Entra en caja pero no aparece
               en ninguna liquidación.</p>
          </div>
        </div></td></tr>`;
    }
  });
  h+=`</tbody></table>`;

  h+=`<div class="aviso"><b>Aquí solo está lo que hay que pagar y cuándo.</b>
    Cuánto entra, cuánto se va en gastos y cuánto queda limpio lo tienes
    graficado en Wallet, con el mismo selector de trimestre.</div>`;

  return h;
}

function totalesFactura(f){
  const base = (f.lineas||[]).reduce((a,l)=>a+(l.cantidad||1)*(l.precio||0), 0);
  const tipo = f.intraUE ? 0 : (f.iva != null ? f.iva : fiscal().iva);
  const iva  = base * tipo/100;
  return {base, tipo, iva, total: base + iva};
}

/* ─── clientes ─────────────────────────────────────────────────────── */
const normNom = s => String(s||'').trim().toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');

/** Une la ficha del cliente con lo que dicen sus trabajos. */
function clientesConHistorial(){
  const mapa = new Map();
  D.clientes.forEach(c=>mapa.set(normNom(c.nombre), {...c, trabajos:[], ficha:true}));

  D.trabajos.forEach(t=>{
    const k = normNom(t.cliente);
    if(!k) return;
    if(!mapa.has(k)) mapa.set(k, {id:null, nombre:t.cliente, telefono:'', coches:'',
                                  notas:'', idioma:'', trabajos:[], ficha:false});
    mapa.get(k).trabajos.push(t);
  });

  return [...mapa.values()].map(c=>{
    const facturado = c.trabajos.reduce((a,t)=>a+(t.presupuesto||0),0);
    const cobrado_  = c.trabajos.reduce((a,t)=>a+cobrado(t),0);
    const fechas    = c.trabajos.map(t=>aFecha(t.entra)).sort((a,b)=>b-a);
    const ultima    = fechas[0] || null;
    return {...c, facturado, cobrado:cobrado_, pendiente:Math.max(0,facturado-cobrado_),
            n:c.trabajos.length, ultima,
            diasSin: ultima ? diasEntre(ultima, hoy) : null,
            cochesVistos:[...new Set(c.trabajos.map(t=>t.coche))].join(', ')};
  }).sort((a,b)=>b.facturado-a.facturado);
}

function vistaClientes(){
  const cl = clientesConHistorial();
  const conTrabajo = cl.filter(c=>c.n>0);
  const facturado  = conTrabajo.reduce((a,c)=>a+c.facturado,0);
  const ticket     = conTrabajo.length ? facturado/conTrabajo.reduce((a,c)=>a+c.n,0) : 0;
  const dormidos   = cl.filter(c=>c.diasSin!=null && c.diasSin>180);
  const sinFicha   = cl.filter(c=>!c.ficha).length;

  let h=`<div class="anio">
    <button class="btn mini pri" data-acc="cliente">+ Cliente</button>
    ${sinFicha?`<span class="nota" style="font-family:var(--mono);font-size:11px;color:var(--dim)">
      ${sinFicha} cliente${sinFicha>1?'s':''} sin ficha, sacado${sinFicha>1?'s':''} de los trabajos</span>`:''}
  </div>`;

  h+=`<div class="kpis">
    <div class="kpi destaca"><span class="et">Clientes</span>
      <div class="n">${cl.length}</div>
      <div class="sub">${conTrabajo.length} con trabajos hechos</div></div>
    <div class="kpi"><span class="et">Ticket medio</span>
      <div class="n">${eur(ticket)}<small>€</small></div>
      <div class="sub">por trabajo</div></div>
    <div class="kpi"><span class="et">Por cobrar</span>
      <div class="n">${eur(cl.reduce((a,c)=>a+c.pendiente,0))}<small>€</small></div>
      <div class="sub">saldo pendiente de todos</div></div>
    <div class="kpi riesgo"><span class="et">Sin volver</span>
      <div class="n">${dormidos.length}</div>
      <div class="sub">más de 6 meses sin pasar</div></div></div>`;

  if(dormidos.length) h+=`<div class="aviso">
    <b>Hay ${dormidos.length} cliente${dormidos.length>1?'s':''} que no vuelve${dormidos.length>1?'n':''} desde hace más de medio año:</b>
    ${dormidos.slice(0,6).map(c=>esc(c.nombre)).join(', ')}.
    Recuperar a uno que ya te conoce cuesta mucho menos que conseguir uno nuevo.</div>`;

  h+=`<table class="tabla"><thead><tr>
      <th>Cliente</th><th>Teléfono</th><th>Coches</th>
      <th style="text-align:right">Trabajos</th>
      <th style="text-align:right">Facturado</th>
      <th style="text-align:right">Pendiente</th>
      <th style="text-align:right">Última visita</th>
    </tr></thead><tbody>`;
  h+= cl.length ? cl.map(c=>`<tr data-c="${esc(c.id||'')}" data-nom="${esc(c.nombre)}" style="cursor:pointer">
      <td><b>${esc(c.nombre)}</b>${!c.ficha?' <span class="pill">sin ficha</span>':''}
        ${c.idioma==='en'?' <span class="pill">EN</span>':''}</td>
      <td style="font-family:var(--mono);font-size:12px">${esc(c.telefono)||'—'}</td>
      <td style="color:var(--dim);font-size:12.5px">${esc(c.cochesVistos||c.coches)||'—'}</td>
      <td class="num">${c.n}</td>
      <td class="num">${c.facturado?eur(c.facturado)+' €':'—'}</td>
      <td class="num ${c.pendiente?'neg':''}">${c.pendiente?eur(c.pendiente)+' €':'—'}</td>
      <td class="num" ${c.diasSin>180?'style="color:var(--alerta)"':''}>
        ${c.ultima?fCorta(c.ultima)+(c.diasSin>30?` <span style="color:var(--dim)">(${Math.round(c.diasSin/30)} m)</span>`:''):'—'}</td>
    </tr>`).join('')
    : `<tr><td colspan="7" class="vacio">Todavía no hay clientes. Añade el primero con «+ Cliente».</td></tr>`;
  h+=`</tbody></table>`;
  return h;
}

    cont.querySelectorAll('[data-qc]').forEach(b=>b.addEventListener('click',()=>{
      coches.splice(+b.dataset.qc,1); pintarCoches();
    }));
    $('#v-add').addEventListener('click',()=>{
      const m=$('#v-mod').value.trim(); if(!m) return;
      coches.push({id:nid(), modelo:m, matricula:$('#v-mat').value.trim(), color:''});
      pintarCoches(); $('#v-mod').focus();
    });
  }
  pintarCoches();

  $('#cl-ok').addEventListener('click',()=>{
    const d={nombre:$('#cl-nom').value.trim(), telefono:$('#cl-tel').value.trim(),
      vehiculos:coches, coches:coches.map(v=>v.modelo).join(', '),
      idioma:$('#cl-idi').value, notas:$('#cl-not').value.trim(),

      ciudad:$('#cl-ciu').value.trim(), cp:$('#cl-cp').value.trim(),

    cerrar(); guardar(); pintar();
  });
  const del=$('#cl-del'); if(del) del.addEventListener('click',()=>{
    borrarDoc('clientes', editC.id); D.clientes=D.clientes.filter(x=>x.id!==editC.id); cerrar(); guardar(); pintar();
  });
}

/* ─── registro ─────────────────────────────────────────────────────── */
function vistaRegistro(){
  const todos = [...D.trabajos].sort((a,b)=>a.entra<b.entra?-1:1);
  const pendiente_ = todos.reduce((a,t)=>a+pendiente(t),0);

  // Agrupado por mes, con el año en la etiqueta: así al pasar a 2027 se
  // ordena solo y no hace falta un nivel más de anidado.
  const meses = {};
  todos.forEach(t=>{
    const d=aFecha(t.entra);
    const k=`${d.getFullYear()}-${p2(d.getMonth()+1)}`;
    (meses[k]=meses[k]||[]).push(t);
  });
  const claves = Object.keys(meses).sort();   // cronológico hacia abajo

  let h=`<div class="cab"><h2>Todos los trabajos</h2>
    <span class="nota">${todos.length} trabajo${todos.length===1?'':'s'}${
      pendiente_>0?` · ${eur(pendiente_)} € por cobrar`:''}</span></div>
    <div class="anio">
      <input class="buscar" id="q-reg" placeholder="Buscar coche, cliente o servicio…" autocomplete="off">
      <button class="btn mini" data-acc="plegarreg">${
        claves.every(k=>!mesesAbiertos.has('reg-'+k)) ? 'Abrir todo' : 'Cerrar todo'}</button>
    </div>`;

  if(!claves.length) return h + `<div class="vacio" style="border:1px solid var(--linea)">
    Todavía no hay trabajos. Añade el primero con «+ Trabajo».</div>`;

  h+=`<div id="tb-reg">`;
  claves.forEach(k=>{
    const ts = meses[k];
    const [anio,mes] = k.split('-').map(Number);
    const abierto = mesesAbiertos.has('reg-'+k);
    const facturado = ts.reduce((a,t)=>a+(t.presupuesto||0),0);
    const debe = ts.reduce((a,t)=>a+pendiente(t),0);

    h+=`<section class="grupo${abierto?' abierto':''}">
      <button class="grupo-cab" data-mes-toggle="reg-${k}">
        <i>${abierto?'−':'+'}</i>
        <b>${MESES[mes-1]}</b><span>${anio} · ${ts.length} trabajo${ts.length===1?'':'s'}</span>
        ${debe>0?`<span class="neg" style="font-family:var(--mono);font-size:11px">${eur(debe)} € por cobrar</span>`:''}
        <em>${eur(facturado)} €</em>
      </button>
      <table class="tabla"><thead><tr>
        <th>Coche</th><th>Servicio</th><th>Plaza</th><th>Entra</th><th>Sale</th>
        <th style="text-align:right">Días</th>
        <th style="text-align:right">Presupuesto</th>
        <th style="text-align:right">Cobrado</th>
        <th style="text-align:right">€/día</th>
        <th>Estado</th></tr></thead><tbody>`;

    ts.forEach(t=>{
      const co=cobrado(t), pd=t.presupuesto?Math.round(t.presupuesto/Math.max(1,t.dias)):0;
      const busca=[t.coche,t.cliente,t.servicio].filter(Boolean).join(' ').toLowerCase();
      h+=`<tr data-t="${t.id}" data-q="${esc(busca)}" style="cursor:pointer">
        <td>${esc(t.coche)}${t.cliente?`<br><span style="color:var(--dim);font-size:11.5px">${esc(t.cliente)}</span>`:''}</td>
        <td>${esc(t.servicio)}</td>
        <td class="num">${t.plaza}</td>
        <td class="num">${fCorta(aFecha(t.entra))}</td>
        <td class="num">${fCorta(salida(t))}</td>
        <td class="num">${t.dias}</td>
        <td class="num">${t.presupuesto?eur(t.presupuesto)+' €':'—'}</td>
        <td class="num ${pendiente(t)>0?'neg':'pos'}">${eur(co)} €</td>
        <td class="num ${pd&&pd<200?'neg':'pos'}">${pd?eur(pd)+' €':'—'}</td>
        <td><span class="pill">${ESTADOS[t.estado]||t.estado}</span></td></tr>`;
    });
    h+=`</tbody></table></section>`;
  });
  h+=`</div>`;
  return h;
}

/* ─── hoja de trabajo ──────────────────────────────────────────────── */
let editT=null, previoT=null;
let mats=[];        // materiales de la hoja abierta

function abrirTrabajo(id, previo){
  editT = id ? D.trabajos.find(t=>t.id===id) : null;
  previoT = previo||null;
  const t = editT || {coche:'',cliente:'',servicio:(servicios()[0]||{n:'Otro'}).n,
    plaza:previo?previo.plaza:1,
    estado: (previo?previo.entra:aIso(hoy)) <= aIso(hoy) ? 'curso' : 'reservado',
    entra:previo?previo.entra:aIso(hoy), dias:1, presupuesto:0};

  let cobrosHtml='';
  if(editT){
    const co=cobrado(editT), pe=pendiente(editT);
    cobrosHtml=`<div class="cobros">
      <label style="font-family:var(--mono);font-size:10px;letter-spacing:.09em;
        text-transform:uppercase;color:var(--dim)">Cobros · ${eur(co)} € de ${eur(t.presupuesto)} €
        ${pe>0?`<span class="saldo debe"> · faltan ${eur(pe)} €</span>`
          :(t.presupuesto>0?`<span class="saldo ok"> · cobrado</span>`:'')}</label>`
      + D.cobros.filter(c=>c.trabajoId===editT.id).map(c=>`<div class="cobro">
          <span>${eur(c.importe)} €</span><span style="color:var(--dim)">${esc(via(c.via))}</span>
          <span style="color:var(--dim);font-family:var(--mono);font-size:11px">${fCorta(aFecha(c.fecha))}</span>
          <button class="x" data-quitar="${c.id}" aria-label="Quitar cobro">×</button></div>`).join('')
      + `<div class="cobro-nuevo">
          <div class="mini-form">
            <div><label class="mini-et" for="c-imp">Importe (€)</label>
              <input type="number" id="c-imp" placeholder="100" inputmode="decimal"></div>
            <div><label class="mini-et" for="c-via">Cómo ha pagado</label>
              <select id="c-via">${VIAS_COBRO.map(v=>`<option>${v}</option>`).join('')}</select></div>
            <button class="btn mini" id="c-add" type="button">Añadir</button>
          </div>
          <p class="mini-nota" id="c-nota"></p>
        </div></div>`;
  }

  $('#hojaC').innerHTML = `<h3>${editT?'Editar trabajo':'Nuevo trabajo'}</h3>
    <div class="campo"><label for="t-coche">Coche</label>
      <input id="t-coche" list="lista-coche" value="${esc(t.coche)}" placeholder="Porsche Cayenne 2021" autocomplete="off">
      <datalist id="lista-coche">${
        [...new Set(
          D.clientes.flatMap(c=>(c.vehiculos||[]).map(v=>v.modelo))
            .concat(D.trabajos.map(x=>x.coche))
        )].filter(Boolean).sort().map(n=>`<option value="${esc(n)}">`).join('')
      }</datalist></div>
    <div class="campo"><label for="t-cli">Cliente</label>
      <input id="t-cli" list="lista-cli" value="${esc(t.cliente)}" placeholder="Nombre o teléfono" autocomplete="off">
      <datalist id="lista-cli">${
        [...new Set(D.clientes.map(c=>c.nombre).concat(D.trabajos.map(x=>x.cliente)))]
          .filter(Boolean).sort().map(n=>`<option value="${esc(n)}">`).join('')
      }</datalist></div>
    <div class="campo"><label for="t-serv">Servicio</label>
      <select id="t-serv">${servicios().map(s=>`<option${s.n===t.servicio?' selected':''}>${s.n}</option>`).join('')}</select></div>
    <div class="fila2">
      <div class="campo"><label for="t-plaza">Plaza</label>
        <select id="t-plaza">${plazas()
          .map(p=>`<option value="${p.id}"${p.id===+t.plaza?' selected':''}>${p.nom}${p.libre?' · reserva':''}</option>`).join('')}</select></div>
      <div class="campo"><label for="t-estado">Estado</label>
        <select id="t-estado">${Object.entries(ESTADOS)
          .map(([k,v])=>`<option value="${k}"${k===t.estado?' selected':''}>${v}</option>`).join('')}</select></div></div>
    <div class="fila2">
      <div class="campo"><label for="t-entra">Entra</label>
        <input type="date" id="t-entra" value="${t.entra}"></div>
      <div class="campo"><label for="t-dias">Días que se queda</label>
        <input type="number" id="t-dias" min="1" max="60" value="${t.dias}" inputmode="numeric"></div></div>
    <div class="campo"><label for="t-pres">Presupuesto sin IVA (€)</label>
      <input type="number" id="t-pres" min="0" step="0.01" value="${t.presupuesto||''}" placeholder="350" inputmode="decimal"></div>
    <div id="t-sena"></div>
    <div class="cobros" id="t-materiales"></div>
    ${cobrosHtml}
    <div class="acc">
      <button class="btn" type="button" data-cerrar>Cancelar</button>
      ${editT?`<button class="btn borrar" type="button" id="t-del">Eliminar</button>`:''}
      <button class="btn pri" type="button" id="t-ok">Guardar</button></div>`;

  $('#hoja').classList.add('on');
  enfocar('#t-coche');

  /* Materiales usados en este coche. Se restan del presupuesto para ver
     el margen; no se suman a los gastos, que ya los recoge la caja. */
  mats = (editT && Array.isArray(editT.materiales)) ? editT.materiales.map(m=>({...m})) : [];
  function pintarMats(){
    const cont=$('#t-materiales'); if(!cont) return;
    const total=mats.reduce((a,m)=>a+(m.coste||0),0);
    const pres=+($('#t-pres')||{}).value||0;
    const marg=pres-total;
    cont.innerHTML = `<label style="font-family:var(--mono);font-size:10px;letter-spacing:.09em;
        text-transform:uppercase;color:var(--dim)">Materiales usados · ${eur(total)} €
        ${pres?`<span class="saldo ${marg<0?'debe':'ok'}"> · margen ${eur(marg)} €</span>`:''}</label>`
      + mats.map((m,i)=>`<div class="cobro"><span>${esc(m.nombre)}</span>
          <span style="margin-left:auto;font-family:var(--mono);font-size:12px">${eur(m.coste)} €</span>
          <button class="x" data-qm="${i}" aria-label="Quitar material">×</button></div>`).join('')
      + `<div class="mini-form">
          <input id="m-nom" placeholder="Bobina PPF, 1/2 rollo" autocomplete="off">
          <input id="m-cos" type="number" placeholder="Coste €" inputmode="decimal">
          <button class="btn mini" id="m-add" type="button">Añadir</button></div>`;
    cont.querySelectorAll('[data-qm]').forEach(b=>b.addEventListener('click',()=>{
      mats.splice(+b.dataset.qm,1); pintarMats();
    }));
    $('#m-add').addEventListener('click',()=>{
      const n=$('#m-nom').value.trim(); if(!n) return;
      mats.push({nombre:n, coste:numero($('#m-cos').value)});
      pintarMats(); $('#m-nom').focus();
    });
  }
  pintarMats();
  $('#t-pres').addEventListener('input',pintarMats);

  /* Señal. Solo aparece en PPF y vinilo, y solo al crear el trabajo:
     es el momento en que el cliente está delante. */
  function pintarSena(){
    const cont=$('#t-sena'); if(!cont) return;
    const serv=$('#t-serv').value;
    /* Se muestra también al editar: a veces el servicio cambia después de
       tomar el trabajo, o la señal se cobra unos días más tarde. Solo se
       oculta cuando ya hay algún cobro, porque entonces se gestiona desde
       la lista de cobros de abajo. */
    const yaCobrado = editT ? cobrado(editT) > 0 : false;
    if(!pideSena(serv) || yaCobrado){ cont.innerHTML=''; return; }
    const mitad=Math.round((numero($('#t-pres').value))/2);
    cont.innerHTML = `<div class="sena">
      <label><input type="checkbox" id="s-cobrada"> Cobrar ${editT?'la':'ahora la'} señal del 50 %</label>
      <div class="mini-form" style="grid-template-columns:1fr 1fr">
        <input type="number" id="s-imp" value="${mitad||''}" placeholder="Importe" inputmode="decimal">
        <select id="s-via">${VIAS_COBRO.map(v=>`<option${v==='Transferencia'?' selected':''}>${v}</option>`).join('')}</select>
      </div>
      <p>El PPF y el vinilo se cobran a la mitad para apartar material y bloquear la plaza.</p>
    </div>`;
  }
  let senaMarcada=false, senaVia='Transferencia';
  function pintarSenaConEstado(){
    const chk=$('#s-cobrada'), via=$('#s-via');
    if(chk) senaMarcada=chk.checked;
    if(via) senaVia=via.value;
    pintarSena();
    const chk2=$('#s-cobrada'), via2=$('#s-via');
    if(chk2) chk2.checked=senaMarcada;
    if(via2) via2.value=senaVia;
  }
  pintarSena();
  $('#t-serv').addEventListener('change',pintarSenaConEstado);
  $('#t-pres').addEventListener('input',pintarSenaConEstado);

  /* Al elegir servicio se autocompletan días e importe, pero solo si el
     usuario no los ha tocado ya. Antes los pisaba siempre y quien ponía
     3 días y después cambiaba de servicio se quedaba con 1 sin enterarse. */
  let diasTocados=false, presTocado=false;
  $('#t-dias').addEventListener('input',()=>{ diasTocados=true; });
  $('#t-pres').addEventListener('input',()=>{ presTocado=true; });

  $('#t-serv').addEventListener('change',e=>{
    if(editT) return;
    const s=servicios().find(x=>x.n===e.target.value); if(!s) return;
    if(!diasTocados) $('#t-dias').value = s.d;
    if(!presTocado && s.p) $('#t-pres').value = s.p;
  });
  $('#t-ok').addEventListener('click',guardarTrabajo);
  const del=$('#t-del'); if(del) del.addEventListener('click',()=>{
    D.cobros.filter(c=>c.trabajoId===editT.id).forEach(c=>borrarDoc('cobros',c.id));
    borrarDoc('trabajos', editT.id);
    D.cobros=D.cobros.filter(c=>c.trabajoId!==editT.id);
    D.trabajos=D.trabajos.filter(x=>x.id!==editT.id);

  function notaCobro(){
    const via=$('#c-via'), n=$('#c-nota');
    if(!via||!n) return;
    n.className='mini-nota '+(llevaImpuestos(via.value)?'con':'sin');
    n.textContent = llevaImpuestos(via.value)
      ? `Se factura: lleva ${fiscal().iva} % de IVA y cuenta para el IRPF.`
      : 'En efectivo: no lleva IVA ni cuenta para el IRPF.';
  }
  const selVia=$('#c-via'); if(selVia){ selVia.addEventListener('change',notaCobro); notaCobro(); }

  const add=$('#c-add'); if(add) add.addEventListener('click',()=>{
    const v=numero($('#c-imp').value); if(!v) return;
    const via=$('#c-via').value;
    D.cobros.push({id:nid(),trabajoId:editT.id,importe:v,via,
      facturado:llevaImpuestos(via),
      fecha:aIso(hoy),concepto:`${editT.coche} · ${editT.servicio}`});
    guardar(); abrirTrabajo(editT.id); pintar();
  });
  $('#hojaC').querySelectorAll('[data-quitar]').forEach(b=>b.addEventListener('click',()=>{
    borrarDoc('cobros', b.dataset.quitar);
    D.cobros=D.cobros.filter(c=>c.id!==b.dataset.quitar);
    guardar(); abrirTrabajo(editT.id); pintar();
  }));
}

function guardarTrabajo(){
  const d={
    coche:$('#t-coche').value.trim()||'Sin identificar',
    cliente:$('#t-cli').value.trim(),
    servicio:$('#t-serv').value,
    plaza:+$('#t-plaza').value,
    estado:$('#t-estado').value,
    entra:$('#t-entra').value||aIso(hoy),
    dias:Math.max(1,+$('#t-dias').value||1),
    presupuesto:numero($('#t-pres').value),
    materiales:mats
  };
  let destino;
  if(editT){ Object.assign(editT,d); destino=editT; }
  else { destino = Object.assign({id:nid()}, d); D.trabajos.push(destino); }

  const chk=$('#s-cobrada');
  if(chk && chk.checked){
    const imp=numero($('#s-imp').value);
    if(imp) D.cobros.push({id:nid(), trabajoId:destino.id, importe:imp,
      via:$('#s-via').value, fecha:aIso(hoy), concepto:`${destino.coche} · señal 50%`});
  }
  cerrar(); guardar(); pintar();
}

/* ─── arrastrar trabajos en el calendario ──────────────────────────────
   Un toque abre el panel de acciones; si se arrastra, se mueve de día o
   de plaza. Se distingue por la distancia recorrida, así que en la tablet
   un toque sigue siendo un toque.
   La pista mide siempre 7 columnas, así que el día bajo el dedo sale de
   la proporción, no de un ancho fijo en píxeles.                      */
function diaEnPista(pista, clientX){
  const r = pista.getBoundingClientRect();
  const col = Math.max(0, Math.min(6, Math.floor(((clientX - r.left) / r.width) * 7)));
  return sumar(aFecha(pista.dataset.lunes), col);
}

/* ═══════════════════════════════════════════════════════════════════════
   ARRASTRE DE RESERVAS — modelo definitivo de gestos

   CON EL DEDO (tablet):
     un toque        → selecciona: marco + barrita  [−  N días  +]
     − / +           → cambia la duración de día en día, exacto
     arrastrar (sel) → mueve de día o de plaza, engancha al instante
     mantener+mover  → mueve aunque no esté seleccionada (medio segundo)
     dos toques      → abre la ficha del coche
     La duración NUNCA se cambia arrastrando con el dedo: un dedo de
     40 px sobre un tirador de borde no puede ser preciso, y cada intento
     de hacerlo convivir con "mover" acabó con los gestos pisándose y
     reservas de 3 días convertidas en 1 (o en 9). Botones: exactos.

   CON RATÓN:
     los tiradores de los bordes estiran (bolitas al seleccionar), la
     barra mueve, doble clic abre la ficha. La barrita −/+ también está.

   Tres reglas que sostienen la precisión:
   1. Se guarda EXACTAMENTE lo que se ve: el salto se calcula durante el
      arrastre con histéresis (no titubea entre dos días) y al soltar se
      aplica ese mismo valor, nunca la posición del dedo al levantarse.
   2. Mientras hay un gesto en marcha la rejilla NO se repinta: Firestore
      devuelve cada guardado como snapshot y el repintado destruía la
      barra en mitad del arrastre.
   3. Una barra recortada por el cambio de semana declara sus días reales
      («9 días ›»): lo que se ve corto puede ser un trabajo largo que
      continúa la semana siguiente. Eso no es un fallo, es el calendario.
   ═══════════════════════════════════════════════════════════════════════ */
let resSel = null;          // id de la reserva seleccionada
let gestoEnCurso = false;   // hay un dedo arrastrando: no repintar
let repintaPend  = false;   // llegó un cambio durante el gesto
function flushRepinta(){ if(repintaPend){ repintaPend=false; pintar(); } }

let resSelLun = null;      // semana del trozo tocado, para poner ahí la barrita
function seleccionarRes(id, tocado){
  resSel = id;
  document.querySelectorAll('.res.sel').forEach(x=>{
    x.classList.remove('sel');
    const tb=x.querySelector('.mini-dias'); if(tb) tb.remove();
  });
  if(!id){ resSelLun=null; return; }
  if(tocado){
    const p = tocado.closest('.rej-pista');
    resSelLun = p ? p.dataset.lunes : null;
  }
  /* Un trabajo largo pinta un trozo de barra en cada semana: se marcan
     todos, y la barrita −/+ va sobre el trozo que se tocó (o el primero). */
  const trozos = [...document.querySelectorAll(`.res[data-t="${id}"]`)];
  trozos.forEach(x=>x.classList.add('sel'));
  const pref = trozos.find(x=>{
    const p=x.closest('.rej-pista'); return p && p.dataset.lunes===resSelLun;
  }) || trozos[0];
  if(pref) montarMiniDias(pref, id);
}

/* La barrita de arriba de la reserva seleccionada: dice los días REALES
   del trabajo (la barra puede verse corta porque el resto cae en la
   semana siguiente) y los cambia de uno en uno. En la tablet esto
   sustituye por completo al estirado con el dedo. */
function montarMiniDias(el, id){
  const t = D.trabajos.find(x=>x.id===id);
  if(!t || el.querySelector('.mini-dias')) return;
  const tb = document.createElement('span');
  tb.className = 'mini-dias';
  tb.innerHTML = `<span class="md-b" data-md="-1">−</span>`
    + `<span class="md-n">${t.dias} ${t.dias===1?'día':'días'}</span>`
    + `<span class="md-b" data-md="1">+</span>`;
  tb.addEventListener('click', ev=>{
    ev.stopPropagation(); ev.preventDefault();
    const b = ev.target.closest ? ev.target.closest('[data-md]') : null;
    if(b) cambiarDias(id, +b.dataset.md);
  });
  el.appendChild(tb);
}

function cambiarDias(id, delta){
  const t = D.trabajos.find(x=>x.id===id); if(!t) return;
  const nuevos = Math.max(1, t.dias + delta);
  if(nuevos === t.dias) return;
  const ch = pisaA({...t, dias:nuevos}, t.entra, nuevos);
  if(ch.length && !confirm(`Así pisa a ${ch.map(o=>o.coche).join(' y ')}.\n¿Lo dejas igual?`)) return;
  t.dias = nuevos;
  guardar(); pintar();      // pintar reconstruye la barrita con el número nuevo
}
/* Un toque fuera deselecciona: si no, los tiradores se quedan puestos y
   vuelve el riesgo de estirar sin querer. */
document.addEventListener('pointerdown', ev=>{
  if(resSel && !(ev.target.closest && ev.target.closest('.res'))) seleccionarRes(null);
}, true);

function montarArrastre(el){
  let t0=null, x0=0, y0=0, moviendo=false, modo='mover',
      anchoDia=0, altoFila=0, base=null, tactil=false, armado=false, espera=null,
      cancelado=false,
      saltoDias=0, saltoFilas=0,     // salto que se está VIENDO en pantalla
      diasPrev=0, entraPrev='',      // resultado exacto de la vista previa
      chip=null;

  /* El día solo cambia cuando el dedo pasa con claridad al siguiente
     (más de medio día y pico). Sin este margen, en la frontera exacta
     entre dos días la barra titubeaba sola: se estiraba y se acortaba
     con el temblor natural del dedo. */
  const encajar = (crudo, actual) =>
    Math.abs(crudo - actual) > 0.55 ? Math.round(crudo) : actual;

  function ponChip(txt){
    if(!chip){ chip=document.createElement('span'); chip.className='chip-dias'; el.appendChild(chip); }
    chip.textContent = txt;
  }
  function quitaChip(){ if(chip){ chip.remove(); chip=null; } }

  el.addEventListener('pointerdown', ev=>{
    /* Los toques en la barrita −/+ son botones, no gestos. */
    if(ev.target && ev.target.closest && ev.target.closest('.mini-dias')) return;
    if(ev.button !== undefined && ev.button !== 0) return;
    if(gestoEnCurso) return;                     // un dedo a la vez
    t0 = D.trabajos.find(x=>x.id===el.dataset.t);
    if(!t0) return;
    const pista = el.closest('.rej-pista');
    if(!pista) return;
    tactil = ev.pointerType === 'touch';
    gestoEnCurso = true;

    /* Qué se va a hacer con este gesto. Con el dedo, estirar solo está
       disponible si la reserva ya está seleccionada; con ratón, siempre,
       porque el puntero es preciso y los tiradores se ven al pasar. */
    const enTira = (ev.target && ev.target.dataset && ev.target.dataset.tira) || null;
    const seleccionada = el.classList.contains('sel');
    const puedeEstirar = !tactil || seleccionada;
    modo = (enTira && puedeEstirar) ? enTira : 'mover';
    /* Estirar es horizontal puro: se toma el control del gesto ya, sin
       esperar, porque el dedo está sobre un tirador y no hay duda. */
    if(modo !== 'mover') el.style.touchAction = 'none';
    /* Si el navegador venía de marcar algo, se limpia antes de empezar. */
    const sel = window.getSelection && window.getSelection();
    if(sel && sel.rangeCount) sel.removeAllRanges();

    /* Seleccionada, el gesto engancha al momento también para mover:
       quien la seleccionó lo hizo a propósito, no está pasando página
       (el CSS de .sel ya tiene touch-action:none desde antes de tocar,
       que es cuando el navegador lo consulta). Sin seleccionar, mover
       pide mantener medio segundo, como siempre. */
    armado = !tactil || modo !== 'mover' || seleccionada;
    clearTimeout(espera);
    if(!armado){
      espera = setTimeout(()=>{
        armado = true;
        el.classList.add('listo');
        /* A partir de aquí el gesto es nuestro en los dos ejes. Sin esto,
           el movimiento vertical lo interpretaba el navegador como
           desplazamiento de página y era imposible pasar un coche a otra
           plaza: el arrastre se cancelaba a mitad. */
        el.style.touchAction = 'none';
        if(navigator.vibrate) navigator.vibrate(12);
      }, 450);
    }

    x0=ev.clientX; y0=ev.clientY;
    anchoDia = pista.getBoundingClientRect().width / 7;
    altoFila = (el.closest('.rej-fila')||pista).getBoundingClientRect().height;
    base = {left: el.offsetLeft, width: el.offsetWidth};
    moviendo=false; cancelado=false;
    saltoDias=0; saltoFilas=0; diasPrev=t0.dias; entraPrev=t0.entra;
    el.setPointerCapture(ev.pointerId);
  });

  el.addEventListener('pointermove', ev=>{
    if(!t0) return;
    const dx=ev.clientX-x0, dy=ev.clientY-y0;
    if(!armado){
      /* El dedo se ha ido antes de tiempo: es un desplazamiento de la
         página. Se anula el gesto y se marca como cancelado, para que al
         soltar no cuente como toque y seleccione o abra algo sin querer. */
      if(Math.abs(dx) > 8 || Math.abs(dy) > 8){
        clearTimeout(espera); t0=null; cancelado=true;
        gestoEnCurso=false; flushRepinta();
      }
      return;
    }
    if(!moviendo && Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    if(!moviendo){
      /* Empieza el arrastre de verdad: la barrita −/+ se quita para que
         no viaje pegada a la barra; pintar() la recrea al soltar. */
      const tb = el.querySelector('.mini-dias'); if(tb) tb.remove();
    }
    moviendo=true;
    ev.preventDefault();
    el.classList.add('arrastrando');

    /* La vista previa salta de día en día con histéresis, y lo que se ve
       es literalmente lo que se guardará al soltar: los mismos saltoDias
       y diasPrev de aquí son los que aplica el pointerup. El chip encima
       de la barra lo dice en palabras, por si el dedo tapa la rejilla. */
    if(modo==='mover'){
      saltoDias  = encajar(dx/anchoDia, saltoDias);
      saltoFilas = encajar(dy/altoFila, saltoFilas);
      el.style.transform = `translate(${saltoDias*anchoDia}px, ${saltoFilas*altoFila}px)`;
      ponChip('entra '+fCorta(sumar(aFecha(t0.entra), saltoDias))
              +' · '+t0.dias+(t0.dias===1?' día':' días'));
    }else if(modo==='der'){
      saltoDias = encajar(dx/anchoDia, saltoDias);
      diasPrev  = Math.max(1, t0.dias + saltoDias);
      entraPrev = t0.entra;
      el.style.width = Math.max(26, base.width + (diasPrev - t0.dias)*anchoDia)+'px';
      ponChip(diasPrev + (diasPrev===1?' día':' días'));
    }else{
      saltoDias = encajar(dx/anchoDia, saltoDias);
      diasPrev  = Math.max(1, t0.dias - saltoDias);
      const corr = t0.dias - diasPrev;             // días que entran o salen por delante
      entraPrev = aIso(sumar(aFecha(t0.entra), corr));
      el.style.left  = (base.left + corr*anchoDia)+'px';
      el.style.width = Math.max(26, base.width - corr*anchoDia)+'px';
      ponChip(diasPrev + (diasPrev===1?' día':' días'));
    }
  });

  el.addEventListener('pointerup', ev=>{
    if(ev.target && ev.target.closest && ev.target.closest('.mini-dias')){ flushRepinta(); return; }
    clearTimeout(espera);
    el.classList.remove('listo');
    el.style.touchAction='';
    gestoEnCurso=false;
    quitaChip();
    if(!t0){ if(!moviendo && !cancelado) toque(); flushRepinta(); return; }
    const trabajo=t0;
    t0=null;
    el.classList.remove('arrastrando');
    el.style.transform=''; el.style.width=''; el.style.left='';

    if(!moviendo){ toque(); flushRepinta(); return; }

    /* ── estirar por un extremo ──
       Se aplica EXACTAMENTE lo que decía el chip. Nada se recalcula con
       la posición del dedo al soltar: en la tablet el dedo rueda al
       levantarse y ese corrimiento era el que sumaba o quitaba días. */
    if(modo!=='mover'){
      if(diasPrev!==trabajo.dias || entraPrev!==trabajo.entra){
        /* Primero se comprueba el choque sobre una copia; el trabajo real
           solo se toca si se confirma. Antes se mutaba antes de preguntar
           y al decir "no" el cambio quedaba hecho igual en memoria. */
        const cand = {...trabajo, entra:entraPrev, dias:diasPrev};
        const ch = pisaA(cand, entraPrev, diasPrev);
        if(ch.length && !confirm(`Así pisa a ${ch.map(o=>o.coche).join(' y ')}.\n¿Lo dejas igual?`)){
          pintar(); return;
        }
        trabajo.entra = entraPrev;
        trabajo.dias  = diasPrev;
        guardar();
      }
      pintar(); return;
    }

    /* Mover: el destino sale del salto que se estaba viendo, no de dónde
       quedó el dedo. La pista de destino se busca en el punto al que
       saltó la vista previa, que es donde el ojo vio caer la barra. */
    el.style.pointerEvents='none';
    const px = Math.max(0, Math.min(window.innerWidth -1, x0 + saltoDias *anchoDia));
    const py = Math.max(0, Math.min(window.innerHeight-1, y0 + saltoFilas*altoFila));
    const bajo = document.elementFromPoint(px, py);
    el.style.pointerEvents='';
    const pista = bajo && bajo.closest ? bajo.closest('.rej-pista') : null;
    if(!pista) { pintar(); return; }

    const nuevaPlaza = +pista.dataset.plaza;
    if(saltoDias===0 && nuevaPlaza===trabajo.plaza){ pintar(); return; }  // no se movió

    const nuevaEntra = aIso(sumar(aFecha(trabajo.entra), saltoDias));
    const choca = pisaA({...trabajo, plaza:nuevaPlaza}, nuevaEntra, trabajo.dias);
    if(choca.length && !confirm(
        `Ahí ya está ${choca.map(o=>o.coche).join(' y ')}.\n¿Lo pones igual?`)){
      pintar(); return;
    }
    trabajo.entra = nuevaEntra;
    trabajo.plaza = nuevaPlaza;
    guardar(); pintar();
  });

  /* Un toque selecciona; dos seguidos abren la ficha. El segundo toque se
     cuenta hasta 320 ms después del primero, que es el margen habitual
     para un doble toque sin que se dispare escribiendo. */
  let ultimoToque = 0;
  function toque(){
    const id = el.dataset.t;
    const ahora = Date.now();
    if(ahora - ultimoToque < 320){
      ultimoToque = 0;
      seleccionarRes(null);
      abrirAcciones(id);
      return;
    }
    ultimoToque = ahora;
    seleccionarRes(resSel === id ? null : id, el);
  }

  el.addEventListener('pointercancel', ()=>{
    clearTimeout(espera); t0=null;
    gestoEnCurso=false; quitaChip();
    el.classList.remove('arrastrando'); el.classList.remove('listo');
    el.style.transform=''; el.style.width=''; el.style.left=''; el.style.touchAction='';
    flushRepinta();
  });
  /* Última barrera: aunque el navegador ignore el CSS, aquí no empieza
     ninguna selección. */
  el.addEventListener('selectstart', ev=>ev.preventDefault());
  el.addEventListener('contextmenu', ev=>{ if(tactil) ev.preventDefault(); });

  /* Doble clic de ratón. Con el dedo no hace falta: el doble toque ya se
     resuelve arriba, y si no se filtra aquí la ficha se abriría dos veces. */
  el.addEventListener('dblclick', ev=>{
    if(ev.target && ev.target.closest && ev.target.closest('.mini-dias')) return;
    if(tactil) return;
    ev.preventDefault();
    abrirAcciones(el.dataset.t);
  });
}

/* ─── acciones rápidas ─────────────────────────────────────────────────
   Pensado para tablet: un toque en la barra abre esto, no el formulario
   entero. El 90 % de lo que hace Joaquin en el dia es cambiar el estado
   o cobrar, y eso aqui es un solo toque con botones grandes.          */
const SIGUIENTE = [
  {k:'curso',      t:'Ya entró',            ico:'→'},
  {k:'espera',     t:'Esperando algo',      ico:'⏸'},
  {k:'sinrecoger', t:'Listo, sin recoger',  ico:'✓'},
  {k:'entregado',  t:'Entregado y cerrado', ico:'✓✓'}
];

/* En una tablet el teclado ocupa media pantalla. Que salte solo al abrir
   un panel tapa el formulario antes de que se haya leído nada. Con el dedo
   se deja que sea la persona quien decida cuándo escribir; con ratón, donde
   el teclado no estorba, se enfoca como siempre. */
const conDedo = () => !!(window.matchMedia && window.matchMedia('(hover:none)').matches);
function enfocar(sel){ if(conDedo()) return; const el=$(sel); if(el) el.focus(); }

function abrirAcciones(id){
  const t = D.trabajos.find(x=>x.id===id);
  if(!t) return;
  const pend = pendiente(t), co = cobrado(t);
  const plaza = (plazas().find(p=>p.id===t.plaza)||{}).nom || ('Plaza '+t.plaza);

  $('#hojaC').innerHTML = `
    <div class="acc-cab">
      <b>${esc(t.coche)}</b>
      <span>${esc(t.servicio)}${t.cliente?' · '+esc(t.cliente):''}</span>
      <span>${plaza} · ${fCorta(aFecha(t.entra))} a ${fCorta(salida(t))} · ${t.dias} día${t.dias>1?'s':''}</span>
      ${t.avisarCliente?`<span class="acc-avisar">Se le cambió la fecha · falta avisarle</span>`:''}
      ${t.presupuesto?`<span class="acc-eur">${eur(t.presupuesto)} €
        ${co?` · cobrado ${eur(co)} €`:''}
        ${pend?`<b class="debe"> · faltan ${eur(pend)} €</b>`:(t.presupuesto?' · cobrado del todo':'')}</span>`:''}
    </div>

    <div class="acc-grid">
      ${SIGUIENTE.map(o=>`<button class="acc-btn${t.estado===o.k?' ahora':''}" data-est="${o.k}">
        <i>${o.ico}</i><span>${o.t}</span></button>`).join('')}
    </div>

    ${t.avisarCliente?`<button class="acc-btn ancho" data-avisado="1">
      <i>✓</i><span>Ya le he avisado del cambio de fecha</span></button>`:''}

    <div class="acc-sub">Se alarga</div>
    <div class="acc-grid tres">
      <button class="acc-btn" data-mas="1"><i>+1</i><span>un día</span></button>
      <button class="acc-btn" data-mas="2"><i>+2</i><span>dos días</span></button>
      <button class="acc-btn" data-mas="-1"><i>−1</i><span>un día menos</span></button>
    </div>

    ${pend?`<button class="acc-btn ancho cobrar" data-cobrar="${pend}">
      <i>€</i><span>Cobrar ${eur(pend)} €</span></button>`:''}

    <div class="acc">
      <button class="btn" type="button" data-cerrar>Cerrar</button>
      <button class="btn pri" type="button" id="a-edit">Editar todo</button>
    </div>`;
  $('#hoja').classList.add('on');

  $('#hojaC').querySelectorAll('[data-est]').forEach(b=>b.addEventListener('click',()=>{
    t.estado = b.dataset.est;
    /* Si se entrega hoy y aun quedaba tiempo por delante, se ajustan los dias
       reales: es lo que despues alimenta la tabla de duraciones. */
    if(t.estado==='entregado' && salida(t) > hoy){
      t.dias = Math.max(1, diasEntre(aFecha(t.entra), hoy) + 1);
    }
    cerrar(); guardar(); pintar();
  }));

  const av=$('#hojaC').querySelector('[data-avisado]');
  if(av) av.addEventListener('click',()=>{ delete t.avisarCliente; cerrar(); guardar(); pintar(); });

  $('#hojaC').querySelectorAll('[data-mas]').forEach(b=>b.addEventListener('click',()=>{
    const nuevos = Math.max(1, t.dias + (+b.dataset.mas));
    if(nuevos === t.dias) return;
    const pisados = pisaA(t, t.entra, nuevos);
    if(pisados.length){ cerrar(); abrirConflicto(t, nuevos, pisados); return; }
    t.dias = nuevos; cerrar(); guardar(); pintar();
  }));

  const cob=$('#hojaC').querySelector('[data-cobrar]');
  if(cob) cob.addEventListener('click',()=>{ cerrar(); abrirCobroRapido(t.id, +cob.dataset.cobrar); });

  $('#a-edit').addEventListener('click',()=>{ cerrar(); abrirTrabajo(id); });
}

/* Qué hacer cuando alargar un trabajo pisa al siguiente. Se resuelve aqui
   mismo: o se mueve el afectado de plaza, o se retrasa. Nunca se deja el
   choque escondido, porque eso acaba en dos coches y una plaza. */
function abrirConflicto(t, nuevosDias, pisados){
  const finNuevo = sumar(aFecha(t.entra), nuevosDias-1);

  const opciones = pisados.map(o=>({
    o,
    libres: plazasLibres(o, o.entra, o.dias),
    nuevaEntrada: aIso(sumar(finNuevo, 1)),
    diasRetraso: diasEntre(aFecha(o.entra), sumar(finNuevo, 1))
  }));

  $('#hojaC').innerHTML = `<h3>Eso pisa a otro coche</h3>
    <div class="conf-cab">
      Si <b>${esc(t.coche)}</b> se queda ${nuevosDias} día${nuevosDias>1?'s':''},
      sale el <b>${fCorta(finNuevo)}</b> y ocupa la ${esc((plazas().find(p=>p.id===t.plaza)||{}).nom||'plaza')}
      hasta entonces.
    </div>
    ${opciones.map((x,i)=>`
      <div class="conf">
        <div class="conf-t"><b>${esc(x.o.coche)}</b>
          <span>${esc(x.o.servicio)} · entra el ${fCorta(aFecha(x.o.entra))}</span></div>
        <div class="acc-grid">
          <button class="acc-btn" data-retrasar="${i}">
            <i>→</i><span>Retrasarlo al ${fCorta(sumar(finNuevo,1))}<br>
            <em>${x.diasRetraso} día${x.diasRetraso>1?'s':''} más tarde</em></span></button>
          ${x.libres.length
            ? `<button class="acc-btn" data-mover="${i}"><i>⇄</i>
                 <span>Moverlo a ${esc(x.libres[0].nom)}<br><em>mismas fechas</em></span></button>`
            : `<button class="acc-btn" disabled><i>✕</i><span>No hay plaza libre<br><em>esos días</em></span></button>`}
        </div>
      </div>`).join('')}
    <div class="acc">
      <button class="btn" type="button" data-cerrar>Dejarlo como está</button>
      <button class="btn borrar" type="button" id="cf-igual">Alargar igual</button>
    </div>`;
  $('#hoja').classList.add('on');

  const aplicar = () => { t.dias = nuevosDias; cerrar(); guardar(); pintar(); };

  $('#hojaC').querySelectorAll('[data-retrasar]').forEach(b=>b.addEventListener('click',()=>{
    const x = opciones[+b.dataset.retrasar];
    x.o.entra = aIso(sumar(finNuevo,1));
    x.o.avisarCliente = true;              // queda marcado: hay que llamarle
    aplicar();
  }));
  $('#hojaC').querySelectorAll('[data-mover]').forEach(b=>b.addEventListener('click',()=>{
    const x = opciones[+b.dataset.mover];
    x.o.plaza = x.libres[0].id;
    aplicar();
  }));
  $('#cf-igual').addEventListener('click', aplicar);
}

/* Cobro en dos toques: el importe viene puesto, solo elige forma de pago. */
function abrirCobroRapido(trabajoId, sugerido){
  const t = D.trabajos.find(x=>x.id===trabajoId); if(!t) return;
  $('#hojaC').innerHTML = `<h3>Cobrar · ${esc(t.coche)}</h3>
    <div class="campo"><label for="cr-imp">Importe (€)</label>
      <input type="number" id="cr-imp" value="${sugerido||''}" inputmode="decimal"></div>
    <div class="campo"><label>Cómo ha pagado</label>
      <div class="acc-grid tres">${VIAS_COBRO.map(v=>`<button class="acc-btn via" data-via="${v}">

/* Vaciar movimientos. Va en Ajustes y pide escribir una palabra: es
   irreversible y no debe poder dispararse por un toque accidental. */
async function vaciarMovimientos(){
  const n = D.cobros.length + D.gastos.length;
  if(!n){ alert('No hay ingresos ni gastos que borrar.'); return; }
  const p = prompt(`Se van a borrar ${D.cobros.length} ingresos y ${D.gastos.length} gastos.\n`+
    `Los trabajos, clientes y ajustes NO se tocan.\n\n`+
    `Esto no se puede deshacer. Escribe BORRAR para confirmar:`);
  if(p !== 'BORRAR') return;

  const antes = $('#cuerpo');
  if(antes) antes.innerHTML = '<div class="cargando">Borrando…</div>';
  try{
    for(const col of ['cobros','gastos']){
      const ids = (D[col]||[]).map(x=>x.id).filter(Boolean);
      for(const id of ids) await borrarDoc(col, id);
      D[col] = [];
      [...sincronizado.keys()].forEach(k=>{ if(k.startsWith(col+'/')) sincronizado.delete(k); });
    }
    pintar();
    alert(`Borrados ${n} movimientos. Ya puedes volver a importar.`);
  }catch(e){
    console.warn(e);
    alert('Se ha cortado el borrado: '+(e.code||e.message));
  }
}

/* ─── fijos del mes ────────────────────────────────────────────────── */
function generarFijos(){
  const marca=`${hoy.getFullYear()}-${p2(hoy.getMonth()+1)}`;
  const ya=new Set(D.gastos.filter(g=>String(g.fecha).startsWith(marca)&&g.origenFijo).map(g=>g.origenFijo));
  const falta=D.fijos.filter(f=>!ya.has(f.id));
  falta.forEach(f=>D.gastos.push({id:nid(),fecha:`${marca}-${p2(Math.min(28,f.dia||1))}`,
    concepto:f.concepto,importe:f.importe,via:f.via||'Banco',categoria:f.categoria||'fijo',
    fijo:true, origenFijo:f.id}));
  guardar(); pintar();
  alert(falta.length?`Se han añadido ${falta.length} gastos fijos de este mes.`
                    :'Los fijos de este mes ya estaban puestos.');
}
